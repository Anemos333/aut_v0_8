name: Profile detector high range v1

on:
  push:
    branches:
      - v1-lean-scale-generation-ablation-v1
    paths:
      - Tests/DetectorHighRangeDiagnostic.cpp
      - .github/workflows/profile-detector-high-range-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: v1-lean-scale-generation-ablation-v1

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y             libasound2-dev libjack-jackd2-dev ladspa-sdk             libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev             libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Build diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/DetectorHighRangeDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-detector-high             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-detector-high --config Release --parallel 2             --target SupervisorContinuityTest >/dev/null

      - name: Measure high-range path roles
        shell: bash
        run: |
          set -euo pipefail
          ./build-detector-high/clean-engine-tests/SupervisorContinuityTest             2>&1 | tee /tmp/detector-high-range.log
          grep -q '^PATH_STRESS ' /tmp/detector-high-range.log
          echo 'DETECTOR_HIGH_RANGE_PROFILE=PASS'
