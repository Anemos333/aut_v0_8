name: Diagnose local second observation v1

on:
  push:
    branches:
      - v1-continuous-f0-contract-v1
    paths:
      - Tests/LocalSecondObservationDiagnostic.cpp
      - .github/workflows/diagnose-local-second-observation-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1-continuous-f0-contract-v1

      - name: Dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y             libasound2-dev libjack-jackd2-dev ladspa-sdk             libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev             libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Build and run
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/LocalSecondObservationDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-local-second             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-local-second --config Release --parallel 2             --target SupervisorContinuityTest >/dev/null
          ./build-local-second/clean-engine-tests/SupervisorContinuityTest             | tee /tmp/local-second.log
          grep -q '^LOCAL_SECOND_OBSERVATION ' /tmp/local-second.log

      - name: Summarize
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, statistics
          rows=[]
          for line in Path('/tmp/local-second.log').read_text().splitlines():
              if not line.startswith('LOCAL_SECOND_OBSERVATION '):
                  continue
              d=dict(re.findall(r'(\w+)=([^ ]+)', line))
              d['radius']=float(d['radius'])
              d['proposal_error']=float(d['proposal_error'])
              d['refined_error']=float(d['refined_error'])
              d['improves']=int(d['improves'])
              d['pass_1p5']=int(d['pass_1p5'])
              d['us']=float(d['us'])
              rows.append(d)

          keys=sorted(set((r['metric'],r['radius']) for r in rows))
          for metric,radius in keys:
              subset=[r for r in rows if r['metric']==metric and r['radius']==radius]
              if not subset:
                  continue
              abs_err=[abs(r['refined_error']) for r in subset]
              print(
                  'LOCAL_SECOND_SUMMARY'
                  f' metric={metric}'
                  f' radius={radius:.1f}'
                  f' cases={len(subset)}'
                  f' improve_fraction={sum(r["improves"] for r in subset)/len(subset):.6f}'
                  f' pass_1p5_fraction={sum(r["pass_1p5"] for r in subset)/len(subset):.6f}'
                  f' median_abs_cents={statistics.median(abs_err):.6f}'
                  f' worst_abs_cents={max(abs_err):.6f}'
                  f' median_us={statistics.median(r["us"] for r in subset):.6f}'
              )
          PY
