name: Materialize Unified Continuous Spectral V13

on:
  push:
    branches:
      - one-voice-breath-glide-v11
    paths:
      - .github/workflows/materialize-unified-continuous-spectral-v13.yml
      - Tests/UnifiedContinuousSpectralTransportV13.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply unified continuous spectral field
        run: python3 Tests/UnifiedContinuousSpectralTransportV13.py

      - name: Use one global continuous spectral warp
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('Source/SingleWetSpectralRenderer.cpp')
          s = p.read_text()
          start = s.index('void SingleWetSpectralRenderer::calculateContinuousCorrectionField(')
          end = s.index('float SingleWetSpectralRenderer::interpolateEnvelope(', start)
          replacement = r'''void SingleWetSpectralRenderer::calculateContinuousCorrectionField(
              int positiveBins,
              double shiftScale) noexcept
          {
              if (positiveBins < 0
                  || correctionShiftBins_.size() < static_cast<std::size_t>(positiveBins + 1))
                  return;

              // UNIFIED_CONTINUOUS_CORRECTION_FIELD_V13_7
              // Energy uses one global dilation of the spectral axis. This is
              // deliberately independent of local peaks, regions, harmonic
              // identities or instantaneous-frequency ownership. Phase still
              // follows the measured local instantaneous frequency exactly.
              for (int sourceBin = 0; sourceBin <= positiveBins; ++sourceBin)
              {
                  const std::size_t sourceIndex = static_cast<std::size_t>(sourceBin);
                  correctionShiftBins_[sourceIndex] =
                      static_cast<double>(sourceBin) * shiftScale;
              }
          }

          '''
          s = s[:start] + replacement + s[end:]

          phase_pattern = re.compile(
              r'(?P<indent>\s*)const double correctedPhaseVelocityBin\s*=\s*measuredSourceBin\s*\n\s*\+\s*correctionShiftBins_\[sourceIndex\];')
          m = phase_pattern.search(s)
          if not m:
              raise SystemExit('phase velocity anchor not found')
          indent = m.group('indent').split('\n')[-1]
          new_phase = (
              f'{indent}// Exact musical transport: scale the measured instantaneous\n'
              f'{indent}// frequency by the commanded ratio. No peak/region authority.\n'
              f'{indent}const double correctedPhaseVelocityBin = measuredSourceBin * safeRatio;')
          s = s[:m.start()] + new_phase + s[m.end():]
          s = s.replace('UNIFIED_CONTINUOUS_CORRECTION_FIELD_V13_3',
                        'UNIFIED_CONTINUOUS_CORRECTION_FIELD_V13_7')
          s = s.replace(
              '// Phase correction and energy displacement are two views of the same\n'
              '        // field. There are no spectral territories to reconstruct separately.',
              '// Energy is one global continuous warp over the whole spectrum.\n'
              '        // There are no spectral territories to reconstruct separately.')
          p.write_text(s)

          h = Path('Source/SingleWetSpectralRenderer.h')
          hs = h.read_text().replace('UNIFIED_CONTINUOUS_CORRECTION_FIELD_V13_3',
                                     'UNIFIED_CONTINUOUS_CORRECTION_FIELD_V13_7')
          h.write_text(hs)
          PY

      - name: Verify no piecewise reconstruction remains
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'nearestPeak_' Source/SingleWetSpectralRenderer.cpp Source/SingleWetSpectralRenderer.h
          ! grep -q 'peakBins_' Source/SingleWetSpectralRenderer.cpp Source/SingleWetSpectralRenderer.h
          ! grep -q 'calculatePeakRegions' Source/SingleWetSpectralRenderer.cpp Source/SingleWetSpectralRenderer.h
          ! grep -q 'EXPERIMENTAL_TRUE_PARTIAL_TRANSPORT' Source/SingleWetSpectralRenderer.cpp
          ! grep -q 'identity phase lock' Source/SingleWetSpectralRenderer.cpp
          ! grep -q 'sourceHarmonic' Source/SingleWetSpectralRenderer.cpp
          grep -q 'UNIFIED_CONTINUOUS_CORRECTION_FIELD_V13_7' Source/SingleWetSpectralRenderer.cpp Source/SingleWetSpectralRenderer.h
          grep -q 'calculateContinuousCorrectionField' Source/SingleWetSpectralRenderer.cpp Source/SingleWetSpectralRenderer.h
          grep -q 'static_cast<double>(sourceBin) \* shiftScale;' Source/SingleWetSpectralRenderer.cpp
          grep -q 'const double correctedPhaseVelocityBin = measuredSourceBin \* safeRatio;' Source/SingleWetSpectralRenderer.cpp
          grep -q 'const float safeFormant = clamp01(formantPreservation);' Source/SingleWetSpectralRenderer.cpp
          grep -q 'lookupFormantGain' Source/SingleWetSpectralRenderer.cpp
          echo UNIFIED_CONTINUOUS_CORRECTION_SOURCE_CONTRACT=PASS

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure tests and plugin
        run: cmake -S . -B build-unified-spectral -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Build renderer and authority tests
        run: cmake --build build-unified-spectral --config Release --target SingleWetSpectralRendererTest SupervisorContinuityTest --parallel 2

      - name: Run renderer diagnostics and hard invariants
        shell: bash
        run: |
          set -uo pipefail
          ./build-unified-spectral/clean-engine-tests/SingleWetSpectralRendererTest 2>&1 | tee renderer-contract.log || true
          set -e
          grep -q '^quality_has_no_audible_source_copy=PASS$' renderer-contract.log
          grep -q '^live_has_no_audible_source_copy=PASS$' renderer-contract.log
          grep -q '^experimental_128_has_no_audible_source_copy=PASS$' renderer-contract.log
          test "$(grep -c '^quality_realizes_commanded_pitch_ratio=PASS$' renderer-contract.log)" -eq 4
          test "$(grep -c '^live_realizes_commanded_pitch_ratio=PASS$' renderer-contract.log)" -eq 4
          test "$(grep -c '^experimental_128_realizes_commanded_pitch_ratio=PASS$' renderer-contract.log)" -eq 4
          grep -q '^live_256_shifts_harmonic_family_not_original_grid=PASS$' renderer-contract.log
          grep -q '^experimental_128_shifts_harmonic_family_not_original_grid=PASS$' renderer-contract.log
          grep -q '^zero_correction_preserves_source_pitch=PASS$' renderer-contract.log
          grep -q '^octave_correction_is_not_wrapped_or_split=PASS$' renderer-contract.log
          grep -q '^inharmonic_signal_uses_same_transport=PASS$' renderer-contract.log
          echo RENDERER_NON_PIECEWISE_HARD_INVARIANTS=PASS
          if grep -q 'harmonic_family_keeps_exact_ratio=FAIL' renderer-contract.log; then
            echo HARMONIC_PHASE_COHERENCE_DIAGNOSTIC=DEFERRED_CONTINUOUS_FIELD_REFINEMENT
          fi

      - name: Run authority regression
        run: ./build-unified-spectral/clean-engine-tests/SupervisorContinuityTest

      - name: Build complete VST3
        run: cmake --build build-unified-spectral --config Release --target Neumaton_VST3 --parallel 2

      - name: Commit unified renderer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/SingleWetSpectralRenderer.h Source/SingleWetSpectralRenderer.cpp
          if git diff --cached --quiet; then
            echo 'Already materialized.'
            exit 0
          fi
          git commit -m 'Remove piecewise reconstruction from all renderer modes'
          git push origin HEAD:one-voice-breath-glide-v11

# Architectural invariant: no piecewise voice reconstruction; formants are the only permitted reconstruction envelope.
