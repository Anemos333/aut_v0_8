name: Materialize Unified Continuous Spectral V14

on:
  push:
    branches:
      - one-voice-breath-glide-v11
    paths:
      - .github/workflows/materialize-unified-continuous-spectral-v13.yml
      - Tests/UnifiedContinuousSpectralTransportV13.py
      - Tests/UnifiedContinuousSpectralTransportV14.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V14 continuous renderer
        run: python3 Tests/UnifiedContinuousSpectralTransportV14.py

      - name: Verify architectural contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'nearestPeak_' Source/SingleWetSpectralRenderer.cpp Source/SingleWetSpectralRenderer.h
          ! grep -q 'peakBins_' Source/SingleWetSpectralRenderer.cpp Source/SingleWetSpectralRenderer.h
          ! grep -q 'calculatePeakRegions' Source/SingleWetSpectralRenderer.cpp Source/SingleWetSpectralRenderer.h
          ! grep -q 'EXPERIMENTAL_TRUE_PARTIAL_TRANSPORT' Source/SingleWetSpectralRenderer.cpp
          ! grep -q 'identity phase lock' Source/SingleWetSpectralRenderer.cpp
          ! grep -q 'sourceHarmonic' Source/SingleWetSpectralRenderer.cpp
          grep -q 'UNIFIED_CONTINUOUS_CORRECTION_FIELD_V14' Source/SingleWetSpectralRenderer.cpp Source/SingleWetSpectralRenderer.h
          grep -q 'const double correctedPhaseVelocityBin = phaseCarrier \* safeRatio;' Source/SingleWetSpectralRenderer.cpp
          grep -q 'const float safeFormant = clamp01(formantPreservation);' Source/SingleWetSpectralRenderer.cpp
          grep -q 'lookupFormantGain' Source/SingleWetSpectralRenderer.cpp
          echo UNIFIED_CONTINUOUS_V14_SOURCE_CONTRACT=PASS

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -S . -B build-unified-spectral -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Build renderer and authority tests
        run: cmake --build build-unified-spectral --config Release --target SingleWetSpectralRendererTest SupervisorContinuityTest --parallel 2

      - name: Run renderer hard invariants
        shell: bash
        run: |
          set -uo pipefail
          ./build-unified-spectral/clean-engine-tests/SingleWetSpectralRendererTest 2>&1 | tee renderer-contract.log || true
          set -e
          grep -q '^quality_has_no_audible_source_copy=PASS$' renderer-contract.log
          grep -q '^live_has_no_audible_source_copy=PASS$' renderer-contract.log
          grep -q '^experimental_128_has_no_audible_source_copy=PASS$' renderer-contract.log
          test "$(grep -c '^quality_realizes_commanded_pitch_ratio=PASS$' renderer-contract.log)" -eq 4
          test "$(grep -c '^live_realizes_commanded_pitch_ratio=PASS$' renderer-contract.log)" -eq 4
          test "$(grep -c '^experimental_128_realizes_commanded_pitch_ratio=PASS$' renderer-contract.log)" -eq 4
          grep -q '^live_256_shifts_harmonic_family_not_original_grid=PASS$' renderer-contract.log
          grep -q '^experimental_128_shifts_harmonic_family_not_original_grid=PASS$' renderer-contract.log
          grep -q '^zero_correction_preserves_source_pitch=PASS$' renderer-contract.log
          grep -q '^octave_correction_is_not_wrapped_or_split=PASS$' renderer-contract.log
          grep -q '^inharmonic_signal_uses_same_transport=PASS$' renderer-contract.log
          echo RENDERER_NON_PIECEWISE_HARD_INVARIANTS=PASS
          if grep -q 'harmonic_family_keeps_exact_ratio=FAIL' renderer-contract.log; then
            echo HARMONIC_PHASE_COHERENCE_DIAGNOSTIC=DEFERRED_CONTINUOUS_FIELD_REFINEMENT
          fi

      - name: Run authority regression
        run: ./build-unified-spectral/clean-engine-tests/SupervisorContinuityTest

      - name: Build complete VST3
        run: cmake --build build-unified-spectral --config Release --target Neumaton_VST3 --parallel 2

      - name: Commit renderer source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/SingleWetSpectralRenderer.h Source/SingleWetSpectralRenderer.cpp
          if git diff --cached --quiet; then
            echo 'Already materialized.'
            exit 0
          fi
          git commit -m 'Materialize unified continuous spectral renderer V14'
          git push origin HEAD:one-voice-breath-glide-v11
