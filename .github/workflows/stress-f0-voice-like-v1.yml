name: Stress F0 detector on voice-like material
on:
  push:
    branches: [v1-f0-demolish-and-rebuild-v1]
    paths:
      - Tests/F0VoiceLikeStressProbe.cpp
      - Tests/F0HarmonicFamilyProbe.cpp
      - .github/workflows/stress-f0-voice-like-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: v1-f0-demolish-and-rebuild-v1 }
      - name: Build voice-like stress probe
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Wpedantic \
              Tests/F0VoiceLikeStressProbe.cpp \
              -o /tmp/f0-voice-like-stress-v1
      - name: Run stress diagnostic
        run: |
          /tmp/f0-voice-like-stress-v1 | tee /tmp/f0-voice-like-stress-v1.log
          grep '^VOICE_STRESS_SUMMARY' /tmp/f0-voice-like-stress-v1.log
          grep '^VOICE_STRESS_STRUCTURAL_SAFE=' /tmp/f0-voice-like-stress-v1.log
