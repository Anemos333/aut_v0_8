name: Probe Experimental 128 Release Gate

on:
  push:
    branches: [simple-fix-from-quality-baseline]
    paths:
      - '.github/workflows/probe-experimental-128-release-gate.yml'

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple-fix-from-quality-baseline
      - name: Add 128 to frozen renderer test in runner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Tests/SingleWetSpectralRendererTest.cpp')
          s=p.read_text()
          old='const std::array<int, 2> frameSizes { 512, 256 };'
          assert s.count(old)==1
          s=s.replace(old,'const std::array<int, 3> frameSizes { 512, 256, 128 };')
          p.write_text(s)
          PY
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev
      - name: Configure
        run: cmake -S . -B build-128 -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON
      - name: Build frozen renderer test
        run: cmake --build build-128 --config Release --target SingleWetSpectralRendererTest --parallel 2
      - name: Run 128 purity probe
        run: ./build-128/clean-engine-tests/SingleWetSpectralRendererTest
