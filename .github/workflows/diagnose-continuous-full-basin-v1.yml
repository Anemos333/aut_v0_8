name: Diagnose continuous full basin v1
on:
  push:
    branches: [v1-continuous-f0-recomposition-v1]
    paths:
      - Tests/ContinuousFullBasinDiagnostic.cpp
      - .github/workflows/diagnose-continuous-full-basin-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: v1-continuous-f0-recomposition-v1 }
      - run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev >/dev/null
      - run: |
          cp Tests/ContinuousFullBasinDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-basin -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-basin --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-basin/clean-engine-tests/SupervisorContinuityTest | tee /tmp/full-basin.log
          grep -q '^FULL_BASIN ' /tmp/full-basin.log
