name: Materialize Simple Target Authority

on:
  push:
    branches:
      - simple-fix-from-quality-baseline
    paths:
      - '.github/workflows/simple-target-authority-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: simple-fix-from-quality-baseline
          fetch-depth: 0

      - name: Verify frozen old renderer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "3080ba804cb038421b075d76f5eceec335c22396"
          test "$(git hash-object Source/SingleWetSpectralRenderer.h)" = "2b68b3b3d5dc0579cdab94f4969203ef876ef058"
          grep -Fq 'const double targetPosition = static_cast<double>(sourceBin) * safeRatio;' Source/SingleWetSpectralRenderer.cpp
          if grep -Eq 'nearestPeak_|peakBins_|secondaryLayer|delayedDry|dryTrust_|wetMix_' Source/SingleWetSpectralRenderer.cpp Source/SingleWetSpectralRenderer.h; then exit 1; fi

      - name: Materialize subtractive supervisor patch
        run: python3 Tests/MaterializeSimpleTargetAuthorityV1.py

      - name: Verify authority contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TARGET_AUTHORITY_TAIL_HOLD_V1' Source/ModernPitchEngine.cpp
          grep -q 'breath_cannot_release_existing_target_to_source' Tests/SupervisorContinuityTest.cpp
          grep -q 'pitchless_tail_never_glides_back_to_source' Tests/SupervisorContinuityTest.cpp
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "3080ba804cb038421b075d76f5eceec335c22396"
          test "$(git hash-object Source/SingleWetSpectralRenderer.h)" = "2b68b3b3d5dc0579cdab94f4969203ef876ef058"
          if grep -A18 -F 'if (state.targetValid && (confirmedBreath || confirmedAbsence))' Source/ModernPitchEngine.cpp | grep -q 'desiredCents = 0.0'; then exit 1; fi

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -S . -B build-simple -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Build focused invariants
        run: cmake --build build-simple --config Release --target CleanModernPitchEngineTest SupervisorContinuityTest SingleWetSpectralRendererTest --parallel 2

      - name: Run focused invariants
        shell: bash
        run: |
          set -euo pipefail
          ./build-simple/clean-engine-tests/CleanModernPitchEngineTest
          ./build-simple/clean-engine-tests/SupervisorContinuityTest
          ./build-simple/clean-engine-tests/SingleWetSpectralRendererTest

      - name: Build VST3
        run: cmake --build build-simple --config Release --target Neumaton_VST3 --parallel 2

      - name: Commit tested source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/ModernPitchEngine.cpp Tests/SupervisorContinuityTest.cpp
          git rm Tests/MaterializeSimpleTargetAuthorityV1.py .github/workflows/simple-target-authority-materialize.yml
          git commit -m 'Keep correction on arrival target through unvoiced tails'
          git push origin HEAD:simple-fix-from-quality-baseline
