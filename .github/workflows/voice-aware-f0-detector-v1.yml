name: Voice-aware F0 detector v1

on:
  push:
    branches:
      - voice-aware-f0-detector-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-aware-f0-detector-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-materialize:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard definitive architecture baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "a68122181f9fd629ca18ecb4e17ca82ec06e54d3"
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          test "$(git hash-object Source/SingleWetSpectralRenderer.h)" = "2b68b3b3d5dc0579cdab94f4969203ef876ef058"
          git diff --exit-code origin/main -- Source/SingleWetSpectralRenderer.cpp Source/SingleWetSpectralRenderer.h Source/LivePitchProcessor.h Source/VoiceEvidenceAnalyzer.h

      - name: Materialize voice-aware detector
        run: |
          python3 Tests/MaterializeVoiceAwareF0DetectorV1.py
          python3 Tests/RefineVoiceAwareF0DetectorV1.py
          python3 Tests/ApplyVoiceAwarePathRolesV1.py
          python3 Tests/RefineVoiceAwareSourceGeometryV1.py
          python3 Tests/ProbeRapidF0DetectorV1.py
          python3 Tests/DiagnoseVoiceAwareFailuresV1.py
          python3 Tests/RefineVoiceInputMeasurementV2.py
          python3 Tests/RefineDetectorObservationSemanticsV1.py

      - name: Verify narrow detector-only contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          def from_main(path):
              return subprocess.check_output(['git','show',f'origin/main:{path}'], text=True)

          cpp = Path('Source/ModernPitchEngine.cpp').read_text()
          base_cpp = from_main('Source/ModernPitchEngine.cpp')
          quantizer_marker = '//==============================================================================\n// ScaleQuantizer\n'
          process_marker = '''void ModernPitchEngine::process(
              juce::AudioBuffer<float>& buffer,
              const double* scaleRatios,
          '''
          tail_marker = 'void ModernPitchEngine::processBypassed(juce::AudioBuffer<float>& buffer)\n'
          assert quantizer_marker in cpp and quantizer_marker in base_cpp
          assert process_marker in cpp and process_marker in base_cpp
          assert tail_marker in cpp and tail_marker in base_cpp
          q = cpp.index(quantizer_marker)
          bq = base_cpp.index(quantizer_marker)
          p = cpp.index(process_marker)
          bp = base_cpp.index(process_marker)
          tail = cpp.index(tail_marker)
          btail = base_cpp.index(tail_marker)
          # Quantizer, updateCorrectionState and correction controller remain
          # byte-identical. Transition may only send a detector wake control from
          # process(); all code after process() is frozen again.
          assert cpp[q:p] == base_cpp[bq:bp], 'quantizer/supervisor/controller changed'
          assert cpp[tail:] == base_cpp[btail:], 'post-process engine code changed'

          process = cpp[p:tail]
          base_process = base_cpp[bp:btail]
          allowed = [
          '''                const bool detectorWake = correction.trackingState == TrackingState::transition
                              || (correction.trackingState == TrackingState::acquire
                                  && correction.stateAgeSamples >= static_cast<int>(0.060 * sampleRate_));
                          tracker.setTransitionWake(detectorWake);
          ''',
          '''            const bool detectorWake = linkedCorrection_.trackingState == TrackingState::transition
                          || (linkedCorrection_.trackingState == TrackingState::acquire
                              && linkedCorrection_.stateAgeSamples >= static_cast<int>(0.060 * sampleRate_));
                      linkedTracker_.setTransitionWake(detectorWake);
          ''']
          for snippet in allowed:
              assert process.count(snippet) == 1, 'missing or duplicated detector-wake wiring'
              process = process.replace(snippet, '', 1)
          assert process == base_process, 'process() changed beyond detector wake wiring'

          hpp = Path('Source/ModernPitchEngine.h').read_text()
          base_hpp = from_main('Source/ModernPitchEngine.h')
          hpp_marker = '    class ScaleQuantizer\n'
          assert hpp_marker in hpp and hpp_marker in base_hpp
          assert hpp[hpp.index(hpp_marker):] == base_hpp[base_hpp.index(hpp_marker):], 'quantizer/header suffix changed'

          for marker in [
              'VOICE_AWARE_F0_FRONTEND_V1',
              'RESIDUAL_HARMONIC_CONTRAST_V1',
              'OBSERVATION_MEMORY_IS_FALSIFIABLE_V1',
              'STALE_PATH_VERIFIES_NOT_STEERS_V1',
              'CLEAN_RESIDUAL_DISCOVERS_SOURCE_GEOMETRY_REFINES_V1',
              'SUBFRAME_GLOTTAL_STABILITY_V1',
              'GLOTTAL_EVIDENCE_FUSION_V2',
              'SINGLE_PATH_RESONANCE_IS_NOT_VOICE_V1',
              'OBSERVATION_MEMORY_SEPARATION_V1',
              'ZERO_INPUT_CLEARS_OBSERVER_NOT_MUSIC_V1',
              'TRANSITION_WAKES_DETECTOR_NOT_OUTPUT_V1'
          ]:
              assert marker in cpp, marker
          assert 'PATH_ROLE_SPLIT_V1' in cpp or 'PATH_ROLE_SPLIT_V1' in hpp
          assert 'pathPitchAuthority' in cpp
          assert 'pathCleanlinessAuthority' in cpp
          assert 'tonalCleanliness' in cpp
          assert 'presenceMode_\n        ? 0.0f' not in cpp
          assert '0.5f * (normalisedCorrelation + 1.0f)' not in cpp
          PY
          changed="$(git diff --name-only | sort)"
          expected=$'Source/ModernPitchEngine.cpp\nSource/ModernPitchEngine.h\nTests/SupervisorContinuityTest.cpp'
          test "$changed" = "$expected"
          git diff --exit-code -- Source/SingleWetSpectralRenderer.cpp Source/SingleWetSpectralRenderer.h Source/LivePitchProcessor.h Source/VoiceEvidenceAnalyzer.h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure focused invariant build
        run: cmake -S . -B build-voice-aware -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Build detector supervisor test
        run: cmake --build build-voice-aware --config Release --parallel 2 --target SupervisorContinuityTest

      - name: Run detector supervisor test
        run: ./build-voice-aware/clean-engine-tests/SupervisorContinuityTest

      - name: Build remaining frozen invariants
        run: >-
          cmake --build build-voice-aware --config Release --parallel 2
          --target SingleWetSpectralRendererTest VoiceEvidenceAnalyzerTest
          CleanModernPitchEngineTest GuiAudioControlContractTest

      - name: Run remaining frozen invariants
        shell: bash
        run: |
          set -euo pipefail
          ./build-voice-aware/clean-engine-tests/SingleWetSpectralRendererTest
          ./build-voice-aware/clean-engine-tests/VoiceEvidenceAnalyzerTest
          ./build-voice-aware/clean-engine-tests/CleanModernPitchEngineTest
          ./build-voice-aware/clean-engine-tests/GuiAudioControlContractTest

      - name: Build VST3
        run: cmake --build build-voice-aware --config Release --target Neumaton_VST3 --parallel 2

      - name: Commit validated detector implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/ModernPitchEngine.cpp Source/ModernPitchEngine.h Tests/SupervisorContinuityTest.cpp
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit.'
            exit 0
          fi
          git commit -m 'Make F0 detector voice-aware and observation-bounded [skip ci]'
          git push origin HEAD:voice-aware-f0-detector-v1
