name: Materialize Scale-Owned Authority V3

on:
  push:
    branches:
      - simple-fix-from-quality-baseline
    paths:
      - '.github/workflows/materialize-single-authority-cleanup-v1.yml'
      - 'Tests/MaterializeSingleAuthorityCleanupV1.py'
      - 'Tests/MaterializeScaleOwnedAuthorityV3.py'

permissions:
  contents: write

jobs:
  validate-and-materialize:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple-fix-from-quality-baseline
          fetch-depth: 0

      - name: Verify frozen renderer before authority rewire
        run: |
          set -euo pipefail
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "3080ba804cb038421b075d76f5eceec335c22396"
          grep -Fq 'SCALE_OWNS_VOICE_V2' Source/ModernPitchEngine.cpp
          grep -Fq 'SINGLE_WET_PURITY_V6' Source/ModernPitchEngine.cpp

      - name: Apply subtractive cleanup and detector authority rewire
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Tests/MaterializeScaleOwnedAuthorityV3.py')
          text = path.read_text()
          old = 'if m.count(old_guard) != 2:\n    raise SystemExit(f"decoder immediate-authority guards: expected 2, found {m.count(old_guard)}")'
          new = 'if m.count(old_guard) < 1:\n    raise SystemExit("decoder immediate-authority guard not found")'
          if text.count(old) != 1:
              raise SystemExit('authority guard matcher patch did not match exactly once')
          text = text.replace(old, new, 1)

          anchor = 'engine_path = Path("Source/ModernPitchEngine.cpp")\nm = engine_path.read_text()\n\n# Detector fusion always uses its own evidence/continuity model.'
          insert = '''engine_path = Path("Source/ModernPitchEngine.cpp")
m = engine_path.read_text()

# Presence is telemetry, never permission to lower detector standards.
m = replace_once(
    m,
    "    immediateAuthority_ = false; // AUTHORITY_CONTROLS_EXPLICIT_V1\\n",
    "",
    "remove detector authority reset")
m = replace_once(
    m,
    "    // RAP_VOICING_V1_AUDIO_PRESENCE: detector confidence may be poor, but a\\n"
    "    // numerically non-silent input is never allowed to erase the voice.  In\\n"
    "    // presence mode analyse the best available period instead of returning no\\n"
    "    // path merely because YIN confidence is low.\\n"
    "    const float rmsFloor = presenceMode_ ? numericalPresenceRms : minimumDetectorRms;\\n"
    "    if (rms < rmsFloor)\\n",
    "    // DETECTOR_IS_OBSERVER_V1: audio presence does not lower pitch-analysis\\n"
    "    // standards. Aperiodic material may correctly yield no F0 while the\\n"
    "    // downstream scale target remains fully authoritative.\\n"
    "    if (rms < minimumDetectorRms)\\n",
    "presence cannot lower detector RMS gate")
m = replace_once(
    m,
    "    if (!presenceMode_ && thresholdTau < 0 && globalValue > fallbackThreshold)\\n"
    "        return result;\\n",
    "    if (thresholdTau < 0 && globalValue > fallbackThreshold)\\n"
    "        return result;\\n",
    "presence cannot force YIN fallback")
# The second decoder guard uses function-level indentation.
m = replace_once(
    m,
    "    if (!immediateAuthority_)\\n"
    "    {\\n",
    "    {\\n",
    "remove detector authority hold guard")

# Detector fusion always uses its own evidence/continuity model.'''
          if text.count(anchor) != 1:
              raise SystemExit('engine authority insertion anchor did not match exactly once')
          text = text.replace(anchor, insert, 1)
          path.write_text(text)
          PY
          python3 Tests/MaterializeScaleOwnedAuthorityV3.py

      - name: Verify scale is the only musical authority
        run: |
          set -euo pipefail
          git diff --check

          grep -Fq 'SINGLE_PLUGIN_AUDIO_PATH_V1' Source/PluginProcessor.cpp
          grep -Fq 'HOST_BYPASS_ONLY_DRY_V1' Source/PluginProcessor.cpp
          grep -Fq 'PHONETIC_STATE_HAS_NO_CORRECTION_AUTHORITY_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'DETECTOR_IS_OBSERVER_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'ACTIVE_PATH_NEVER_DRY_FALLBACK_V1' Source/SingleWetSpectralRenderer.cpp

          ! grep -Fq 'detectPitchYIN' Source/PluginProcessor.cpp
          ! grep -Fq 'detectPitchYIN' Source/PluginProcessor.h
          ! grep -Fq 'smoothedShiftRatio' Source/PluginProcessor.cpp
          ! grep -Fq 'circularBuffer' Source/PluginProcessor.cpp
          ! grep -Fq 'yinBuffer' Source/PluginProcessor.cpp
          ! grep -Fq 'findNearestTarget' Source/PluginProcessor.cpp
          ! grep -Fq '"High Latency"' Source/PluginEditor.cpp
          ! grep -Fq 'desiredCents = 0.0' Source/ModernPitchEngine.cpp
          ! grep -Fq 'TrackingState::release' Source/ModernPitchEngine.cpp

          ! grep -Fq 'setImmediateAuthority' Source/ModernPitchEngine.cpp
          ! grep -Fq 'setImmediateAuthority' Source/ModernPitchEngine.h
          ! grep -Fq 'immediateAuthority_' Source/ModernPitchEngine.cpp
          ! grep -Fq 'immediateAuthority_' Source/ModernPitchEngine.h
          ! grep -Fq 'makePresenceFallback' Source/ModernPitchEngine.cpp
          ! grep -Fq 'presenceInitialEvidence' Source/ModernPitchEngine.cpp
          ! grep -Fq 'presenceMode_ ? (decision.candidate.valid' Source/ModernPitchEngine.cpp
          ! grep -Fq 'presenceMode_ ? numericalPresenceRms' Source/ModernPitchEngine.cpp
          ! grep -Fq '!presenceMode_ && thresholdTau' Source/ModernPitchEngine.cpp

          grep -Fq 'const double targetPosition = static_cast<double>(sourceBin) * safeRatio' Source/SingleWetSpectralRenderer.cpp
          grep -Fq 'const float outputMagnitude = magnitude' Source/SingleWetSpectralRenderer.cpp
          ! grep -Fq 'harmonicMask' Source/SingleWetSpectralRenderer.cpp
          ! grep -Fq 'noiseDominance' Source/SingleWetSpectralRenderer.cpp
          ! grep -Fq 'reconstructionGain' Source/SingleWetSpectralRenderer.cpp

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -S . -B build-scale-authority -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Build focused tests
        run: cmake --build build-scale-authority --config Release --target CleanModernPitchEngineTest SupervisorContinuityTest SingleWetSpectralRendererTest GuiAudioControlContractTest GuiAudibilityTest --parallel 2

      - name: Run focused tests
        run: |
          set -euo pipefail
          ./build-scale-authority/clean-engine-tests/CleanModernPitchEngineTest
          ./build-scale-authority/clean-engine-tests/SupervisorContinuityTest
          ./build-scale-authority/clean-engine-tests/SingleWetSpectralRendererTest
          ./build-scale-authority/clean-engine-tests/GuiAudioControlContractTest
          ./build-scale-authority/clean-engine-tests/GuiAudibilityTest

      - name: Build VST3
        run: cmake --build build-scale-authority --config Release --target Neumaton_VST3 --parallel 2

      - name: Commit tested scale-owned authority
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/PluginProcessor.cpp Source/PluginProcessor.h Source/PluginEditor.cpp Source/PluginEditor.h Source/ModernPitchEngine.cpp Source/ModernPitchEngine.h Source/SingleWetSpectralRenderer.cpp Tests/SupervisorContinuityTest.cpp Tests/GuiAudioControlContractTest.cpp
          git rm -f Tests/MaterializeSingleAuthorityCleanupV1.py Tests/MaterializeScaleOwnedAuthorityV3.py .github/workflows/materialize-single-authority-cleanup-v1.yml
          git commit -m "Make scale the only musical authority [skip ci]"
          git push origin HEAD:simple-fix-from-quality-baseline
