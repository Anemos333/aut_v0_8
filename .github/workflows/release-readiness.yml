name: Neumaton V1 Release Readiness

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "Source/**"
      - "Tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/release-readiness.yml"
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  v1-build-and-contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxcomposite-dev libxdamage-dev libxrender-dev libwebkit2gtk-4.0-dev \
            libglu1-mesa-dev mesa-common-dev
      - name: Configure current V1 build
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNEUMATON_BUILD_V1_TESTS=ON -DNEUMATON_BUILD_LICENSING_TESTS=ON
      - name: Compile active plugin and contracts
        run: |
          cmake --build build-release --parallel 2 --target \
            Neumaton_VST3 PitchCoreStressTest SinglePathPitchRendererTest \
            ScaleDatabaseV1Test ScaleDegreeDisplayTest ScaleEditorGeometryTest LicensingSkeletonTest
      - name: Run V1 contracts
        run: |
          set -e
          for test in PitchCoreStressTest SinglePathPitchRendererTest \
                      ScaleDatabaseV1Test ScaleDegreeDisplayTest ScaleEditorGeometryTest; do
            "build-release/v1-tests/$test"
          done
          build-release/licensing-tests/LicensingSkeletonTest
      - name: VST3-only and active-source contract
        run: |
          set -e
          grep -q 'FORMATS VST3' CMakeLists.txt
          ! grep -Eq 'Source/(ModernPitchEngine|SingleWetSpectralRenderer)' CMakeLists.txt
          find build-release -name '*.vst3' | grep -q .
