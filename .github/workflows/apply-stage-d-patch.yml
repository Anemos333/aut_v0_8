name: Apply Stage D Patch

on:
  push:
    branches:
      - output-stage-v3-audio-renderer
    paths:
      - 'Tools/stage_d_patch/**'
      - '.github/workflows/apply-stage-d-patch.yml'
  pull_request:
    paths:
      - 'Tools/stage_d_patch/**'
      - '.github/workflows/apply-stage-d-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'output-stage-v3-audio-renderer'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: output-stage-v3-audio-renderer
          fetch-depth: 0
      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          if [ ! -d Tools/stage_d_patch ]; then
            echo 'Stage D patch already applied'
            exit 0
          fi
          cat Tools/stage_d_patch/part* > /tmp/stage-d.patch.gz.b64
          base64 -d /tmp/stage-d.patch.gz.b64 > /tmp/stage-d.patch.gz
          echo 'd4541172d9e1ca5d2222ab92a46b4f1547401007a50c7b5a1b576f3aef070771  /tmp/stage-d.patch.gz' | sha256sum -c -
          gzip -dc /tmp/stage-d.patch.gz > /tmp/stage-d.patch
          git apply --check /tmp/stage-d.patch
          git apply /tmp/stage-d.patch
          rm -rf Tools/stage_d_patch
          rm -f .github/workflows/output-v3-audio-renderer.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stage D: activate exclusive V3 audio renderer'
          git push origin HEAD:output-stage-v3-audio-renderer
