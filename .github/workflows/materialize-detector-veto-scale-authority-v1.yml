name: materialize-detector-veto-scale-authority-v1

on:
  push:
    branches: [ detector-veto-scale-authority-v1 ]

permissions:
  contents: write

jobs:
  validate-and-materialize:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: detector-veto-scale-authority-v1
          fetch-depth: 0

      - name: Guard baseline architecture and frozen renderer
        run: |
          set -euo pipefail
          grep -Fq 'DETECTOR_IS_OBSERVER_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'SCALE_CELL_OWNS_SOFTNESS_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'NO_UNITY_ESCAPE_V1' Source/ModernPitchEngine.cpp
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "7eae364fc8974c10980c21fea739ed66b69b0e56"

      - name: Materialize detector veto authority patch
        run: |
          python3 Tests/MaterializeDetectorVetoScaleAuthorityV1.py
          python3 Tests/RefineDetectorVetoScaleAuthorityV1.py

      - name: Verify semantic contract
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'DETECTOR_VETO_NOT_PERMISSION_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'FIRST_MEASUREMENT_OWNS_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'NO_PREDICTED_NOTE_IDENTITY_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'VALID_F0_OUTRANKS_LABEL_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'CONTINUITY_VETO_NOT_CONFIDENCE_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'CONTINUITY_VETO_NOT_PERMISSION_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'weak_real_note_change_reaches_exact_scale_degree_in_bounded_time' Tests/SupervisorContinuityTest.cpp
          ! grep -Fq 'POSITIVE_VETO_ONLY_V1' Source/ModernPitchEngine.cpp
          ! grep -Fq 'LIVE_F0_SELECTS_SCALE_CELL_V1' Source/ModernPitchEngine.cpp
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "7eae364fc8974c10980c21fea739ed66b69b0e56"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure focused tests
        run: cmake -S . -B build-detector-veto -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Build focused tests
        run: cmake --build build-detector-veto --config Release --target CleanModernPitchEngineTest SupervisorContinuityTest SingleWetSpectralRendererTest GuiAudioControlContractTest GuiAudibilityTest --parallel 2

      - name: Run focused tests
        run: |
          set -euo pipefail
          ./build-detector-veto/clean-engine-tests/CleanModernPitchEngineTest
          ./build-detector-veto/clean-engine-tests/SupervisorContinuityTest
          ./build-detector-veto/clean-engine-tests/SingleWetSpectralRendererTest
          ./build-detector-veto/clean-engine-tests/GuiAudioControlContractTest
          ./build-detector-veto/clean-engine-tests/GuiAudibilityTest

      - name: Build VST3
        run: cmake --build build-detector-veto --config Release --target Neumaton_VST3 --parallel 2

      - name: Commit validated detector-veto authority
        run: |
          set -euo pipefail
          rm -f Tests/MaterializeDetectorVetoScaleAuthorityV1.py
          rm -f Tests/RefineDetectorVetoScaleAuthorityV1.py
          rm -f .github/workflows/materialize-detector-veto-scale-authority-v1.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Invert detector authority to bounded veto [skip ci]'
          git push origin HEAD:detector-veto-scale-authority-v1
