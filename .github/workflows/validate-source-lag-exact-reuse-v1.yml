name: Validate exact source-lag reuse v1

on:
  push:
    branches:
      - cpu-source-lag-exact-reuse-v1
    paths:
      - Tests/ApplySourceLagExactReuse.py
      - Tests/DetectorSuperHopProfile.cpp
      - .github/workflows/validate-source-lag-exact-reuse-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: cpu-source-lag-exact-reuse-v1
          fetch-depth: 0

      - name: Guard frozen golden baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Source/ModernPitchEngine.cpp)" = "bc99c8895c570d3ee434667fb0aa6ebf356f7a20"
          test "$(git hash-object Source/ModernPitchEngine.h)" = "e4647f124f5b0253eb1216b62816b2c4dc3a0c30"
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          test "$(git hash-object Source/SingleWetSpectralRenderer.h)" = "2b68b3b3d5dc0579cdab94f4969203ef876ef058"
          grep -q 'RESIDUAL_LINE_EXACT_MEMOIZATION_V1' Source/ModernPitchEngine.cpp
          grep -q 'RESIDUAL_HANN_LAZY_MEMOIZATION_V1' Source/ModernPitchEngine.cpp
          grep -q 'TAU_EVIDENCE_MEMOIZATION_V1' Source/ModernPitchEngine.cpp
          ! grep -q 'SOURCE_LAG_EXACT_REUSE_V1' Source/ModernPitchEngine.cpp
          echo 'SOURCE_LAG_BASELINE_GUARD=PASS'

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Materialize frozen baseline worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/neumaton-source-lag-baseline HEAD
          test "$(cd /tmp/neumaton-source-lag-baseline && git hash-object Source/ModernPitchEngine.cpp)" = "bc99c8895c570d3ee434667fb0aa6ebf356f7a20"

      - name: Apply candidate only
        shell: bash
        run: |
          set -euo pipefail
          python3 Tests/ApplySourceLagExactReuse.py
          test "$(git diff --name-only)" = "Source/ModernPitchEngine.cpp"
          grep -q 'SOURCE_LAG_EXACT_REUSE_V1' Source/ModernPitchEngine.cpp
          test "$(git hash-object Source/ModernPitchEngine.h)" = "e4647f124f5b0253eb1216b62816b2c4dc3a0c30"
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          echo 'SOURCE_LAG_CANDIDATE_MATERIALIZED=PASS'

      - name: Verify detector oracle exact and deterministic
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/candidate-supervisor-original.cpp
          cp Tests/GoldenDetectorDeterminismTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-detector -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-detector --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          for run in 1 2 3; do
            ./build-detector/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee "/tmp/source-lag-detector-$run.log"
            grep -q '^GOLDEN_DETECTOR_BITWISE_DETERMINISM=PASS observations=12000$' "/tmp/source-lag-detector-$run.log"
            grep -q '^GOLDEN_DETECTOR_TRACE_HASH=58273352d40c5499$' "/tmp/source-lag-detector-$run.log"
          done
          cp /tmp/candidate-supervisor-original.cpp Tests/SupervisorContinuityTest.cpp
          echo 'SOURCE_LAG_DETECTOR_EXACT=PASS'

      - name: Verify end-to-end golden corpus exact
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/candidate-supervisor-before-corpus.cpp
          cp Tests/GoldenEngineBehaviorCorpusTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-corpus -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-corpus --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          for run in 1 2; do
            ./build-corpus/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee "/tmp/source-lag-corpus-$run.log"
            grep -q '^GOLDEN_ENGINE_BEHAVIOR_CORPUS=PASS scenarios=14$' "/tmp/source-lag-corpus-$run.log"
            grep -q '^GOLDEN_ENGINE_CORPUS_HASH=022ae649ee590533$' "/tmp/source-lag-corpus-$run.log"
          done
          grep '^GOLDEN_ENGINE_SCENARIO_HASH' /tmp/source-lag-corpus-1.log > /tmp/source-lag-scenarios-1.log
          grep '^GOLDEN_ENGINE_SCENARIO_HASH' /tmp/source-lag-corpus-2.log > /tmp/source-lag-scenarios-2.log
          diff -u /tmp/source-lag-scenarios-1.log /tmp/source-lag-scenarios-2.log
          cp /tmp/candidate-supervisor-before-corpus.cpp Tests/SupervisorContinuityTest.cpp
          echo 'SOURCE_LAG_END_TO_END_EXACT=PASS'

      - name: Verify authority and renderer contracts
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-contracts -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-contracts --config Release --parallel 2 \
            --target SupervisorContinuityTest CleanModernPitchEngineTest SingleWetSpectralRendererTest >/dev/null
          ./build-contracts/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/source-lag-supervisor.log
          ./build-contracts/clean-engine-tests/CleanModernPitchEngineTest 2>&1 | tee /tmp/source-lag-engine.log
          ./build-contracts/clean-engine-tests/SingleWetSpectralRendererTest 2>&1 | tee /tmp/source-lag-renderer.log
          ! grep -q '=FAIL' /tmp/source-lag-supervisor.log
          ! grep -q '=FAIL' /tmp/source-lag-engine.log
          ! grep -q '=FAIL' /tmp/source-lag-renderer.log
          grep -q 'transition_detector_wobble_cannot_move_destination=PASS' /tmp/source-lag-supervisor.log
          grep -q 'periodic_reentry_has_no_click=PASS' /tmp/source-lag-renderer.log
          echo 'SOURCE_LAG_CONTRACTS=PASS'

      - name: Profile frozen baseline average CPU
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/neumaton-source-lag-baseline
          cp Tests/SupervisorContinuityTest.cpp /tmp/source-lag-baseline-supervisor.cpp
          cp Tests/CpuHotspotBenchmark.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-cpu -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-cpu --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          : > /tmp/source-lag-baseline-cpu.log
          for run in 1 2 3; do
            ./build-cpu/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee -a /tmp/source-lag-baseline-cpu.log
          done
          cp /tmp/source-lag-baseline-supervisor.cpp Tests/SupervisorContinuityTest.cpp

      - name: Profile candidate average CPU
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/source-lag-candidate-supervisor.cpp
          cp Tests/CpuHotspotBenchmark.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-candidate-cpu -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-candidate-cpu --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          : > /tmp/source-lag-candidate-cpu.log
          for run in 1 2 3; do
            ./build-candidate-cpu/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee -a /tmp/source-lag-candidate-cpu.log
          done
          cp /tmp/source-lag-candidate-supervisor.cpp Tests/SupervisorContinuityTest.cpp

      - name: Profile frozen baseline hop spikes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/neumaton-source-lag-baseline
          cp Tests/SupervisorContinuityTest.cpp /tmp/source-lag-baseline-supervisor-hop.cpp
          cp Tests/DetectorSuperHopProfile.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-superhop -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-superhop --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          : > /tmp/source-lag-baseline-superhop.log
          for run in 1 2 3; do
            NEUMATON_WARMUP_SECONDS=0.50 \
            NEUMATON_PROFILE_SECONDS=3.0 \
            NEUMATON_PATH_REPS=60 \
              ./build-superhop/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee -a /tmp/source-lag-baseline-superhop.log
          done
          cp /tmp/source-lag-baseline-supervisor-hop.cpp Tests/SupervisorContinuityTest.cpp

      - name: Profile candidate hop spikes
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/source-lag-candidate-supervisor-hop.cpp
          cp Tests/DetectorSuperHopProfile.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-candidate-superhop -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-candidate-superhop --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          : > /tmp/source-lag-candidate-superhop.log
          for run in 1 2 3; do
            NEUMATON_WARMUP_SECONDS=0.50 \
            NEUMATON_PROFILE_SECONDS=3.0 \
            NEUMATON_PATH_REPS=60 \
              ./build-candidate-superhop/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee -a /tmp/source-lag-candidate-superhop.log
          done
          cp /tmp/source-lag-candidate-supervisor-hop.cpp Tests/SupervisorContinuityTest.cpp

      - name: Summarize CPU deltas
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/source-lag-cpu-summary.log
          from pathlib import Path
          import re, statistics

          def cpu_rows(path):
              rows=[]
              for line in Path(path).read_text().splitlines():
                  if line.startswith('CPU_PROFILE '):
                      rows.append(dict(re.findall(r'(\w+)=([^ ]+)', line)))
              if len(rows) != 9:
                  raise SystemExit(f'{path}: expected 9 CPU_PROFILE rows, got {len(rows)}')
              return rows

          def hop_rows(path):
              rows=[]
              for line in Path(path).read_text().splitlines():
                  if line.startswith('HOP_PROFILE '):
                      rows.append(dict(re.findall(r'(\w+)=([^ ]+)', line)))
              if len(rows) != 12:
                  raise SystemExit(f'{path}: expected 12 HOP_PROFILE rows, got {len(rows)}')
              return rows

          def med(rows, predicate, key):
              values=[float(r[key]) for r in rows if predicate(r)]
              if not values:
                  raise SystemExit(f'no values for {key}')
              return statistics.median(values)

          b=cpu_rows('/tmp/source-lag-baseline-cpu.log')
          c=cpu_rows('/tmp/source-lag-candidate-cpu.log')
          for block in (64,128,256):
              pred=lambda r, block=block: int(r['block']) == block
              bt=med(b,pred,'tracker_ms'); ct=med(c,pred,'tracker_ms')
              be=med(b,pred,'engine_ms'); ce=med(c,pred,'engine_ms')
              bl=med(b,pred,'live_ms'); cl=med(c,pred,'live_ms')
              print('SOURCE_LAG_CPU_MEDIAN',
                    f'block={block}',
                    f'baseline_tracker_ms={bt:.3f}',
                    f'candidate_tracker_ms={ct:.3f}',
                    f'tracker_reduction_pct={(1-ct/max(bt,1e-9))*100:.2f}',
                    f'baseline_engine_ms={be:.3f}',
                    f'candidate_engine_ms={ce:.3f}',
                    f'engine_reduction_pct={(1-ce/max(be,1e-9))*100:.2f}',
                    f'baseline_live_ms={bl:.3f}',
                    f'candidate_live_ms={cl:.3f}',
                    f'live_reduction_pct={(1-cl/max(bl,1e-9))*100:.2f}')

          bh=hop_rows('/tmp/source-lag-baseline-superhop.log')
          ch=hop_rows('/tmp/source-lag-candidate-superhop.log')
          names=('full_only','full_half','full_half_quarter','super_full_half_quarter_eighth')
          for name in names:
              pred=lambda r, name=name: r['name'] == name
              values={}
              for key in ('p50_us','p95_us','p99_us','max_us'):
                  values['b_'+key]=med(bh,pred,key)
                  values['c_'+key]=med(ch,pred,key)
              print('SOURCE_LAG_HOP_MEDIAN',
                    f'name={name}',
                    f'baseline_p50_us={values["b_p50_us"]:.3f}',
                    f'candidate_p50_us={values["c_p50_us"]:.3f}',
                    f'p50_reduction_pct={(1-values["c_p50_us"]/max(values["b_p50_us"],1e-9))*100:.2f}',
                    f'baseline_p99_us={values["b_p99_us"]:.3f}',
                    f'candidate_p99_us={values["c_p99_us"]:.3f}',
                    f'p99_reduction_pct={(1-values["c_p99_us"]/max(values["b_p99_us"],1e-9))*100:.2f}',
                    f'baseline_max_us={values["b_max_us"]:.3f}',
                    f'candidate_max_us={values["c_max_us"]:.3f}',
                    f'max_reduction_pct={(1-values["c_max_us"]/max(values["b_max_us"],1e-9))*100:.2f}')
          PY
          cat /tmp/source-lag-cpu-summary.log >> "$GITHUB_STEP_SUMMARY"

      - name: Final validation marker
        run: echo 'SOURCE_LAG_EXACT_REUSE_VALIDATION=PASS_NO_PROMOTION'
