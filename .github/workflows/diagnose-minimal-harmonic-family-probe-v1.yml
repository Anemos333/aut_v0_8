name: Diagnose minimal harmonic family probe v1
on:
  push:
    branches: [v1-continuous-f0-minimal-recomposition-v1]
    paths:
      - Tests/MinimalHarmonicFamilyProbe.cpp
      - .github/workflows/diagnose-minimal-harmonic-family-probe-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: v1-continuous-f0-minimal-recomposition-v1 }
      - run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev >/dev/null
      - run: |
          cp Tests/MinimalHarmonicFamilyProbe.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-family-probe -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-family-probe --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-family-probe/clean-engine-tests/SupervisorContinuityTest | tee /tmp/family-probe.log
          grep -q '^HARMONIC_FAMILY_PROBE ' /tmp/family-probe.log
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,statistics
          rows=[]
          for line in Path('/tmp/family-probe.log').read_text().splitlines():
              if not line.startswith('HARMONIC_FAMILY_PROBE '): continue
              d=dict(re.findall(r'(\w+)=([^ ]+)',line))
              for k in ['hz','snr','true','double','half','triple','margin_double','winner_hz','us']:
                  d[k]=float(d[k])
              d['true_wins']=int(d['true_wins'])
              rows.append(d)

          for kind in ['normal','strong_second','missing_fundamental','onset_burst']:
              for snr in [12.0,6.0,3.0,0.0]:
                  sub=[r for r in rows if r['kind']==kind and r['snr']==snr]
                  if not sub: continue
                  print('HARMONIC_FAMILY_SUMMARY'
                        f' kind={kind} snr={snr:.1f}'
                        f' cases={len(sub)}'
                        f' true_win_fraction={sum(r["true_wins"] for r in sub)/len(sub):.6f}'
                        f' median_margin_double={statistics.median(r["margin_double"] for r in sub):.6f}'
                        f' worst_margin_double={min(r["margin_double"] for r in sub):.6f}'
                        f' median_us={statistics.median(r["us"] for r in sub):.6f}')

          noise=[r for r in rows if r['kind']=='white_noise']
          if noise:
              print('HARMONIC_FAMILY_NOISE'
                    f' max_true={max(r["true"] for r in noise):.6f}'
                    f' max_double={max(r["double"] for r in noise):.6f}'
                    f' median_us={statistics.median(r["us"] for r in noise):.6f}')
          PY
