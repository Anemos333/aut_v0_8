name: Diagnose fractional correlation refiner v1
on:
  push:
    branches: [v1-continuous-f0-contract-v1]
    paths:
      - Tests/FractionalCorrelationRefinerDiagnostic.cpp
      - .github/workflows/diagnose-fractional-correlation-refiner-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: v1-continuous-f0-contract-v1 }
      - run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev >/dev/null
      - run: |
          cp Tests/FractionalCorrelationRefinerDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-fractional -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-fractional --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-fractional/clean-engine-tests/SupervisorContinuityTest | tee /tmp/fractional.log
          grep -q '^FRACTIONAL_CORR_SECOND ' /tmp/fractional.log
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,statistics
          rows=[]
          for line in Path('/tmp/fractional.log').read_text().splitlines():
              if not line.startswith('FRACTIONAL_CORR_SECOND '): continue
              d=dict(re.findall(r'(\w+)=([^ ]+)',line))
              for k in ['radius','source_error','source_us','residual_error','residual_us']: d[k]=float(d[k])
              for k in ['source_pass','residual_pass']: d[k]=int(d[k])
              rows.append(d)
          for mode in ['source','residual']:
              for radius in sorted({r['radius'] for r in rows}):
                  sub=[r for r in rows if r['radius']==radius]
                  e=[abs(r[f'{mode}_error']) for r in sub]
                  print('FRACTIONAL_CORR_SUMMARY'
                        f' mode={mode} radius={radius:.1f} cases={len(sub)}'
                        f' pass_1p5_fraction={sum(r[f"{mode}_pass"] for r in sub)/len(sub):.6f}'
                        f' median_abs_cents={statistics.median(e):.6f}'
                        f' worst_abs_cents={max(e):.6f}'
                        f' median_us={statistics.median(r[f"{mode}_us"] for r in sub):.6f}')
          PY
