name: Neumaton Restricted Beta

on:
  push:
    branches:
      - beta-restricted
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restricted-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Frozen DSP contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify definitive audio baseline
        run: python3 Tests/release_readiness_contract.py
      - name: Verify single-wet architecture markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SILENCE_REENTRY_RESEEDS_PHASE_AND_ENVELOPE_V1' Source/SingleWetSpectralRenderer.cpp
          test "$(grep -c 'SynthesisLayer layer_' Source/SingleWetSpectralRenderer.h)" = "1"
          ! grep -Eq 'dryMix|wetMix|crossfade|noiseLayer|periodicLayer|secondLayer' Source/SingleWetSpectralRenderer.cpp

  linux-beta:
    name: Linux beta VST3 + invariants
    needs: source-contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config zip \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev
      - name: Configure
        run: |
          cmake -S . -B build-beta -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON
      - name: Build invariants and VST3
        run: |
          cmake --build build-beta --parallel 2 --target \
            CleanModernPitchEngineTest VoiceEvidenceAnalyzerTest \
            SupervisorContinuityTest SingleWetSpectralRendererTest \
            GuiAudibilityTest GuiAudioControlContractTest Neumaton_VST3
      - name: Run invariants
        shell: bash
        run: |
          set -euo pipefail
          ./build-beta/clean-engine-tests/CleanModernPitchEngineTest
          ./build-beta/clean-engine-tests/VoiceEvidenceAnalyzerTest
          ./build-beta/clean-engine-tests/SupervisorContinuityTest
          ./build-beta/clean-engine-tests/SingleWetSpectralRendererTest
          ./build-beta/clean-engine-tests/GuiAudibilityTest
          ./build-beta/clean-engine-tests/GuiAudioControlContractTest
      - name: Package beta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          vst3="$(find build-beta -type d -name 'Neumaton.vst3' | head -n 1)"
          test -n "$vst3"
          cp -R "$vst3" artifact/Neumaton.vst3
          (cd artifact && zip -qr Neumaton-Beta-Linux-VST3.zip Neumaton.vst3)
          sha256sum artifact/Neumaton-Beta-Linux-VST3.zip | awk '{print $1}' > artifact/Neumaton-Beta-Linux-VST3.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Neumaton-Beta-Linux-VST3
          path: |
            artifact/Neumaton-Beta-Linux-VST3.zip
            artifact/Neumaton-Beta-Linux-VST3.sha256
          if-no-files-found: error
          retention-days: 14

  windows-beta:
    name: Windows beta VST3 + invariants
    needs: source-contract
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-beta `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON
      - name: Build invariants and VST3
        shell: pwsh
        run: >-
          cmake --build build-beta --config Release
          --target CleanModernPitchEngineTest VoiceEvidenceAnalyzerTest
          SupervisorContinuityTest SingleWetSpectralRendererTest
          GuiAudibilityTest GuiAudioControlContractTest Neumaton_VST3 --parallel 2
      - name: Run invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            '.\build-beta\clean-engine-tests\CleanModernPitchEngineTest.exe',
            '.\build-beta\clean-engine-tests\VoiceEvidenceAnalyzerTest.exe',
            '.\build-beta\clean-engine-tests\SupervisorContinuityTest.exe',
            '.\build-beta\clean-engine-tests\SingleWetSpectralRendererTest.exe',
            '.\build-beta\clean-engine-tests\GuiAudibilityTest.exe',
            '.\build-beta\clean-engine-tests\GuiAudioControlContractTest.exe'
          )
          foreach ($test in $tests) {
            & $test
            if ($LASTEXITCODE -ne 0) { throw "$test failed with $LASTEXITCODE" }
          }
      - name: Package beta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $vst3 = Get-ChildItem build-beta -Recurse -Directory -Filter 'Neumaton.vst3' | Select-Object -First 1
          if (-not $vst3) { throw 'Neumaton.vst3 not found' }
          Copy-Item $vst3.FullName artifact\Neumaton.vst3 -Recurse -Force
          Compress-Archive artifact\Neumaton.vst3 artifact\Neumaton-Beta-Windows-VST3.zip -Force
          (Get-FileHash artifact\Neumaton-Beta-Windows-VST3.zip -Algorithm SHA256).Hash.ToLower() |
            Out-File -Encoding ascii artifact\Neumaton-Beta-Windows-VST3.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Neumaton-Beta-Windows-VST3
          path: |
            artifact/Neumaton-Beta-Windows-VST3.zip
            artifact/Neumaton-Beta-Windows-VST3.sha256
          if-no-files-found: error
          retention-days: 14

  macos-beta:
    name: macOS universal beta VST3
    needs: source-contract
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure universal build
        run: |
          cmake -S . -B build-beta -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build VST3
        run: cmake --build build-beta --config Release --target Neumaton_VST3 --parallel 2
      - name: Verify, ad-hoc sign and package
        shell: bash
        run: |
          set -euo pipefail
          vst3="$(find build-beta -type d -name 'Neumaton.vst3' | head -n 1)"
          test -n "$vst3"
          binary="$(find "$vst3/Contents/MacOS" -type f | head -n 1)"
          test -n "$binary"
          lipo -info "$binary" | tee architectures.txt
          lipo -info "$binary" | grep -q 'x86_64'
          lipo -info "$binary" | grep -q 'arm64'
          codesign --force --deep --sign - "$vst3"
          codesign --verify --deep --strict --verbose=2 "$vst3"
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent "$vst3" artifact/Neumaton-Beta-macOS-VST3.zip
          shasum -a 256 artifact/Neumaton-Beta-macOS-VST3.zip | awk '{print $1}' > artifact/Neumaton-Beta-macOS-VST3.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Neumaton-Beta-macOS-VST3
          path: |
            artifact/Neumaton-Beta-macOS-VST3.zip
            artifact/Neumaton-Beta-macOS-VST3.sha256
            architectures.txt
          if-no-files-found: error
          retention-days: 14
