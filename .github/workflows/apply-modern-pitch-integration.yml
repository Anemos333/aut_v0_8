name: Apply ModernPitchEngine integration

on:
  push:
    branches:
      - modern-pitch-engine-clean-rewrite
    paths:
      - '.integration-payload/**'
      - '.github/workflows/apply-modern-pitch-integration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode replacement sources and patch adapters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          root = Path('.')
          payload = root / '.integration-payload'

          targets = {
              'engine_h': (root / 'Source/ModernPitchEngine.h', 'db1fe2a3b057a0aa5b0641b7388d13ff7405c26e8c80766c4a7e384aa714e36c'),
              'engine_cpp': (root / 'Source/ModernPitchEngine.cpp', 'ac532f20538db7e6e2fe69bd5bd4776699609c4eabcd3e4830ba11b19675d3d9'),
              'test_cpp': (root / 'Tests/CleanModernPitchEngineTest.cpp', 'b91dd6b067a57be52014a259706142d8fb1707236555a6838d8aa220306895a5'),
              'contract': (root / 'Tests/CLEAN_MODERN_PITCH_ENGINE_CONTRACT.md', 'fc4567e4d3ef6dab0ccd61da1893d76aa365b1070467b19d5184a6d032a3f93d'),
          }

          for stem, (target, expected_sha) in targets.items():
              parts = sorted(payload.glob(f'{stem}.part*'))
              if not parts:
                  raise RuntimeError(f'missing payload for {stem}')
              encoded = ''.join(part.read_text(encoding='utf-8').strip() for part in parts)
              decoded = gzip.decompress(base64.b64decode(encoded))
              actual_sha = hashlib.sha256(decoded).hexdigest()
              if actual_sha != expected_sha:
                  raise RuntimeError(f'{stem} sha mismatch: {actual_sha}')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(decoded)

          processor_path = root / 'Source/PluginProcessor.cpp'
          processor = processor_path.read_text(encoding='utf-8')
          start = processor.index('    [[nodiscard]] float musicalRetuneFloorMs')
          end_marker = '\n}\n\n//=============================================================================='
          end = processor.index(end_marker, start)
          speed_adapter = '''    [[nodiscard]] float constrainRetuneSpeedMs (float speedMs,
                                                     int /*mode*/,
                                                     bool /*scaleLock*/) noexcept
              {
                  // The clean engine owns the mode-aware trajectory mapping. Preserve
                  // the complete 0..500 ms GUI range without floors or compression.
                  if (! std::isfinite (speedMs))
                      speedMs = 50.0f;
                  return juce::jlimit (0.0f, 500.0f, speedMs);
              }
          '''
          processor = processor[:start] + speed_adapter + processor[end:]
          processor_path.write_text(processor, encoding='utf-8')

          editor_path = root / 'Source/PluginEditor.cpp'
          editor = editor_path.read_text(encoding='utf-8')
          old_lambda = '''    speedKnob.textFromValueFunction = [this](double val) {
                  if (scaleLockButton.getToggleState()) {
                      double mappedVal = val * (7.0 / 500.0);
                      return juce::String(mappedVal, 2) + " ms";
                  }
                  return juce::String(val, 1) + " ms";
              };'''
          new_lambda = '''    speedKnob.textFromValueFunction = [this](double val)
              {
                  if (scaleLockButton.getToggleState())
                  {
                      const int mode = processorRef.processingMode.load();
                      if (mode > 0)
                      {
                          const double norm = std::pow(
                              juce::jlimit(0.0, 1.0, val / 500.0), 1.35);
                          const double mappedVal = mode == 1 ? 3.0 + 4.0 * norm
                              : mode == 2 ? 1.5 + 3.5 * norm
                                          : 0.35 + 2.65 * norm;
                          return juce::String(mappedVal, 2) + " ms";
                      }
                  }
                  return juce::String(val, 1) + " ms";
              };'''
          if editor.count(old_lambda) != 1:
              raise RuntimeError('unexpected Scale Lock speed lambda')
          editor = editor.replace(old_lambda, new_lambda, 1)

          old_mode = '''        processorRef.updateProcessingMode (newMode);
                  repaint(); // refresh the mode indicator dot'''
          new_mode = '''        processorRef.updateProcessingMode (newMode);
                  speedKnob.updateText();
                  repaint(); // refresh the mode indicator dot'''
          if editor.count(old_mode) != 1:
              raise RuntimeError('unexpected mode selection handler')
          editor = editor.replace(old_mode, new_mode, 1)
          editor_path.write_text(editor, encoding='utf-8')
          PY

      - name: Verify clean architecture
        shell: bash
        run: |
          test "$(wc -l < Source/ModernPitchEngine.cpp)" -le 3000
          ! grep -E 'SynthesisLayer|TransitionManager|SpectralVoiceShifter|CorrectionController|wetMix_|dryTrust_|NeumatonOutputRenderer|NeumatonRidgeLedger|NEUMATON_OUTPUT_V3' Source/ModernPitchEngine.cpp Source/ModernPitchEngine.h
          grep -q 'MultiRatePitchTracker' Source/ModernPitchEngine.cpp
          grep -q 'tempoController_\.beginBlock' Source/ModernPitchEngine.cpp
          grep -q 'Amount scales the pitch destination itself' Source/ModernPitchEngine.cpp
          grep -q 'speedKnob.updateText' Source/PluginEditor.cpp

      - name: Commit integrated source
        shell: bash
        run: |
          rm -rf .integration-payload
          rm -f .github/workflows/apply-modern-pitch-integration.yml
          git config user.name 'neumaton-integration-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate full ModernPitchEngine controls into clean output'
          git push origin HEAD:modern-pitch-engine-clean-rewrite
