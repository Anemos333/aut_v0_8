name: Validate linear complex bin interpolation v1

on:
  push:
    branches:
      - voice-aware-f0-parallel-golden-v1
    paths:
      - Tests/ApplyLinearComplexBinInterpolation.py
      - .github/workflows/validate-linear-complex-bin-interpolation-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: voice-aware-f0-parallel-golden-v1
          fetch-depth: 0

      - name: Guard frozen baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Source/ModernPitchEngine.cpp)" = "bc99c8895c570d3ee434667fb0aa6ebf356f7a20"
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          test "$(git hash-object Source/SingleWetSpectralRenderer.h)" = "2b68b3b3d5dc0579cdab94f4969203ef876ef058"
          grep -q 'RESIDUAL_HANN_LAZY_MEMOIZATION_V1' Source/ModernPitchEngine.cpp
          grep -q 'TARGET_REVISION_DIAGNOSTIC_LATCH_V2' Source/ModernPitchEngine.cpp
          ! grep -q 'STRUCTURED_IDENTITY_AUTHORITY_V1' Source/ModernPitchEngine.cpp
          ! grep -q 'LINEAR_COMPLEX_BIN_INTERPOLATION_V1' Source/SingleWetSpectralRenderer.cpp

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y             libasound2-dev libjack-jackd2-dev ladspa-sdk             libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev             libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Materialize exact baseline
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/neumaton-linear-baseline 766e7755157df62ab4b750a792fdb03c8c487e8b
          cp Tests/RendererReferenceDecompositionTest.cpp /tmp/neumaton-linear-baseline/Tests/RendererReferenceDecompositionTest.cpp

      - name: Apply candidate only to renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 Tests/ApplyLinearComplexBinInterpolation.py
          test "$(git diff --name-only)" = "Source/SingleWetSpectralRenderer.cpp"
          grep -q 'LINEAR_COMPLEX_BIN_INTERPOLATION_V1' Source/SingleWetSpectralRenderer.cpp
          test "$(git hash-object Source/ModernPitchEngine.cpp)" = "bc99c8895c570d3ee434667fb0aa6ebf356f7a20"

      - name: Verify frozen detector oracle
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/supervisor-detector.cpp
          cp Tests/GoldenDetectorDeterminismTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-detector -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-detector --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          for run in 1 2 3; do
            ./build-detector/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee "/tmp/detector-$run.log"
            grep -q '^GOLDEN_DETECTOR_TRACE_HASH=58273352d40c5499$' "/tmp/detector-$run.log"
          done
          cp /tmp/supervisor-detector.cpp Tests/SupervisorContinuityTest.cpp
          echo 'LINEAR_COMPLEX_DETECTOR_GOLDEN=PASS'

      - name: Run existing renderer contracts
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-renderer-contracts -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-renderer-contracts --config Release --parallel 2 --target SingleWetSpectralRendererTest >/dev/null
          ./build-renderer-contracts/clean-engine-tests/SingleWetSpectralRendererTest 2>&1 | tee /tmp/renderer-contracts.log
          ! grep -q '=FAIL' /tmp/renderer-contracts.log
          echo 'LINEAR_COMPLEX_RENDERER_CONTRACTS=PASS'

      - name: Build baseline reference decomposition
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/neumaton-linear-baseline
          cp Tests/SingleWetSpectralRendererTest.cpp /tmp/baseline-renderer-original.cpp
          cp Tests/RendererReferenceDecompositionTest.cpp Tests/SingleWetSpectralRendererTest.cpp
          cmake -S . -B build-reference -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-reference --config Release --parallel 2 --target SingleWetSpectralRendererTest >/dev/null
          set +e
          ./build-reference/clean-engine-tests/SingleWetSpectralRendererTest 2>&1 | tee /tmp/linear-baseline-reference.log
          set -e
          cp /tmp/baseline-renderer-original.cpp Tests/SingleWetSpectralRendererTest.cpp

      - name: Build candidate reference decomposition
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SingleWetSpectralRendererTest.cpp /tmp/candidate-renderer-original.cpp
          cp Tests/RendererReferenceDecompositionTest.cpp Tests/SingleWetSpectralRendererTest.cpp
          cmake -S . -B build-reference-candidate -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-reference-candidate --config Release --parallel 2 --target SingleWetSpectralRendererTest >/dev/null
          set +e
          ./build-reference-candidate/clean-engine-tests/SingleWetSpectralRendererTest 2>&1 | tee /tmp/linear-candidate-reference.log
          set -e
          cp /tmp/candidate-renderer-original.cpp Tests/SingleWetSpectralRendererTest.cpp

      - name: Compare structural cases
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math, re

          def rows(path):
              out = {}
              for line in Path(path).read_text().splitlines():
                  if not line.startswith('RENDERER_REFERENCE_SHIFT '):
                      continue
                  fields = dict(re.findall(r'(\w+)=([^ ]+)', line))
                  key = (
                      int(fields['frame']),
                      fields['vowel'],
                      float(fields['source_f0']),
                      float(fields['correction_cents']),
                  )
                  out[key] = {k: float(v) if k not in ('vowel',) else v
                              for k, v in fields.items() if k != 'frame'}
              return out

          b = rows('/tmp/linear-baseline-reference.log')
          c = rows('/tmp/linear-candidate-reference.log')

          focus = [
              (256, 'i', 118.0, 37.0),
              (256, 'i', 196.0, 700.0),
              (256, 'u', 196.0, 700.0),
              (512, 'i', 118.0, 37.0),
          ]

          for key in focus:
              br = b[key]
              cr = c[key]
              print('LINEAR_COMPLEX_COMPARE',
                    f'frame={key[0]}',
                    f'vowel={key[1]}',
                    f'source={key[2]}',
                    f'cents={key[3]}',
                    f'baseline_excess={br["excess_error_cents"]:.6f}',
                    f'candidate_excess={cr["excess_error_cents"]:.6f}',
                    f'baseline_f0_2f0={br["out_f0_to_2f0"]:.6f}',
                    f'candidate_f0_2f0={cr["out_f0_to_2f0"]:.6f}',
                    f'ideal_f0_2f0={br["ideal_f0_to_2f0"]:.6f}')

          # Candidate is interesting only if it fixes the actual 256 low-F0
          # pitch bias rather than trading one unrelated metric for another.
          low = (256, 'i', 118.0, 37.0)
          if abs(c[low]['excess_error_cents']) >= abs(b[low]['excess_error_cents']):
              raise SystemExit('candidate did not improve low-F0 256 pitch bias')

          print('LINEAR_COMPLEX_REFERENCE_COMPARISON=PASS')
          PY

      - name: Finish
        run: echo 'LINEAR_COMPLEX_INTERPOLATION_VALIDATION=PASS_NO_PROMOTION'
