name: Probe unresolved whole-note families
on:
  push:
    branches: [v1-f0-demolish-and-rebuild-v1]
    paths:
      - Tests/F0WholeNoteNeverFamilyProbe.cpp
      - Tests/F0WholeNoteProgressiveProbe.cpp
      - Tests/F0WholeNoteTunerProbe.cpp
      - Tests/F0VoiceLikeStressProbe.cpp
      - Tests/F0HarmonicFamilyProbe.cpp
      - .github/workflows/probe-f0-never-family-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: v1-f0-demolish-and-rebuild-v1 }
      - name: Build unresolved-family probe
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Wpedantic \
              Tests/F0WholeNoteNeverFamilyProbe.cpp \
              -o /tmp/f0-never-family
      - name: Run diagnostic
        run: |
          /tmp/f0-never-family | tee /tmp/f0-never-family.log
          grep '^NEVER_FAMILY_' /tmp/f0-never-family.log
