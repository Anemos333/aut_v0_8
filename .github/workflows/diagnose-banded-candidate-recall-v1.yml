name: Diagnose banded candidate recall v1
on:
  push:
    branches: [v1-continuous-f0-minimal-recomposition-v1]
    paths:
      - Tests/BandedCandidateRecallDiagnostic.cpp
      - .github/workflows/diagnose-banded-candidate-recall-v1.yml
  workflow_dispatch:
permissions: { contents: read }
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: v1-continuous-f0-minimal-recomposition-v1 }
      - run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev >/dev/null
      - run: |
          cp Tests/BandedCandidateRecallDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-recall -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-recall --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-recall/clean-engine-tests/SupervisorContinuityTest | tee /tmp/recall.log
          grep -q '^BANDED_RECALL ' /tmp/recall.log
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,statistics
          rows=[]
          for line in Path('/tmp/recall.log').read_text().splitlines():
              if not line.startswith('BANDED_RECALL '):continue
              d=dict(re.findall(r'(\w+)=([^ ]+)',line))
              for k in ['hz','snr','best_abs_cents']:d[k]=float(d[k])
              for k in ['family_recall','fine_recall']:d[k]=int(d[k])
              rows.append(d)
          for kind in ['normal','strong_second','missing_fundamental','onset_burst']:
              sub=[r for r in rows if r['kind']==kind]
              low=[r for r in sub if r['hz']<=220]
              print('BANDED_RECALL_SUMMARY'
                    f' kind={kind} n={len(sub)}'
                    f' family_recall={sum(r["family_recall"] for r in sub)/len(sub):.6f}'
                    f' low_family_recall={sum(r["family_recall"] for r in low)/len(low):.6f}'
                    f' fine_recall={sum(r["fine_recall"] for r in sub)/len(sub):.6f}'
                    f' median_best_cents={statistics.median(r["best_abs_cents"] for r in sub):.6f}'
                    f' worst_best_cents={max(r["best_abs_cents"] for r in sub):.6f}')
          PY
