name: Probe Controller No Return To Zero V10

on:
  push:
    branches:
      - one-voice-unified-spectrum-v10
    paths:
      - .github/workflows/probe-controller-no-zero-v10.yml
      - Tests/MonotonicTargetAuthorityV9Patch.py
      - Tests/MonotonicTargetAuthorityV9Compatibility.py
      - Tests/MonotonicTargetAuthorityV9RescueRemoval.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply controller cleanup in workspace
        run: |
          python3 Tests/MonotonicTargetAuthorityV9Patch.py
          python3 Tests/MonotonicTargetAuthorityV9RescueRemoval.py
          python3 Tests/MonotonicTargetAuthorityV9Compatibility.py

      - name: Verify no runtime return to source world
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'state.desiredCents = 0.0' Source/ModernPitchEngine.cpp
          ! grep -q 'std::max(5.5' Source/ModernPitchEngine.cpp
          ! grep -q 'confirmedBreath.*desiredCents' Source/ModernPitchEngine.cpp
          ! grep -q 'confirmedAbsence.*desiredCents' Source/ModernPitchEngine.cpp
          grep -q 'return state.currentCents;' Source/ModernPitchEngine.cpp
          grep -q 'MONOTONIC_TARGET_AUTHORITY_V9' Source/ModernPitchEngine.cpp
          echo 'NO_RETURN_TO_ZERO_SOURCE_CONTRACT=PASS'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure focused tests
        run: |
          cmake -S . -B build-no-zero \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Build focused tests
        run: >-
          cmake --build build-no-zero --config Release
          --target CleanModernPitchEngineTest SupervisorContinuityTest
          SingleWetSpectralRendererTest --parallel 2

      - name: Run controller regression
        run: ./build-no-zero/clean-engine-tests/CleanModernPitchEngineTest

      - name: Run supervisor regression
        run: ./build-no-zero/clean-engine-tests/SupervisorContinuityTest

      - name: Run renderer regression unchanged
        run: ./build-no-zero/clean-engine-tests/SingleWetSpectralRendererTest
