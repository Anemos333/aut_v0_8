name: Refine Experimental V5 Coherence Parallel

on:
  push:
    branches:
      - quality-tail-glide-experimental-128-v3
    paths:
      - .github/workflows/probe-experimental-v5-coherence-refine-parallel.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        coherence: [0.80, 0.825, 0.85, 0.875, 0.90]
        lock: [0.75, 0.80, 0.85, 0.90, 0.95]
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate point
        env:
          NEUMATON_COHERENCE_SCALE: ${{ matrix.coherence }}
          NEUMATON_LOCK_SCALE: ${{ matrix.lock }}
        run: |
          python3 Tests/ExperimentalV5CoherenceSweep.py >/dev/null
          g++ -std=c++17 -O2 \
            Tests/SingleWetSpectralRendererTest.cpp \
            Source/SingleWetSpectralRenderer.cpp \
            -ISource -o experimental_refine_test
          set +e
          ./experimental_refine_test > result.log 2>&1
          set -e
          python3 - '${{ matrix.coherence }}' '${{ matrix.lock }}' > metric.csv <<'PY'
          import math, re, sys
          text = open('result.log', encoding='utf-8').read()
          c, l = sys.argv[1:3]
          ratio = float(re.search(r'experimental_128_shifted_harmonic_family_ratio=([-+0-9.eE]+)', text).group(1))
          vals = [float(re.search(rf'experimental_128_harmonic_{h}_error_cents=([-+0-9.eE]+)', text).group(1)) for h in range(1,9)]
          absvals = [abs(v) for v in vals]
          mae = sum(absvals)/8
          rms = math.sqrt(sum(v*v for v in vals)/8)
          print(','.join([c,l,f'{ratio:.6f}',f'{mae:.6f}',f'{rms:.6f}',f'{max(absvals):.6f}']+[f'{v:.6f}' for v in vals]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: metric-${{ matrix.coherence }}-${{ matrix.lock }}
          path: metric.csv
          retention-days: 1

  aggregate:
    needs: probe
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: metric-*
          path: metrics
          merge-multiple: false
      - name: Aggregate
        run: |
          printf 'coherence,lock,source_ratio,mae_ct,rms_ct,max_ct,h1,h2,h3,h4,h5,h6,h7,h8\n' > summary.csv
          find metrics -name metric.csv -print0 | xargs -0 cat >> summary.csv
          echo '--- SORTED BY RMS ---'
          { head -n1 summary.csv; tail -n +2 summary.csv | sort -t, -k5,5n; } | head -n 16
          echo '--- SORTED BY MAX ERROR ---'
          { head -n1 summary.csv; tail -n +2 summary.csv | sort -t, -k6,6n; } | head -n 16
