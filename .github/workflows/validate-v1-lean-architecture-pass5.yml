name: Validate v1 lean architecture pass5

on:
  push:
    branches:
      - v1-lean-architecture-pass5
    paths:
      - Source/ModernPitchEngine.cpp
      - Source/ModernPitchEngine.h
      - Source/LivePitchProcessor.h
      - Source/PluginProcessor.cpp
      - Source/ScaleLockPitchEngine.h
      - Source/ScaleLockPitchEngine.cpp
      - Tests/SupervisorContinuityTest.cpp
      - Tests/CleanModernPitchEngineTest.cpp
      - Tests/GoldenEngineBehaviorCorpusTest.cpp
      - Tests/CorrectionTrajectoryGoldenTest.cpp
      - Tests/GuiAudibilityTest.cpp
      - Tests/PluginInputSanitizeEquivalenceTest.cpp
      - .github/workflows/validate-v1-lean-architecture-pass5.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout pass5
        uses: actions/checkout@v4
        with:
          ref: v1-lean-architecture-pass5
          fetch-depth: 0

      - name: Guard architecture
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cfdbd4eede7955ca4f01570f857a965c216acd8f HEAD
          grep -q 'QUANTIZER_GEOMETRY_ONLY_V2' Source/ModernPitchEngine.cpp
          grep -q 'HOLD_SINGLE_OWNER_V1' Source/LivePitchProcessor.h
          grep -q 'LEGACY_AUDIO_POLICY_ARGS_REMOVED_V1' Source/LivePitchProcessor.h
          grep -q 'TRACKER_INPUT_SANITIZE_OWNED_UPSTREAM_V1' Source/ModernPitchEngine.cpp
          grep -q 'PLUGIN_INPUT_SANITIZE_OWNED_DOWNSTREAM_V1' Source/PluginProcessor.cpp
          ! grep -q 'chooseTargetLog2' Source/ModernPitchEngine.h Source/ModernPitchEngine.cpp
          ! grep -q 'zeroPrudenceAuthority' Source/ModernPitchEngine.h Source/ModernPitchEngine.cpp
          ! grep -q 'lockStrictness' Source/ModernPitchEngine.h Source/ModernPitchEngine.cpp Source/LivePitchProcessor.h
          ! grep -q 'hardLockActive' Source/ModernPitchEngine.h Source/ModernPitchEngine.cpp Source/LivePitchProcessor.h
          test ! -e Source/ScaleLockPitchEngine.h
          test ! -e Source/ScaleLockPitchEngine.cpp
          echo 'LEAN_PASS5_SCOPE=PASS'

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y             libasound2-dev libjack-jackd2-dev ladspa-sdk             libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev             libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Configure and build full plugin
        run: |
          cmake -S . -B build-pass5             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-pass5 --config Release --parallel 2 --target Neumaton >/dev/null

      - name: Preserve test slots
        run: |
          cp Tests/SupervisorContinuityTest.cpp /tmp/pass5-supervisor.cpp
          cp Tests/SingleWetSpectralRendererTest.cpp /tmp/pass5-renderer.cpp

      - name: Detector oracle
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/GoldenDetectorDeterminismTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-pass5 --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          for run in 1 2 3; do
            ./build-pass5/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee "/tmp/pass5-detector-$run.log"
            grep -q '^GOLDEN_DETECTOR_TRACE_HASH=58273352d40c5499$' "/tmp/pass5-detector-$run.log"
          done
          echo 'LEAN_PASS5_DETECTOR_BIT_EXACT=PASS'

      - name: Trajectory oracle
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/CorrectionTrajectoryGoldenTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-pass5 --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-pass5/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/pass5-trajectory.log
          grep -q '^CORRECTION_TRAJECTORY_HASH=3c958f8178c118a3$' /tmp/pass5-trajectory.log
          echo 'LEAN_PASS5_TRAJECTORY_EXACT=PASS'

      - name: End-to-end golden corpus
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/GoldenEngineBehaviorCorpusTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-pass5 --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-pass5/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/pass5-engine.log
          grep -q '^GOLDEN_ENGINE_BEHAVIOR_CORPUS=PASS scenarios=14$' /tmp/pass5-engine.log
          grep -q '^GOLDEN_ENGINE_CORPUS_HASH=982b4ad85accdd75$' /tmp/pass5-engine.log
          echo 'LEAN_PASS5_ENGINE_EXACT=PASS'

      - name: Renderer oracle
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/RendererDiagnosticTransparencyTest.cpp Tests/SingleWetSpectralRendererTest.cpp
          cmake --build build-pass5 --config Release --parallel 2 --target SingleWetSpectralRendererTest >/dev/null
          ./build-pass5/clean-engine-tests/SingleWetSpectralRendererTest 2>&1 | tee /tmp/pass5-renderer.log
          grep -q '^RENDERER_TRANSPARENCY_HASH_256=ce9950c8dec7364$' /tmp/pass5-renderer.log
          grep -q '^RENDERER_TRANSPARENCY_HASH_512=685aa631a64ef991$' /tmp/pass5-renderer.log
          echo 'LEAN_PASS5_RENDERER_EXACT=PASS'

      - name: Plugin raw-input equivalence
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/PluginInputSanitizeEquivalenceTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-pass5 --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-pass5/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/pass5-input-sanitize.log
          grep -q '^PLUGIN_INPUT_SANITIZE_EQUIVALENCE=PASS$' /tmp/pass5-input-sanitize.log
          echo 'LEAN_PASS5_PLUGIN_INPUT_SANITIZE_EXACT=PASS'

      - name: Public sanitizer boundary
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SanitizerSmoke.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-pass5 --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-pass5/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/pass5-sanitizer.log
          grep -q '^Sanitizer smoke passed\.$' /tmp/pass5-sanitizer.log
          echo 'LEAN_PASS5_SANITIZER_BOUNDARY=PASS'

      - name: Normal contracts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pass5-supervisor.cpp Tests/SupervisorContinuityTest.cpp
          cp /tmp/pass5-renderer.cpp Tests/SingleWetSpectralRendererTest.cpp
          cmake --build build-pass5 --config Release --parallel 2             --target SupervisorContinuityTest CleanModernPitchEngineTest SingleWetSpectralRendererTest GuiAudibilityTest >/dev/null
          ./build-pass5/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/pass5-supervisor.log
          ./build-pass5/clean-engine-tests/CleanModernPitchEngineTest 2>&1 | tee /tmp/pass5-clean.log
          ./build-pass5/clean-engine-tests/SingleWetSpectralRendererTest 2>&1 | tee /tmp/pass5-renderer-contracts.log
          ./build-pass5/clean-engine-tests/GuiAudibilityTest 2>&1 | tee /tmp/pass5-gui.log
          ! grep -q '=FAIL' /tmp/pass5-supervisor.log
          ! grep -q '=FAIL' /tmp/pass5-clean.log
          ! grep -q '=FAIL' /tmp/pass5-renderer-contracts.log
          ! grep -q '=FAIL' /tmp/pass5-gui.log
          grep -q 'hold_is_owned_by_engine_identity_boundary=PASS' /tmp/pass5-supervisor.log
          echo 'LEAN_PASS5_NORMAL_CONTRACTS=PASS'

      - name: Final marker
        run: |
          echo 'V1_LEAN_ARCHITECTURE_PASS5=PASS_EXACT_BEHAVIOR'
          echo 'LEGACY_AUTHORITY_AND_DUPLICATE_SANITIZERS_REMOVED=PASS'
