name: Detector basin geometry compact

on:
  push:
    branches:
      - voice-aware-f0-detector-v1
    paths:
      - .github/workflows/detector-basin-geometry-compact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-basin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard and materialize V6.1 diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          test "$(git hash-object Source/SingleWetSpectralRenderer.h)" = "2b68b3b3d5dc0579cdab94f4969203ef876ef058"
          python3 Tests/RefinePrimitivePeriodPathGeometryV1.py >/tmp/materialize.log
          python3 Tests/InstrumentPeriodProvenanceV1.py >>/tmp/materialize.log
          python3 Tests/InstrumentBasinGeometryV2.py >>/tmp/materialize.log
          grep -q 'AUTHORITATIVE_RESCUE_CORROBORATION_V6_1' Source/ModernPitchEngine.cpp
          grep -q 'PERIOD_PROVENANCE_DIAGNOSTIC_V1' Source/ModernPitchEngine.cpp
          grep -q 'BASIN_GEOMETRY_DIAGNOSTIC_V2' Source/ModernPitchEngine.cpp
          ! grep -q 'ADAPTIVE_OBSERVABILITY_PERIOD_GATE_V6_3' Source/ModernPitchEngine.cpp
          ! grep -q 'QUALIFIED_FIRST_MINIMUM_OWNS_PATH_V6_2' Source/ModernPitchEngine.cpp
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          test "$(git hash-object Source/SingleWetSpectralRenderer.h)" = "2b68b3b3d5dc0579cdab94f4969203ef876ef058"

      - name: Install dependencies quietly
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/tmp/apt.log 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev >>/tmp/apt.log 2>&1

      - name: Build diagnostic quietly
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/SupervisorContinuityTest.original.cpp
          cp Tests/DetectorBasinGeometryDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          if ! cmake -S . -B build-basin-compact -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/tmp/cmake.log 2>&1; then
            tail -n 120 /tmp/cmake.log
            exit 1
          fi
          if ! cmake --build build-basin-compact --config Release --parallel 2 --target SupervisorContinuityTest >/tmp/build.log 2>&1; then
            tail -n 160 /tmp/build.log
            exit 1
          fi
          ./build-basin-compact/clean-engine-tests/SupervisorContinuityTest >/tmp/basin.log
          cp /tmp/SupervisorContinuityTest.original.cpp Tests/SupervisorContinuityTest.cpp

      - name: Print compact basin summary
        shell: bash
        run: |
          set -euo pipefail
          echo '=== BASIN SUMMARY ==='
          grep '^BASIN_CASE ' /tmp/basin.log || true
          grep '^BASIN_MOTION ' /tmp/basin.log || true
          echo '=== FIRST BASIN EVENTS ==='
          grep '^BASIN_EVENT ' /tmp/basin.log | head -n 60 || true
