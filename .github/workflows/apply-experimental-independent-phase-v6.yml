name: Apply Experimental Independent Partial Phase V6

on:
  push:
    branches: [quality-tail-glide-experimental-128-v3]
    paths:
      - 'Tests/ExperimentalIndependentPartialPhaseV6Patch.py'
      - '.github/workflows/apply-experimental-independent-phase-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality-tail-glide-experimental-128-v3
          fetch-depth: 1
      - name: Apply guarded patch
        run: python3 Tests/ExperimentalIndependentPartialPhaseV6Patch.py
      - name: Verify scope and semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'EXPERIMENTAL_TRUE_PARTIAL_TRANSPORT_V5' Source/SingleWetSpectralRenderer.cpp
          grep -q 'EXPERIMENTAL_INDEPENDENT_PARTIAL_PHASE_V6' Source/SingleWetSpectralRenderer.cpp
          grep -q 'if (frameSize_ == 256 && !nearestPeak_.empty())' Source/SingleWetSpectralRenderer.cpp
          ! grep -q 'if (frameSize_ <= 256 && !nearestPeak_.empty())' Source/SingleWetSpectralRenderer.cpp
          grep -q 'experimental_128_harmonic_' Tests/SingleWetSpectralRendererTest.cpp
          git diff --exit-code -- Source/ModernPitchEngine.cpp Source/ModernPitchEngine.h Source/PluginProcessor.cpp Source/PluginEditor.cpp
      - name: Materialize renderer and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/SingleWetSpectralRenderer.cpp Tests/SingleWetSpectralRendererTest.cpp Tests/GuiAudioControlContractTest.cpp
          if git diff --cached --quiet; then
            echo 'No materialized changes'
            exit 0
          fi
          git commit -m 'Keep Experimental 128 partial phase velocities independent V6'
          git push origin HEAD:quality-tail-glide-experimental-128-v3
