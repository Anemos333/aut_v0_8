name: Validate v1 lean architecture pass4

on:
  push:
    branches:
      - v1-lean-architecture-pass4
    paths:
      - Source/ModernPitchEngine.cpp
      - Source/ModernPitchEngine.h
      - Source/LivePitchProcessor.h
      - Tests/LiveScaleContextEquivalenceTest.cpp
      - Tests/SupervisorContinuityTest.cpp
      - .github/workflows/validate-v1-lean-architecture-pass4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout pass4
        uses: actions/checkout@v4
        with:
          ref: v1-lean-architecture-pass4
          fetch-depth: 0

      - name: Guard architecture
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e13b0bb03800772ed8d54939288c686334c2c25e HEAD
          grep -q 'QUANTIZER_STATE_ABLATION_V1' Source/ModernPitchEngine.cpp
          grep -q 'HOLD_OWNERSHIP_BOUNDARY_V1' Tests/SupervisorContinuityTest.cpp
          ! grep -q 'minScaleStepCents' Source/ModernPitchEngine.h Source/LivePitchProcessor.h
          ! grep -q 'scaleSize' Source/ModernPitchEngine.h Source/LivePitchProcessor.h
          ! grep -q 'calculateMinScaleStepCents' Source/LivePitchProcessor.h
          ! grep -q 'updateScaleLockContext' Source/LivePitchProcessor.h
          echo 'LEAN_PASS4_SCOPE=PASS'

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y             libasound2-dev libjack-jackd2-dev ladspa-sdk             libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev             libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Configure and build full plugin
        run: |
          cmake -S . -B build-pass4             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-pass4 --config Release --parallel 2 --target Neumaton >/dev/null

      - name: Preserve test slots
        run: |
          cp Tests/SupervisorContinuityTest.cpp /tmp/pass4-supervisor.cpp
          cp Tests/SingleWetSpectralRendererTest.cpp /tmp/pass4-renderer.cpp

      - name: Live path exact equivalence to pass3
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/LiveScaleContextEquivalenceTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-pass4 --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-pass4/clean-engine-tests/SupervisorContinuityTest             2>&1 | tee /tmp/pass4-live.log
          grep '^LIVE_SCALE_CONTEXT_HASH=' /tmp/pass4-live.log > /tmp/pass4-live-hash.txt

          git worktree add --detach /tmp/neumaton-pass3             e13b0bb03800772ed8d54939288c686334c2c25e
          cd /tmp/neumaton-pass3
          cp "$GITHUB_WORKSPACE/Tests/LiveScaleContextEquivalenceTest.cpp"             Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-pass3-ref             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-pass3-ref --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-pass3-ref/clean-engine-tests/SupervisorContinuityTest             2>&1 | tee /tmp/pass3-live.log
          grep '^LIVE_SCALE_CONTEXT_HASH=' /tmp/pass3-live.log > /tmp/pass3-live-hash.txt
          diff -u /tmp/pass3-live-hash.txt /tmp/pass4-live-hash.txt
          echo 'LEAN_PASS4_LIVE_EXACT_EQUIVALENCE=PASS'

      - name: Detector oracle
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cp Tests/GoldenDetectorDeterminismTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-pass4 --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          for run in 1 2 3; do
            ./build-pass4/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee "/tmp/pass4-detector-$run.log"
            grep -q '^GOLDEN_DETECTOR_TRACE_HASH=58273352d40c5499$' "/tmp/pass4-detector-$run.log"
          done
          echo 'LEAN_PASS4_DETECTOR_BIT_EXACT=PASS'

      - name: Trajectory and engine corpus
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/CorrectionTrajectoryGoldenTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-pass4 --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-pass4/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/pass4-trajectory.log
          grep -q '^CORRECTION_TRAJECTORY_HASH=3c958f8178c118a3$' /tmp/pass4-trajectory.log

          cp Tests/GoldenEngineBehaviorCorpusTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-pass4 --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-pass4/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/pass4-engine.log
          grep -q '^GOLDEN_ENGINE_CORPUS_HASH=982b4ad85accdd75$' /tmp/pass4-engine.log
          echo 'LEAN_PASS4_UPSTREAM_EXACT=PASS'

      - name: Renderer exact hash
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/RendererDiagnosticTransparencyTest.cpp Tests/SingleWetSpectralRendererTest.cpp
          cmake --build build-pass4 --config Release --parallel 2 --target SingleWetSpectralRendererTest >/dev/null
          ./build-pass4/clean-engine-tests/SingleWetSpectralRendererTest 2>&1 | tee /tmp/pass4-renderer.log
          grep -q '^RENDERER_TRANSPARENCY_HASH_256=ce9950c8dec7364$' /tmp/pass4-renderer.log
          grep -q '^RENDERER_TRANSPARENCY_HASH_512=685aa631a64ef991$' /tmp/pass4-renderer.log
          echo 'LEAN_PASS4_RENDERER_EXACT=PASS'

      - name: Normal contracts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pass4-supervisor.cpp Tests/SupervisorContinuityTest.cpp
          cp /tmp/pass4-renderer.cpp Tests/SingleWetSpectralRendererTest.cpp
          cmake --build build-pass4 --config Release --parallel 2             --target SupervisorContinuityTest CleanModernPitchEngineTest SingleWetSpectralRendererTest >/dev/null
          ./build-pass4/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/pass4-supervisor.log
          ./build-pass4/clean-engine-tests/CleanModernPitchEngineTest 2>&1 | tee /tmp/pass4-clean.log
          ./build-pass4/clean-engine-tests/SingleWetSpectralRendererTest 2>&1 | tee /tmp/pass4-renderer-contracts.log
          ! grep -q '=FAIL' /tmp/pass4-supervisor.log
          ! grep -q '=FAIL' /tmp/pass4-clean.log
          ! grep -q '=FAIL' /tmp/pass4-renderer-contracts.log
          grep -q 'hold_is_owned_by_engine_identity_boundary=PASS' /tmp/pass4-supervisor.log
          echo 'LEAN_PASS4_NORMAL_CONTRACTS=PASS'

      - name: Final marker
        run: |
          echo 'V1_LEAN_ARCHITECTURE_PASS4=PASS_EXACT_BEHAVIOR'
          echo 'SCALE_CONTEXT_REALTIME_DUPLICATION_REMOVED=PASS'
