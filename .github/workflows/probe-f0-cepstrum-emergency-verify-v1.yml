name: Verify fixed cepstrum emergency F0 rule
on:
  push:
    branches: [v1-f0-demolish-and-rebuild-v1]
    paths:
      - 'Source/F0WholeNoteDetectorV1.h'
      - 'Tests/F0CepstrumEmergencyProbe.cpp'
      - 'Tests/F0CepstrumEmergencyVerification.cpp'
      - 'Tests/F0WholeNoteExtendedEightProbe.cpp'
      - 'Tests/F0WholeNoteProgressiveProbe.cpp'
      - '.github/workflows/probe-f0-cepstrum-emergency-verify-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-f0-demolish-and-rebuild-v1
      - name: Prepare reusable probe includes
        run: |
          sed -i '0,/^int main()$/{s/^int main()$/int progressive_probe_reference_main()/}' Tests/F0WholeNoteProgressiveProbe.cpp
          sed -i '0,/^int main()$/{s/^int main()$/int extended_eight_reference_main()/}' Tests/F0WholeNoteExtendedEightProbe.cpp
          sed -i '0,/^int main()$/{s/^int main()$/int cepstrum_probe_reference_main()/}' Tests/F0CepstrumEmergencyProbe.cpp
      - name: Build fixed-rule verification
        run: |
          g++ -std=c++17 -O3 -march=native -Wall -Wextra -Wpedantic \
              Tests/F0CepstrumEmergencyVerification.cpp \
              -o /tmp/f0-cepstrum-verify
      - name: Run verification
        run: |
          /tmp/f0-cepstrum-verify | tee /tmp/f0-cepstrum-verify.log
          grep '^CEPSTRUM_FIXED_VERIFY' /tmp/f0-cepstrum-verify.log
