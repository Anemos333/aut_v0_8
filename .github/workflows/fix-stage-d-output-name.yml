name: Fix Stage D Output Name

on:
  push:
    branches:
      - output-stage-v3-audio-renderer
    paths:
      - '.github/workflows/fix-stage-d-output-name.yml'
      - 'Source/ModernPitchEngine.cpp'
  pull_request:
    paths:
      - '.github/workflows/fix-stage-d-output-name.yml'
      - 'Source/ModernPitchEngine.cpp'

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'output-stage-v3-audio-renderer'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: output-stage-v3-audio-renderer
          fetch-depth: 0
      - name: Rename exclusive V3 output local
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('Source/ModernPitchEngine.cpp')
          text = path.read_text(encoding='utf-8')
          declaration = '    const float output = sanitiseAudioSample(\n        v3OutputRenderer_.consumeSample(currentSample));'
          return_anchor = '    return output;\n#endif\n\n    auto& primaryLayer'
          if text.count(declaration) != 1:
              raise SystemExit(f'declaration count: {text.count(declaration)}')
          if text.count(return_anchor) != 1:
              raise SystemExit(f'return anchor count: {text.count(return_anchor)}')
          text = text.replace(declaration, declaration.replace('const float output', 'const float v3Output'))
          text = text.replace(return_anchor, '    return v3Output;\n#endif\n\n    auto& primaryLayer')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/ModernPitchEngine.cpp
          git commit -m 'Fix Stage D output local name'
          git push origin HEAD:output-stage-v3-audio-renderer
