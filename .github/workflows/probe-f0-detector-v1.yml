name: Probe single-ring F0 detector v1
on:
  push:
    branches: [v1-f0-demolish-and-rebuild-v1]
    paths:
      - Tests/F0SingleRingAutocorrProbe.h
      - Source/F0PeriodicGateV1.h
      - Tests/F0DetectorContractV1.cpp
      - .github/workflows/probe-f0-detector-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: v1-f0-demolish-and-rebuild-v1 }
      - name: Build isolated detector
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Wpedantic \
              -ISource Tests/F0DetectorContractV1.cpp \
              -o /tmp/f0-detector-v1
      - name: Run contract probe
        run: |
          set +e
          /tmp/f0-detector-v1 | tee /tmp/f0-detector-v1.log
          status=${PIPESTATUS[0]}
          grep '^F0_V1_SUMMARY' /tmp/f0-detector-v1.log
          grep '^F0_DETECTOR_V1_RESULT=' /tmp/f0-detector-v1.log
          echo "detector_contract_exit=${status}"
          exit 0
