name: Probe extended F0 vs 2F0 exclusive holdout
on:
  push:
    branches: [v1-f0-demolish-and-rebuild-v1]
    paths:
      - Tests/F0WholeNoteExtendedExclusiveHoldoutProbe.cpp
      - Tests/F0WholeNoteExtendedEightProbe.cpp
      - Tests/F0WholeNoteProgressiveProbe.cpp
      - .github/workflows/probe-f0-extended-exclusive-holdout-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-f0-demolish-and-rebuild-v1
      - name: Build extended exclusive holdout
        run: |
          sed -i '0,/^int main()$/{s/^int main()$/int progressive_probe_reference_main()/}' \
              Tests/F0WholeNoteProgressiveProbe.cpp
          sed -i '0,/^int main()$/{s/^int main()$/int extended_eight_reference_main()/}' \
              Tests/F0WholeNoteExtendedEightProbe.cpp
          g++ -std=c++17 -O3 -Wall -Wextra -Wpedantic \
              Tests/F0WholeNoteExtendedExclusiveHoldoutProbe.cpp \
              -o /tmp/f0-extended-exclusive-holdout
      - name: Run holdout
        run: |
          /tmp/f0-extended-exclusive-holdout | tee /tmp/f0-extended-exclusive-holdout.log
          grep '^EXTENDED_EXCLUSIVE_HOLDOUT ' /tmp/f0-extended-exclusive-holdout.log
          grep '^EXTENDED_EXCLUSIVE_HOLDOUT_SAFE=' /tmp/f0-extended-exclusive-holdout.log
