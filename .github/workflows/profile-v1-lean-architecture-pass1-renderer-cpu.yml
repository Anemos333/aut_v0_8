name: Profile v1 lean architecture pass1 renderer CPU

on:
  push:
    branches:
      - v1-lean-architecture-pass1
    paths:
      - Source/SingleWetSpectralRenderer.cpp
      - Source/SingleWetSpectralRenderer.h
      - Tests/RendererCpuBenchmark.cpp
      - .github/workflows/profile-v1-lean-architecture-pass1-renderer-cpu.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: v1-lean-architecture-pass1
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y             libasound2-dev libjack-jackd2-dev ladspa-sdk             libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev             libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Build candidate benchmark
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SingleWetSpectralRendererTest.cpp /tmp/renderer-test-original.cpp
          cp Tests/RendererCpuBenchmark.cpp Tests/SingleWetSpectralRendererTest.cpp
          cmake -S . -B build-renderer-cpu             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-renderer-cpu --config Release --parallel 2             --target SingleWetSpectralRendererTest >/dev/null

      - name: Build parent benchmark
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/neumaton-renderer-parent             ca3e21e998b986f1d9a8a4c323da9cb49db5b228
          cd /tmp/neumaton-renderer-parent
          cp "$GITHUB_WORKSPACE/Tests/RendererCpuBenchmark.cpp"             Tests/SingleWetSpectralRendererTest.cpp
          cmake -S . -B build-renderer-cpu-parent             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-renderer-cpu-parent --config Release --parallel 2             --target SingleWetSpectralRendererTest >/dev/null

      - name: Interleaved benchmark
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/candidate-renderer-cpu.log
          : > /tmp/parent-renderer-cpu.log
          for round in 1 2 3 4 5; do
            if (( round % 2 )); then
              ./build-renderer-cpu/clean-engine-tests/SingleWetSpectralRendererTest                 >> /tmp/candidate-renderer-cpu.log
              /tmp/neumaton-renderer-parent/build-renderer-cpu-parent/clean-engine-tests/SingleWetSpectralRendererTest                 >> /tmp/parent-renderer-cpu.log
            else
              /tmp/neumaton-renderer-parent/build-renderer-cpu-parent/clean-engine-tests/SingleWetSpectralRendererTest                 >> /tmp/parent-renderer-cpu.log
              ./build-renderer-cpu/clean-engine-tests/SingleWetSpectralRendererTest                 >> /tmp/candidate-renderer-cpu.log
            fi
          done
          cat /tmp/candidate-renderer-cpu.log
          cat /tmp/parent-renderer-cpu.log

      - name: Compare medians
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, statistics

          def rows(path):
              out={256:[],512:[]}
              for line in Path(path).read_text().splitlines():
                  if not line.startswith("RENDERER_CPU "):
                      continue
                  d=dict(re.findall(r'(\w+)=([^ ]+)', line))
                  out[int(d["frame"])].append(float(d["elapsed_ms"]))
              return out

          candidate=rows("/tmp/candidate-renderer-cpu.log")
          parent=rows("/tmp/parent-renderer-cpu.log")
          for frame in (256,512):
              if len(candidate[frame]) != 5 or len(parent[frame]) != 5:
                  raise SystemExit("missing benchmark rows")
              c=statistics.median(candidate[frame])
              p=statistics.median(parent[frame])
              reduction=100.0*(p-c)/max(p,1e-9)
              print("RENDERER_CPU_MEDIAN",
                    f"frame={frame}",
                    f"parent_ms={p:.3f}",
                    f"candidate_ms={c:.3f}",
                    f"reduction_pct={reduction:.3f}")
              # Structural pass must never buy cleanliness with a material
              # renderer CPU regression. Shared runners are noisy, so only a
              # >5% median regression is a hard failure here.
              if c > p * 1.05:
                  raise SystemExit(
                      f"renderer CPU regression frame={frame}: {c:.3f} > {p:.3f}")
          print("V1_LEAN_PASS1_RENDERER_CPU_NO_REGRESSION=PASS")
          PY

      - name: Final marker
        run: echo 'V1_LEAN_PASS1_RENDERER_CPU_PROFILE=COMPLETE'
