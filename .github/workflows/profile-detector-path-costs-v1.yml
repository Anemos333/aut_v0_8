name: Profile detector path costs v1

on:
  push:
    branches:
      - v1-lean-scale-generation-ablation-v1
    paths:
      - Tests/DetectorPathCostBenchmark.cpp
      - .github/workflows/profile-detector-path-costs-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: v1-lean-scale-generation-ablation-v1

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y             libasound2-dev libjack-jackd2-dev ladspa-sdk             libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev             libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Build diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/DetectorPathCostBenchmark.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-detector-cost             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-detector-cost --config Release --parallel 2             --target SupervisorContinuityTest >/dev/null

      - name: Measure path costs
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/detector-path-cost.log
          for round in 1 2 3 4 5; do
            ./build-detector-cost/clean-engine-tests/SupervisorContinuityTest               | tee -a /tmp/detector-path-cost.log
          done

      - name: Report medians
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, statistics

          rows=[]
          for line in Path("/tmp/detector-path-cost.log").read_text().splitlines():
              if not line.startswith("DETECTOR_PATH_COST "):
                  continue
              values=dict(re.findall(r'(\w+)=([^ ]+)', line))
              rows.append({k: float(v) for k,v in values.items()})
          if len(rows) != 5:
              raise SystemExit(f"expected 5 rows, got {len(rows)}")

          keys=[
              "full_ms","half_ms","quarter_ms","eighth_ms","decode_ms",
              "weighted_analyse_ms_per_hop","weighted_total_ms_per_hop",
              "full_share","half_share","quarter_share","eighth_share","decode_share"
          ]
          med={k: statistics.median(row[k] for row in rows) for k in keys}
          print("DETECTOR_PATH_COST_MEDIAN", " ".join(f"{k}={med[k]:.6f}" for k in keys))
          print("DETECTOR_PATH_COST_PROFILE=PASS")
          PY
