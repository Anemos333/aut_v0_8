name: Apply V3 Contract Followup

on:
  push:
    branches: [quality-tail-glide-experimental-128-v3]
    paths:
      - 'Tests/V3ContractFollowupPatch.py'
      - '.github/workflows/apply-v3-contract-followup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Update contract
        run: python3 Tests/V3ContractFollowupPatch.py
      - name: Verify
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'SHORT_LATTICE_COHERENT_PHASE_V3' Tests/GuiAudioControlContractTest.cpp
          grep -q '\* transportSourceBin' Tests/GuiAudioControlContractTest.cpp
          grep -q 'frameSize_ <= 256' Tests/GuiAudioControlContractTest.cpp
      - name: Commit contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tests/GuiAudioControlContractTest.cpp
          if git diff --cached --quiet; then
            echo 'No contract change required'
          else
            git commit -m 'Update single-wet contract for short-lattice phase coherence'
            git push
          fi
