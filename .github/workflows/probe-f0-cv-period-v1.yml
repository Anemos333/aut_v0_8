name: Probe cross-validated whole-wave F0 periods
on:
  push:
    branches: [v1-f0-demolish-and-rebuild-v1]
    paths:
      - Tests/F0WholeNoteCrossValidatedPeriodProbe.cpp
      - Tests/F0WholeNoteLocalDoubleLagProbe.cpp
      - Tests/F0WholeNoteProgressiveProbe.cpp
      - .github/workflows/probe-f0-cv-period-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: v1-f0-demolish-and-rebuild-v1 }
      - name: Build cross-validated period probe
        run: |
          sed -i '0,/^int main()$/{s/^int main()$/int progressive_probe_reference_main()/}' \
              Tests/F0WholeNoteProgressiveProbe.cpp
          sed -i '0,/^int main()$/{s/^int main()$/int local_double_reference_main()/}' \
              Tests/F0WholeNoteLocalDoubleLagProbe.cpp
          g++ -std=c++17 -O3 -Wall -Wextra -Wpedantic \
              Tests/F0WholeNoteCrossValidatedPeriodProbe.cpp \
              -o /tmp/f0-cv-period
      - name: Run diagnostic
        run: |
          /tmp/f0-cv-period | tee /tmp/f0-cv-period.log
          grep '^CV_PERIOD_SUMMARY' /tmp/f0-cv-period.log
