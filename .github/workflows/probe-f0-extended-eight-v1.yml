name: Probe extended unresolved F0 families
on:
  push:
    branches: [v1-f0-demolish-and-rebuild-v1]
    paths:
      - Tests/F0WholeNoteExtendedEightProbe.cpp
      - Tests/F0WholeNoteProgressiveProbe.cpp
      - Tests/F0WholeNoteTunerProbe.cpp
      - Tests/F0VoiceLikeStressProbe.cpp
      - Tests/F0HarmonicFamilyProbe.cpp
      - .github/workflows/probe-f0-extended-eight-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: v1-f0-demolish-and-rebuild-v1 }
      - name: Build extended-eight probe
        run: |
          sed -i '0,/^int main()$/{s/^int main()$/int progressive_probe_reference_main()/}' \
              Tests/F0WholeNoteProgressiveProbe.cpp
          g++ -std=c++17 -O3 -Wall -Wextra -Wpedantic \
              Tests/F0WholeNoteExtendedEightProbe.cpp \
              -o /tmp/f0-extended-eight
      - name: Run diagnostic
        run: |
          /tmp/f0-extended-eight | tee /tmp/f0-extended-eight.log
          grep '^EXTENDED_EIGHT_SUMMARY' /tmp/f0-extended-eight.log
