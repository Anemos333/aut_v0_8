name: Parallel detector partition census v1

on:
  push:
    branches:
      - cpu-parallel-partition-census-v1
    paths:
      - Tests/ParallelPartitionCensusTest.cpp
      - .github/workflows/parallel-partition-census-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout census branch
        uses: actions/checkout@v4
        with:
          ref: cpu-parallel-partition-census-v1
          fetch-depth: 1

      - name: Guard promoted golden DSP
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Source/ModernPitchEngine.cpp)" = "5702fbc14dfe5d7e2f959096d7e56fff98198cea"
          test "$(git hash-object Source/ModernPitchEngine.h)" = "e4647f124f5b0253eb1216b62816b2c4dc3a0c30"
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          grep -q 'RESIDUAL_ENERGY_EXACT_REUSE_V1' Source/ModernPitchEngine.cpp
          echo 'PARTITION_CENSUS_GOLDEN_GUARD=PASS'

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Configure Release build
        run: cmake -S . -B build-partition-census -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Preserve historical test source
        run: cp Tests/SupervisorContinuityTest.cpp /tmp/partition-census-supervisor.original.cpp

      - name: Verify golden detector oracle
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/GoldenDetectorDeterminismTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-partition-census --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-partition-census/clean-engine-tests/SupervisorContinuityTest | tee /tmp/partition-census-golden.log
          grep -q '^GOLDEN_DETECTOR_BITWISE_DETERMINISM=PASS observations=12000$' /tmp/partition-census-golden.log
          grep -q '^GOLDEN_DETECTOR_TRACE_HASH=58273352d40c5499$' /tmp/partition-census-golden.log

      - name: Build partition census
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/ParallelPartitionCensusTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-partition-census --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          cp build-partition-census/clean-engine-tests/SupervisorContinuityTest /tmp/ParallelPartitionCensusTest

      - name: Run census five times
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/partition-census.log
          for run in 1 2 3 4 5; do
            echo "PARTITION_CENSUS_RUN=$run" | tee -a /tmp/partition-census.log
            /tmp/ParallelPartitionCensusTest | tee -a /tmp/partition-census.log
          done
          test "$(grep -c '^PARTITION_CENSUS_BIT_EQUIVALENCE=PASS repetitions=300$' /tmp/partition-census.log)" = "5"

      - name: Summarize partition medians
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/partition-census-summary.log
          from pathlib import Path
          import re, statistics

          rows = []
          for line in Path('/tmp/partition-census.log').read_text().splitlines():
              if line.startswith('PARTITION_CENSUS name='):
                  rows.append(dict(re.findall(r'(\w+)=([^ ]+)', line)))

          expected_names = (
              'quarter_main_full_half_worker_quarter',
              'super_main_full_half_worker_quarter_eighth',
              'super_main_full_quarter_worker_half_eighth',
              'super_main_full_eighth_worker_half_quarter',
          )
          if len(rows) != 5 * len(expected_names):
              raise SystemExit(f'expected {5 * len(expected_names)} rows, got {len(rows)}')

          for name in expected_names:
              group = [r for r in rows if r['name'] == name]
              if len(group) != 5:
                  raise SystemExit(f'{name}: expected 5 rows, got {len(group)}')
              def med(key):
                  return statistics.median(float(r[key]) for r in group)
              print('PARTITION_CENSUS_MEDIAN',
                    f'name={name}',
                    f'serial_p50_us={med("serial_p50_us"):.3f}',
                    f'parallel_p50_us={med("parallel_p50_us"):.3f}',
                    f'p50_reduction_pct={med("p50_reduction_pct"):.2f}',
                    f'serial_p95_us={med("serial_p95_us"):.3f}',
                    f'parallel_p95_us={med("parallel_p95_us"):.3f}',
                    f'p95_reduction_pct={med("p95_reduction_pct"):.2f}',
                    f'serial_p99_us={med("serial_p99_us"):.3f}',
                    f'parallel_p99_us={med("parallel_p99_us"):.3f}',
                    f'p99_reduction_pct={med("p99_reduction_pct"):.2f}',
                    f'parallel_max_us={med("parallel_max_us"):.3f}')
          PY
          cat /tmp/partition-census-summary.log >> "$GITHUB_STEP_SUMMARY"

      - name: Restore historical test source
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/partition-census-supervisor.original.cpp ]; then
            cp /tmp/partition-census-supervisor.original.cpp Tests/SupervisorContinuityTest.cpp
          fi

      - name: Final marker
        run: echo 'PARALLEL_PARTITION_CENSUS=PASS_TEST_ONLY_NO_PROMOTION'
