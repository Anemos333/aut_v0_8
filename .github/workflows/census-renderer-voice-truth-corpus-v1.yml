name: Census renderer voice truth corpus v1

on:
  push:
    branches:
      - voice-aware-f0-parallel-golden-v1
    paths:
      - Tests/RendererVoiceTruthCorpusTest.cpp
      - .github/workflows/census-renderer-voice-truth-corpus-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: voice-aware-f0-parallel-golden-v1
          fetch-depth: 0

      - name: Guard frozen measurement and renderer baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Source/ModernPitchEngine.cpp)" = "bc99c8895c570d3ee434667fb0aa6ebf356f7a20"
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          test "$(git hash-object Source/SingleWetSpectralRenderer.h)" = "2b68b3b3d5dc0579cdab94f4969203ef876ef058"
          grep -q 'RESIDUAL_HANN_LAZY_MEMOIZATION_V1' Source/ModernPitchEngine.cpp
          grep -q 'TARGET_REVISION_DIAGNOSTIC_LATCH_V2' Source/ModernPitchEngine.cpp
          ! grep -q 'STRUCTURED_IDENTITY_AUTHORITY_V1' Source/ModernPitchEngine.cpp

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y             libasound2-dev libjack-jackd2-dev ladspa-sdk             libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev             libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Prove detector oracle still frozen
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/supervisor-original.cpp
          cp Tests/GoldenDetectorDeterminismTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-detector -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-detector --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-detector/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/detector.log
          cp /tmp/supervisor-original.cpp Tests/SupervisorContinuityTest.cpp
          grep -q '^GOLDEN_DETECTOR_TRACE_HASH=58273352d40c5499$' /tmp/detector.log
          echo 'MEASUREMENT_GOLDEN_FROZEN=PASS'

      - name: Build renderer voice truth census
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SingleWetSpectralRendererTest.cpp /tmp/renderer-test-original.cpp
          cp Tests/RendererVoiceTruthCorpusTest.cpp Tests/SingleWetSpectralRendererTest.cpp
          cmake -S . -B build-voice-truth -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-voice-truth --config Release --parallel 2 --target SingleWetSpectralRendererTest >/dev/null
          set +e
          ./build-voice-truth/clean-engine-tests/SingleWetSpectralRendererTest 2>&1 | tee /tmp/renderer-voice-truth.log
          status=${PIPESTATUS[0]}
          set -e
          cp /tmp/renderer-test-original.cpp Tests/SingleWetSpectralRendererTest.cpp
          echo "RENDERER_VOICE_TRUTH_EXIT_STATUS=$status"
          grep '^RENDERER_VOICE_TRUTH ' /tmp/renderer-voice-truth.log || true
          grep '^RENDERER_VOICE_TRUTH_CORPUS=' /tmp/renderer-voice-truth.log || true
          # This is a census workflow: preserve the measurements even when the
          # broad reconstruction contract fails. A later candidate must improve
          # the measured failing cases without changing measurement golden.
          echo 'RENDERER_VOICE_TRUTH_CENSUS=COMPLETE'
