name: Path-local family persistence detector v6.5

on:
  push:
    branches:
      - voice-aware-f0-detector-v1
    paths:
      - Tests/RefinePrimitivePeriodPathGeometryV1.py
      - Tests/RefineCentFamilyAuthorityV6_4.py
      - Tests/RefinePathLocalFamilyPersistenceV6_5.py
      - Tests/DetectorExtremeDiagnostic.cpp
      - Tests/DetectorPathDiagnostic.cpp
      - Tests/DetectorMotionDiagnostic.cpp
      - .github/workflows/path-local-family-persistence-v6-5.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-path-local-family-persistence:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout current detector branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard frozen architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          test "$(git hash-object Source/SingleWetSpectralRenderer.h)" = "2b68b3b3d5dc0579cdab94f4969203ef876ef058"
          grep -q 'DIRECT_COORDINATE_OWNS_F0_V1' Source/ModernPitchEngine.cpp
          grep -q 'DETECTOR_VETO_NOT_PERMISSION_V1' Source/ModernPitchEngine.cpp
          grep -q 'HOLD_DOES_NOT_CREATE_NOTE_IDENTITY_V2' Source/ModernPitchEngine.cpp

      - name: Apply V6.1 V6.4 and path-local persistence V6.5 in workspace only
        run: |
          python3 Tests/RefinePrimitivePeriodPathGeometryV1.py
          python3 Tests/RefineCentFamilyAuthorityV6_4.py
          python3 Tests/RefinePathLocalFamilyPersistenceV6_5.py

      - name: Verify V6.5 experimental scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AUTHORITATIVE_RESCUE_CORROBORATION_V6_1' Source/ModernPitchEngine.cpp
          grep -q 'CENT_FAMILY_AUTHORITY_GATE_V6_4' Source/ModernPitchEngine.cpp
          grep -q 'PATH_LOCAL_FAMILY_PERSISTENCE_V6_5' Source/ModernPitchEngine.cpp
          grep -q 'PATH_LOCAL_FAMILY_PERSISTENCE_V6_5' Source/ModernPitchEngine.h
          ! grep -q 'ADAPTIVE_OBSERVABILITY_PERIOD_GATE_V6_3' Source/ModernPitchEngine.cpp
          ! grep -q 'QUALIFIED_FIRST_MINIMUM_OWNS_PATH_V6_2' Source/ModernPitchEngine.cpp
          ! grep -q 'PRIMITIVE_PERIOD_PATH_CADENCE_V5' Source/ModernPitchEngine.cpp
          ! grep -q 'RANGE_CENSORED_DIRECT_OWNERSHIP_V4' Source/ModernPitchEngine.cpp
          ! grep -q 'PRIMITIVE_PERIOD_WITHIN_PATH_V3' Source/ModernPitchEngine.cpp
          changed="$(git diff --name-only | sort)"
          expected=$'Source/ModernPitchEngine.cpp\nSource/ModernPitchEngine.h'
          test "$changed" = "$expected"
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          test "$(git hash-object Source/SingleWetSpectralRenderer.h)" = "2b68b3b3d5dc0579cdab94f4969203ef876ef058"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure clean-engine build
        run: cmake -S . -B build-family-v65 -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Build and run historical supervisor invariants
        run: |
          cmake --build build-family-v65 --config Release --parallel 2 --target SupervisorContinuityTest
          ./build-family-v65/clean-engine-tests/SupervisorContinuityTest

      - name: Measure extreme path and motion cases
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/SupervisorContinuityTest.original.cpp

          cp Tests/DetectorExtremeDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-family-v65 --config Release --parallel 2 --target SupervisorContinuityTest
          ./build-family-v65/clean-engine-tests/SupervisorContinuityTest | tee /tmp/extreme.log

          cp Tests/DetectorPathDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-family-v65 --config Release --parallel 2 --target SupervisorContinuityTest
          ./build-family-v65/clean-engine-tests/SupervisorContinuityTest | tee /tmp/path.log

          cp Tests/DetectorMotionDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-family-v65 --config Release --parallel 2 --target SupervisorContinuityTest
          ./build-family-v65/clean-engine-tests/SupervisorContinuityTest | tee /tmp/motion.log

          cp /tmp/SupervisorContinuityTest.original.cpp Tests/SupervisorContinuityTest.cpp

      - name: Check family geometry and anti-stall contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          rows = []
          for line in Path('/tmp/path.log').read_text().splitlines():
              if line.startswith('PATH_STRESS '):
                  rows.append(dict(re.findall(r'(\w+)=([^ ]+)', line)))

          def selected(hz, snr, profile):
              return [r for r in rows
                      if abs(float(r['hz']) - hz) < 0.01
                      and abs(float(r['snr']) - snr) < 0.01
                      and r['profile'] == profile]

          print('V65_PATH_SUMMARY')
          for hz, profile in [
              (110.0,'harmonic4'), (110.0,'legacy'), (110.0,'strong_second'),
              (220.0,'harmonic4'), (220.0,'legacy'),
              (440.0,'harmonic4'), (440.0,'legacy')]:
              group = selected(hz, 6.0, profile)
              vals = [round(int(r['out_correct']) / max(1, int(r['out_valid'])), 4)
                      for r in group]
              halves = [round(int(r['out_half']) / max(1, int(r['out_valid'])), 4)
                        for r in group]
              print(hz, profile, 'correct=', vals, 'half=', halves)

          motion = []
          for line in Path('/tmp/motion.log').read_text().splitlines():
              if line.startswith('MOTION_STEP '):
                  motion.append(dict(re.findall(r'(\w+)=([^ ]+)', line)))
          gated = [r for r in motion if abs(float(r['snr']) - 6.0) < 0.01]
          first = [float(r['first_correct_ms']) for r in gated]
          stable = [float(r['stable_correct_ms']) for r in gated]
          old = [float(r['max_old_lock_ms']) for r in gated]
          fractions = [float(r['correct_fraction']) for r in gated]
          print('V65_MOTION_FIRST_MS', first)
          print('V65_MOTION_STABLE_MS', stable)
          print('V65_MOTION_OLD_MS', old)
          print('V65_MOTION_CORRECT_FRACTIONS', fractions)

          errors = []

          for hz, profile in [
              (220.0, 'harmonic4'), (220.0, 'legacy'),
              (440.0, 'harmonic4'), (440.0, 'legacy'),
          ]:
              group = selected(hz, 6.0, profile)
              if len(group) != 4:
                  errors.append((hz, profile, 'count', len(group)))
                  continue
              vals = [int(r['out_correct']) / max(1, int(r['out_valid'])) for r in group]
              if sum(v >= 0.80 for v in vals) < 3:
                  errors.append((hz, profile, 'correct', vals))

          for profile in ['harmonic4', 'legacy', 'strong_second']:
              group = selected(110.0, 6.0, profile)
              if len(group) != 4:
                  errors.append((110.0, profile, 'count', len(group)))
                  continue
              vals = [int(r['out_correct']) / max(1, int(r['out_valid'])) for r in group]
              halves = [int(r['out_half']) / max(1, int(r['out_valid'])) for r in group]
              doubles = [int(r['out_double']) / max(1, int(r['out_valid'])) for r in group]
              if sum(v >= 0.80 for v in vals) < 3:
                  errors.append((110.0, profile, 'correct', vals))
              if max(halves) > 0.10:
                  errors.append((110.0, profile, 'half', halves))
              if max(doubles) > 0.10:
                  errors.append((110.0, profile, 'double', doubles))

          extreme = Path('/tmp/extreme.log').read_text()
          pure = next(line for line in extreme.splitlines()
                      if 'case=pure_colored_noise' in line)
          if 'valid=0' not in pure:
              errors.append(('pure_noise', pure))

          if len(gated) != 12:
              errors.append(('motion_count', len(gated)))
          else:
              if not all(0.0 <= x <= 90.0 for x in first):
                  errors.append(('motion_first', first))
              if not all(0.0 <= x <= 120.0 for x in stable):
                  errors.append(('motion_stable', stable))
              if max(old) > 10.0:
                  errors.append(('motion_old_lock', old))
              if sum(x >= 0.80 for x in fractions) < 10:
                  errors.append(('motion_fraction', fractions))

          if errors:
              print('V65_FAILURES')
              for error in errors:
                  print(error)
              raise AssertionError(errors)
          PY

      - name: Restore and run remaining invariants
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-family-v65 --config Release --parallel 2 \
            --target SupervisorContinuityTest SingleWetSpectralRendererTest \
            VoiceEvidenceAnalyzerTest CleanModernPitchEngineTest \
            GuiAudioControlContractTest GuiAudibilityTest
          ./build-family-v65/clean-engine-tests/SupervisorContinuityTest
          ./build-family-v65/clean-engine-tests/SingleWetSpectralRendererTest
          ./build-family-v65/clean-engine-tests/VoiceEvidenceAnalyzerTest
          ./build-family-v65/clean-engine-tests/CleanModernPitchEngineTest
          ./build-family-v65/clean-engine-tests/GuiAudioControlContractTest
          ./build-family-v65/clean-engine-tests/GuiAudibilityTest

      - name: Build VST3
        run: cmake --build build-family-v65 --config Release --target Neumaton_VST3 --parallel 2
