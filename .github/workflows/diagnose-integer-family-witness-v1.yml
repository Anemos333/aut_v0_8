name: Diagnose integer family witness v1
on:
  push:
    branches: [v1-continuous-f0-minimal-recomposition-v1]
    paths:
      - Tests/IntegerFamilyWitnessProbe.cpp
      - .github/workflows/diagnose-integer-family-witness-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: v1-continuous-f0-minimal-recomposition-v1 }
      - run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev >/dev/null
      - run: |
          cp Tests/IntegerFamilyWitnessProbe.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-int-family -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-int-family --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-int-family/clean-engine-tests/SupervisorContinuityTest | tee /tmp/int-family.log
          grep -q '^INTEGER_FAMILY_WITNESS ' /tmp/int-family.log
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,statistics
          rows=[]
          for line in Path('/tmp/int-family.log').read_text().splitlines():
              if not line.startswith('INTEGER_FAMILY_WITNESS '):continue
              d=dict(re.findall(r'(\w+)=([^ ]+)',line))
              for k in ['hz','snr','us']:d[k]=float(d[k])
              for k in ['alias','best_divisor','correct','available']:d[k]=int(d[k])
              rows.append(d)
          for kind in ['normal','strong_second','missing_fundamental']:
              for alias in [1,2,3,4]:
                  sub=[r for r in rows if r['kind']==kind and r['alias']==alias and r['available']]
                  print('INTEGER_FAMILY_SUMMARY'
                        f' kind={kind} alias={alias} n={len(sub)}'
                        f' correct_fraction={(sum(r["correct"] for r in sub)/len(sub) if sub else 0):.6f}'
                        f' median_us={(statistics.median(r["us"] for r in sub) if sub else -1):.6f}')
          PY
