name: Materialize One Voice Breath Glide V11

on:
  push:
    branches:
      - one-voice-breath-glide-v11
    paths:
      - .github/workflows/materialize-one-voice-breath-glide-v11.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded V11 source transforms
        run: |
          python3 Tests/OneVoiceBreathGlideV11Patch.py
          python3 Tests/OneVoiceBreathGlideV11CompileFix.py
          python3 Tests/OneVoiceBreathGlideV11SelfShift.py

      - name: Verify source contract and untouched formant subsystem
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'state.desiredCents = 0.0' Source/ModernPitchEngine.cpp
          ! grep -q 'setState(TrackingState::release)' Source/ModernPitchEngine.cpp
          grep -q 'return state.currentCents; // ONE_VOICE_BREATH_GLIDE_V11' Source/ModernPitchEngine.cpp
          ! grep -q 'maximumMagnitude \* 0.018f' Source/SingleWetSpectralRenderer.cpp
          ! grep -q 'harmonicGuideValid' Source/SingleWetSpectralRenderer.cpp
          ! grep -q 'sourceHarmonicForMagnitude' Source/SingleWetSpectralRenderer.cpp
          ! grep -q 'sameExperimentalHarmonicFamily' Source/SingleWetSpectralRenderer.cpp
          grep -q '(void) sourceFundamentalHz;' Source/SingleWetSpectralRenderer.cpp
          grep -q 'ONE_VOICE_LIVE_SELF_COORDINATE_SHIFT_V11_1' Source/SingleWetSpectralRenderer.cpp
          grep -q 'lookupFormantGain(envelopeRatio, safeFormant)' Source/SingleWetSpectralRenderer.cpp
          grep -q 'calculateEnvelope(positiveBins);' Source/SingleWetSpectralRenderer.cpp
          echo ONE_VOICE_BREATH_GLIDE_V11_SOURCE_CONTRACT=PASS

      - name: Run focused renderer probe
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic \
            Tests/OneVoiceBreathGlideV11Probe.cpp Source/SingleWetSpectralRenderer.cpp \
            -o /tmp/v11-probe
          /tmp/v11-probe

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure and compile full clean-engine test targets
        run: |
          cmake -S . -B build-v11 \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON
          cmake --build build-v11 --config Release \
            --target CleanModernPitchEngineTest SupervisorContinuityTest SingleWetSpectralRendererTest \
            --parallel 2

      - name: Commit materialized source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/ModernPitchEngine.cpp Source/SingleWetSpectralRenderer.cpp
          if git diff --cached --quiet; then
            echo 'Source already materialized.'
            exit 0
          fi
          git commit -m 'Materialize one-voice breath glide V11'
          git push origin HEAD:one-voice-breath-glide-v11
