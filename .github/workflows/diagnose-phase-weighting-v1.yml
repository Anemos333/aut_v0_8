name: Diagnose phase weighting v1
on:
  push:
    branches: [v1-continuous-f0-contract-v1]
    paths:
      - Tests/PhaseWeightingDiagnostic.cpp
      - .github/workflows/diagnose-phase-weighting-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: v1-continuous-f0-contract-v1 }
      - run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev >/dev/null
      - run: |
          cp Tests/PhaseWeightingDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-phase-weighting -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-phase-weighting --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-phase-weighting/clean-engine-tests/SupervisorContinuityTest | tee /tmp/phase-weighting.log
          grep -q '^PHASE_WEIGHTING ' /tmp/phase-weighting.log
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, statistics
          rows=[]
          for line in Path('/tmp/phase-weighting.log').read_text().splitlines():
              if not line.startswith('PHASE_WEIGHTING '): continue
              d=dict(re.findall(r'(\w+)=([^ ]+)',line))
              for k in ['source_error','residual_error']: d[k]=float(d[k])
              for k in ['source_pass','residual_pass']: d[k]=int(d[k])
              rows.append(d)
          for mode in sorted({r['mode'] for r in rows}):
              for signal in ['source','residual']:
                  sub=[r for r in rows if r['mode']==mode]
                  errs=[abs(r[f'{signal}_error']) for r in sub]
                  print('PHASE_WEIGHTING_SUMMARY'
                        f' mode={mode}'
                        f' signal={signal}'
                        f' cases={len(sub)}'
                        f' pass_1p5_fraction={sum(r[f"{signal}_pass"] for r in sub)/len(sub):.6f}'
                        f' median_abs_cents={statistics.median(errs):.6f}'
                        f' worst_abs_cents={max(errs):.6f}')
          PY
