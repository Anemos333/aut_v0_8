name: Voice body adaptive path authority v6.7

on:
  push:
    branches:
      - voice-aware-f0-detector-v1
    paths:
      - Tests/RefineVoiceBodyAdaptiveAuthorityV6_7.py
      - Tests/DetectorAdaptiveAuthorityDiagnostic.cpp
      - .github/workflows/voice-body-adaptive-authority-v6-7.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-voice-body-adaptive-authority:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout detector branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard frozen architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          test "$(git hash-object Source/SingleWetSpectralRenderer.h)" = "2b68b3b3d5dc0579cdab94f4969203ef876ef058"
          grep -q 'DIRECT_COORDINATE_OWNS_F0_V1' Source/ModernPitchEngine.cpp
          grep -q 'DETECTOR_VETO_NOT_PERMISSION_V1' Source/ModernPitchEngine.cpp
          grep -q 'HOLD_DOES_NOT_CREATE_NOTE_IDENTITY_V2' Source/ModernPitchEngine.cpp
          ! grep -q 'VOICE_BODY_ADAPTIVE_PATH_AUTHORITY_V6_7' Source/ModernPitchEngine.cpp

      - name: Materialize V6.6 plus V6.1 plus V6.7 in workspace only
        run: |
          python3 Tests/RefinePrimitiveDivisorGeometryV6_6.py
          python3 Tests/RefinePrimitivePeriodPathGeometryV1.py
          python3 Tests/RefineVoiceBodyAdaptiveAuthorityV6_7.py

      - name: Verify V6.7 scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PRIMITIVE_DIVISOR_GEOMETRY_V6_6' Source/ModernPitchEngine.cpp
          grep -q 'AUTHORITATIVE_DIRECT_FAST_PATH_V6' Source/ModernPitchEngine.cpp
          grep -q 'VOICE_BODY_ADAPTIVE_PATH_AUTHORITY_V6_7' Source/ModernPitchEngine.cpp
          grep -q 'VOICE_BODY_ADAPTIVE_PATH_AUTHORITY_V6_7' Source/ModernPitchEngine.h
          grep -q 'lowerFamilyEvidence' Source/VoiceEvidenceAnalyzer.h
          grep -q 'voiceLowerFamilyEvidence' Source/LivePitchProcessor.h
          ! grep -q 'CENT_FAMILY_AUTHORITY_GATE_V6_4' Source/ModernPitchEngine.cpp
          ! grep -q 'PATH_LOCAL_FAMILY_PERSISTENCE_V6_5' Source/ModernPitchEngine.cpp
          ! grep -q 'PENDING_FAMILY_IS_EVIDENCE_NOT_COORDINATE_V6_5_1' Source/ModernPitchEngine.cpp
          ! grep -q 'ADAPTIVE_OBSERVABILITY_PERIOD_GATE_V6_3' Source/ModernPitchEngine.cpp
          ! grep -q 'QUALIFIED_FIRST_MINIMUM_OWNS_PATH_V6_2' Source/ModernPitchEngine.cpp
          changed="$(git diff --name-only | sort)"
          expected=$'Source/LivePitchProcessor.h\nSource/ModernPitchEngine.cpp\nSource/ModernPitchEngine.h\nSource/VoiceEvidenceAnalyzer.h'
          test "$changed" = "$expected"
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          test "$(git hash-object Source/SingleWetSpectralRenderer.h)" = "2b68b3b3d5dc0579cdab94f4969203ef876ef058"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure clean-engine build
        run: cmake -S . -B build-v67 -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Run historical supervisor invariants
        run: |
          cmake --build build-v67 --config Release --parallel 2 --target SupervisorContinuityTest
          ./build-v67/clean-engine-tests/SupervisorContinuityTest

      - name: Run causal body-authority diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/SupervisorContinuityTest.original.cpp
          cp Tests/DetectorAdaptiveAuthorityDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-v67 --config Release --parallel 2 --target SupervisorContinuityTest
          /usr/bin/time -f 'V67_WALL_SECONDS=%e' ./build-v67/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/v67.log
          cp /tmp/SupervisorContinuityTest.original.cpp Tests/SupervisorContinuityTest.cpp

      - name: Report and gate V6.7 behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          rows=[]
          for line in Path('/tmp/v67.log').read_text().splitlines():
              if line.startswith('V67_AUTH '):
                  rows.append(dict(re.findall(r'(\w+)=([^ ]+)', line)))

          def group(name):
              return [r for r in rows if r['case']==name]

          errors=[]
          for name in [
              'stable440_legacy','down440_220_legacy','stable220_legacy',
              'up220_440_legacy','down220_110_strong2',
              'stable440_harmonic4_snr3','pure_noise']:
              g=group(name)
              print('V67_GROUP',name,g)

          stable440=group('stable440_legacy')
          if len(stable440)!=4:
              errors.append(('stable440_count',len(stable440)))
          else:
              correct=[float(r['correct_fraction']) for r in stable440]
              half=[float(r['half_fraction']) for r in stable440]
              if sum(x>=0.96 for x in correct)<3:
                  errors.append(('stable440_correct',correct))
              if sum(x<=0.04 for x in half)<3:
                  errors.append(('stable440_half',half))

          stable220=group('stable220_legacy')
          if len(stable220)!=2 or any(float(r['correct_fraction'])<0.95 for r in stable220):
              errors.append(('stable220',[(r.get('correct_fraction'),r.get('half_fraction')) for r in stable220]))

          down=group('down440_220_legacy')
          if len(down)!=4:
              errors.append(('down_count',len(down)))
          else:
              first=[float(r['first_correct_ms']) for r in down]
              correct=[float(r['correct_fraction']) for r in down]
              if not all(0.0<=x<=100.0 for x in first):
                  errors.append(('down_first',first))
              if sum(x>=0.75 for x in correct)<3:
                  errors.append(('down_correct',correct))

          up=group('up220_440_legacy')
          if len(up)!=2 or any(not (0.0<=float(r['first_correct_ms'])<=80.0) for r in up):
              errors.append(('up_transition',[r.get('first_correct_ms') for r in up]))

          strong=group('down220_110_strong2')
          if len(strong)!=2 or any(not (0.0<=float(r['first_correct_ms'])<=110.0) for r in strong):
              errors.append(('strong_second_down',[r.get('first_correct_ms') for r in strong]))

          noise=group('pure_noise')
          if len(noise)!=1 or int(noise[0]['valid_after'])!=0:
              errors.append(('pure_noise',noise))

          timing=[line for line in Path('/tmp/v67.log').read_text().splitlines()
                  if line.startswith('V67_WALL_SECONDS=')]
          print('V67_TIMING',timing)

          if errors:
              print('V67_FAILURES')
              for error in errors:
                  print(error)
              raise AssertionError(errors)
          PY

      - name: Restore and run detector and renderer invariants
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-v67 --config Release --parallel 2 \
            --target SupervisorContinuityTest SingleWetSpectralRendererTest \
            VoiceEvidenceAnalyzerTest CleanModernPitchEngineTest
          ./build-v67/clean-engine-tests/SupervisorContinuityTest
          ./build-v67/clean-engine-tests/SingleWetSpectralRendererTest
          ./build-v67/clean-engine-tests/VoiceEvidenceAnalyzerTest
          ./build-v67/clean-engine-tests/CleanModernPitchEngineTest

      - name: Build VST3
        run: cmake --build build-v67 --config Release --target Neumaton_VST3 --parallel 2
