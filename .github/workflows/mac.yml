name: Build macOS Universal (VST3 + AU)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-mac:
    # macos-14 was retired from GitHub Actions; the macos-15 runner is Apple Silicon.
    # Xcode produces universal bundles so the release also runs on Intel Macs.
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        # JUCE is fetched by CMake FetchContent. Do not recurse into stale
        # build-directory gitlinks that are not repository submodules.

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          clang --version

      - name: Configure universal macOS VST3 and AU
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DJUCE_BUILD_EXTRAS=OFF \
            -DJUCE_BUILD_EXAMPLES=OFF

      - name: Verify universal build configuration
        run: |
          grep -F 'arm64;x86_64' build/CMakeCache.txt

      - name: Build both plugin formats
        run: |
          cmake --build build --config Release --parallel 4

      - name: Verify Scale Database V1
        run: |
          clang++ -std=c++17 -O2 -ISource \
            Tests/ScaleDatabaseV1Test.cpp \
            Source/ScaleDefinitions.cpp \
            Source/PitchCore.cpp \
            -o /tmp/scale_database_v1_test
          /tmp/scale_database_v1_test

      - name: Verify Scale Editor Geometry
        run: |
          clang++ -std=c++17 -O2 -ISource \
            Tests/ScaleEditorGeometryTest.cpp \
            -o /tmp/scale_editor_geometry_test
          /tmp/scale_editor_geometry_test

      - name: Verify Community Pack V1
        run: |
          clang++ -std=c++17 -O2 \
            Tests/CommunityPackV1ContractTest.cpp \
            -o /tmp/community_pack_v1_test
          /tmp/community_pack_v1_test

      - name: Verify Intel and Apple Silicon slices in both plugins
        shell: bash
        run: |
          set -euo pipefail
          VST3_BIN=$(find build -path '*/VST3/*.vst3/Contents/MacOS/*' -type f -print -quit)
          AU_BIN=$(find build -path '*/AU/*.component/Contents/MacOS/*' -type f -print -quit)
          test -n "$VST3_BIN" && test -n "$AU_BIN"
          for bin in "$VST3_BIN" "$AU_BIN"; do
            echo "Checking $bin"
            file "$bin"
            lipo -info "$bin"
            lipo "$bin" -verify_arch arm64 x86_64
          done

      - name: Ad-hoc sign and verify both plugins
        shell: bash
        run: |
          set -euo pipefail
          VST3_BIN=$(find build -path '*/VST3/*.vst3/Contents/MacOS/*' -type f -print -quit)
          AU_BIN=$(find build -path '*/AU/*.component/Contents/MacOS/*' -type f -print -quit)
          VST3_DIR=${VST3_BIN%/Contents/MacOS/*}
          AU_DIR=${AU_BIN%/Contents/MacOS/*}
          test -d "$VST3_DIR" && test -d "$AU_DIR"
          for bundle in "$VST3_DIR" "$AU_DIR"; do
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

      - name: Package universal VST3 and AU
        shell: bash
        run: |
          set -euo pipefail
          VST3_BIN=$(find build -path '*/VST3/*.vst3/Contents/MacOS/*' -type f -print -quit)
          AU_BIN=$(find build -path '*/AU/*.component/Contents/MacOS/*' -type f -print -quit)
          VST3_DIR=${VST3_BIN%/Contents/MacOS/*}
          AU_DIR=${AU_BIN%/Contents/MacOS/*}
          test -d "$VST3_DIR" && test -d "$AU_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$VST3_DIR" Neumaton_macOS_Universal_VST3.zip
          ditto -c -k --sequesterRsrc --keepParent "$AU_DIR" Neumaton_macOS_Universal_AU.zip
          test -s Neumaton_macOS_Universal_VST3.zip
          test -s Neumaton_macOS_Universal_AU.zip

      - name: Upload universal VST3
        uses: actions/upload-artifact@v4
        with:
          name: Neumaton-macOS-universal-VST3
          path: Neumaton_macOS_Universal_VST3.zip
          if-no-files-found: error

      - name: Upload universal AU
        uses: actions/upload-artifact@v4
        with:
          name: Neumaton-macOS-universal-AU
          path: Neumaton_macOS_Universal_AU.zip
          if-no-files-found: error
