name: Build VST3 macOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-mac:
    runs-on: macos-14

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mostra ambiente di build
        run: |
          sw_vers
          xcodebuild -version
          clang --version

      - name: Configura CMake (Universal Binary)
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DJUCE_BUILD_EXTRAS=OFF

      - name: Verifica configurazione
        run: |
          grep CMAKE_OSX_ARCHITECTURES build/CMakeCache.txt || true

      - name: Compila il Plugin
        run: |
          cmake --build build --config Release --parallel 4

      - name: Verifica architetture del plugin
        run: |
          BIN=$(find build -path "*VST3/*.vst3/Contents/MacOS/*" -type f | head -n 1)
          test -n "$BIN"

          echo "Plugin binary:"
          echo "$BIN"

          file "$BIN"
          lipo -info "$BIN"

      - name: Applica firma Ad-Hoc (Codisign locale)
        run: |
          BIN=$(find build -path "*VST3/*.vst3/Contents/MacOS/*" -type f | head -n 1)
          test -n "$BIN"
          echo "Il binario si trova in: $BIN"

          VST3_DIR=$(echo "$BIN" | sed 's/\/Contents\/MacOS\/.*//')
          test -d "$VST3_DIR"
          echo "La cartella VST3 da firmare è: $VST3_DIR"

          codesign --force --deep --sign - "$VST3_DIR"
          codesign --verify --deep --strict --verbose=2 "$VST3_DIR"

      - name: Crea archivio ZIP
        run: |
          BIN=$(find build -path "*VST3/*.vst3/Contents/MacOS/*" -type f | head -n 1)
          test -n "$BIN"
          VST3_DIR=$(echo "$BIN" | sed 's/\/Contents\/MacOS\/.*//')
          test -d "$VST3_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$VST3_DIR" MicrotonalAutotune_Mac_VST3.zip
          test -s MicrotonalAutotune_Mac_VST3.zip

      - name: Carica artefatto
        uses: actions/upload-artifact@v4
        with:
          name: MicrotonalAutotune-macOS-VST3
          path: MicrotonalAutotune_Mac_VST3.zip
          if-no-files-found: error

      - name: Upload AU Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicrotonalAutotune-Mac-AU
          path: build/**/*component
          if-no-files-found: warn
