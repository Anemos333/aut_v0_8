name: Graft proven detector into clean engine

on:
  push:
    branches:
      - modern-pitch-engine-clean-rewrite

permissions:
  contents: write

jobs:
  graft:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modern-pitch-engine-clean-rewrite
          fetch-depth: 0

      - name: Extract only the proven detector from main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:Source/ModernPitchEngine.h > /tmp/legacy.h
          git show origin/main:Source/ModernPitchEngine.cpp > /tmp/legacy.cpp
          python3 - <<'PY'
          from pathlib import Path

          header = Path('Source/ModernPitchEngine.h').read_text()
          cpp = Path('Source/ModernPitchEngine.cpp').read_text()
          legacy_h = Path('/tmp/legacy.h').read_text()
          legacy_cpp = Path('/tmp/legacy.cpp').read_text()

          def between(text, start, end):
              a = text.index(start)
              b = text.index(end, a)
              return text[a:b]

          # Header: copy BiquadLowPass + MultiRatePitchTracker only. Stop before
          # the legacy quantizer/controller/output classes.
          proven_detector_h = between(
              legacy_h,
              '    class BiquadLowPass',
              '    class ScaleQuantizer')
          new_detector_start = header.index('    class PitchTracker')
          new_detector_end = header.index('    class ScaleQuantizer', new_detector_start)
          header = (header[:new_detector_start]
                    + proven_detector_h
                    + header[new_detector_end:])
          header = header.replace('PitchTracker linkedTracker_;',
                                  'MultiRatePitchTracker linkedTracker_;')
          header = header.replace('std::array<PitchTracker, maxSupportedChannels> channelTrackers_ {};',
                                  'std::array<MultiRatePitchTracker, maxSupportedChannels> channelTrackers_ {};')

          # CPP: copy only filter + detector implementation. Stop before the
          # legacy ScaleQuantizer and every output/controller implementation.
          proven_detector_cpp = between(
              legacy_cpp,
              '//==============================================================================\n// BiquadLowPass',
              '//==============================================================================\n// ScaleQuantizer')
          new_detector_start = cpp.index('//==============================================================================\n// PitchTracker')
          new_detector_end = cpp.index('//==============================================================================\n// ScaleQuantizer',
                                       new_detector_start)
          cpp = (cpp[:new_detector_start]
                 + proven_detector_cpp
                 + cpp[new_detector_end:])

          cpp = cpp.replace('#include <limits>\n',
                            '#include <limits>\n#include <cstring>\n')
          cpp = cpp.replace('constexpr float audioFloor = 1.0e-12f;\n',
              '''constexpr float audioFloor = 1.0e-12f;
          constexpr float minimumDetectorRms = 0.0012f;

          [[nodiscard]] float sanitiseAudioSample(float value) noexcept
          {
              if (!std::isfinite(value) || std::fpclassify(value) == FP_SUBNORMAL)
                  return 0.0f;
              return std::clamp(value, -32.0f, 32.0f);
          }

          [[nodiscard]] float finiteOr(float value, float fallback) noexcept
          {
              return std::isfinite(value) ? value : fallback;
          }

          [[nodiscard]] double finiteOr(double value, double fallback) noexcept
          {
              return std::isfinite(value) ? value : fallback;
          }
          ''')

          cpp = cpp.replace('linkedTracker_.prepare(sampleRate_, latencyMode_);',
                            'linkedTracker_.prepare(sampleRate_);')
          cpp = cpp.replace(
              '''channelTrackers_[static_cast<std::size_t>(channel)].prepare(
                      sampleRate_, latencyMode_);''',
              '''channelTrackers_[static_cast<std::size_t>(channel)].prepare(
                      sampleRate_);''')

          old_linked = '''if (linkedTracker_.push(linkedSample,
                                      parameters.minimumPitchHz,
                                      parameters.maximumPitchHz,
                                      parameters.detectorSensitivity,
                                      observation))'''
          if old_linked not in cpp:
              raise SystemExit('linked provisional tracker call not found')
          cpp = cpp.replace(old_linked,
                            'if (linkedTracker_.processSample(linkedSample, observation))')

          old_channel = '''if (channelTrackers_[static_cast<std::size_t>(channel)].push(
                              input,
                              parameters.minimumPitchHz,
                              parameters.maximumPitchHz,
                              parameters.detectorSensitivity,
                              channelObservation))'''
          if old_channel not in cpp:
              raise SystemExit('channel provisional tracker call not found')
          cpp = cpp.replace(
              old_channel,
              '''if (channelTrackers_[static_cast<std::size_t>(channel)].processSample(
                              input,
                              channelObservation))''')

          anchor = '''    const bool dualMono = parameters.stereoMode == StereoMode::dualMono
              && channels > 1;

          '''
          setup = '''    const bool dualMono = parameters.stereoMode == StereoMode::dualMono
              && channels > 1;

              linkedTracker_.setRange(parameters.minimumPitchHz,
                                      parameters.maximumPitchHz);
              linkedTracker_.setSensitivity(parameters.detectorSensitivity);
              for (int channel = 0; channel < channels; ++channel)
              {
                  auto& tracker = channelTrackers_[static_cast<std::size_t>(channel)];
                  tracker.setRange(parameters.minimumPitchHz,
                                   parameters.maximumPitchHz);
                  tracker.setSensitivity(parameters.detectorSensitivity);
              }

          '''
          if anchor not in cpp:
              raise SystemExit('dual-mono setup anchor not found')
          cpp = cpp.replace(anchor, setup, 1)

          Path('Source/ModernPitchEngine.h').write_text(header)
          Path('Source/ModernPitchEngine.cpp').write_text(cpp)

          # Structural assertions: only the detector came back from main.
          combined = header + cpp
          forbidden = [
              'SynthesisLayer', 'TransitionManager', 'wetMix_', 'dryTrust_',
              'NeumatonOutputRenderer', 'NeumatonRidgeLedger',
              'NEUMATON_OUTPUT_V3', 'SpectralVoiceShifter',
              'CorrectionController'
          ]
          for term in forbidden:
              if term in combined:
                  raise SystemExit(f'forbidden legacy symbol returned: {term}')
          if 'MultiRatePitchTracker' not in combined:
              raise SystemExit('proven detector was not grafted')
          PY

      - name: Commit detector-only graft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/ModernPitchEngine.h Source/ModernPitchEngine.cpp
          git commit -m "Reuse proven multi-rate detector in clean engine"
          git push origin HEAD:modern-pitch-engine-clean-rewrite
