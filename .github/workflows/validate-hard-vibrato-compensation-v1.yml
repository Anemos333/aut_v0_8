name: Validate hard-tune stable micro-motion v1

on:
  push:
    branches:
      - post-detector-hard-vibrato-compensation-v1
    paths:
      - Source/ModernPitchEngine.cpp
      - Tests/HardTuneStableMicroMotionTest.cpp
      - .github/workflows/validate-hard-vibrato-compensation-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: post-detector-hard-vibrato-compensation-v1
          fetch-depth: 0

      - name: Guard detector and renderer boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Source/ModernPitchEngine.h)" = "d80656577030527018b909bea0d22ec41a89399a"
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          test "$(git hash-object Source/SingleWetSpectralRenderer.h)" = "2b68b3b3d5dc0579cdab94f4969203ef876ef058"
          grep -q 'PARKED_LOW_RATE_WORKER_V1' Source/ModernPitchEngine.cpp
          grep -q 'HARD_TUNE_STABLE_MICROMOTION_COMPENSATION_V1' Source/ModernPitchEngine.cpp
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          anchor = 'void ModernPitchEngine::updateCorrectionState('
          current = Path('Source/ModernPitchEngine.cpp').read_text()
          golden = subprocess.check_output(
              ['git','show','c711b7e2c90456919bf6069fe192cb0148aadcbf:Source/ModernPitchEngine.cpp'],
              text=True)
          if anchor not in current or anchor not in golden:
              raise SystemExit('updateCorrectionState anchor missing')
          if current.split(anchor,1)[0] != golden.split(anchor,1)[0]:
              raise SystemExit('detector/controller prefix changed before updateCorrectionState')
          print('POST_DETECTOR_PREFIX_GUARD=PASS')
          PY
          echo 'HARD_VIBRATO_SCOPE_GUARD=PASS'

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Configure candidate build
        run: cmake -S . -B build-hard-vibrato -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Preserve supervisor source
        run: cp Tests/SupervisorContinuityTest.cpp /tmp/hard-vibrato-supervisor.original.cpp

      - name: Verify detector oracle three times
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/GoldenDetectorDeterminismTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-hard-vibrato --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          for run in 1 2 3; do
            ./build-hard-vibrato/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee "/tmp/hard-vibrato-detector-$run.log"
            grep -q '^GOLDEN_DETECTOR_BITWISE_DETERMINISM=PASS observations=12000$' "/tmp/hard-vibrato-detector-$run.log"
            grep -q '^GOLDEN_DETECTOR_TRACE_HASH=58273352d40c5499$' "/tmp/hard-vibrato-detector-$run.log"
          done
          echo 'HARD_VIBRATO_DETECTOR_UNCHANGED=PASS'

      - name: Verify hard-tune micro-motion contract
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/HardTuneStableMicroMotionTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-hard-vibrato --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-hard-vibrato/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/hard-vibrato-contract.log
          grep -q '^HARD_VIBRATO_COMPENSATION=PASS ' /tmp/hard-vibrato-contract.log

      - name: Verify existing authority and renderer contracts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/hard-vibrato-supervisor.original.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-hard-vibrato --config Release --parallel 2 \
            --target SupervisorContinuityTest CleanModernPitchEngineTest SingleWetSpectralRendererTest >/dev/null
          ./build-hard-vibrato/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/hard-vibrato-supervisor.log
          ./build-hard-vibrato/clean-engine-tests/CleanModernPitchEngineTest 2>&1 | tee /tmp/hard-vibrato-engine.log
          ./build-hard-vibrato/clean-engine-tests/SingleWetSpectralRendererTest 2>&1 | tee /tmp/hard-vibrato-renderer.log
          ! grep -q '=FAIL' /tmp/hard-vibrato-supervisor.log
          ! grep -q '=FAIL' /tmp/hard-vibrato-engine.log
          ! grep -q '=FAIL' /tmp/hard-vibrato-renderer.log
          grep -q 'transition_detector_wobble_cannot_move_destination=PASS' /tmp/hard-vibrato-supervisor.log
          grep -q 'periodic_reentry_has_no_click=PASS' /tmp/hard-vibrato-renderer.log
          echo 'HARD_VIBRATO_EXISTING_CONTRACTS=PASS'

      - name: Build candidate corpus runner
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/GoldenEngineBehaviorCorpusTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-hard-vibrato --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          cp build-hard-vibrato/clean-engine-tests/SupervisorContinuityTest /tmp/hard-vibrato-candidate-corpus

      - name: Build promoted golden corpus runner
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/neumaton-hard-vibrato-golden c711b7e2c90456919bf6069fe192cb0148aadcbf
          cd /tmp/neumaton-hard-vibrato-golden
          cp Tests/GoldenEngineBehaviorCorpusTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-corpus -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-corpus --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          cp build-corpus/clean-engine-tests/SupervisorContinuityTest /tmp/hard-vibrato-golden-corpus

      - name: Compare corpus scenarios
        shell: bash
        run: |
          set -euo pipefail
          /tmp/hard-vibrato-golden-corpus 2>&1 | tee /tmp/hard-vibrato-golden-corpus.log
          /tmp/hard-vibrato-candidate-corpus 2>&1 | tee /tmp/hard-vibrato-candidate-corpus.log
          grep -q '^GOLDEN_ENGINE_BEHAVIOR_CORPUS=PASS scenarios=14$' /tmp/hard-vibrato-golden-corpus.log
          grep -q '^GOLDEN_ENGINE_BEHAVIOR_CORPUS=PASS scenarios=14$' /tmp/hard-vibrato-candidate-corpus.log
          python3 - <<'PY' | tee /tmp/hard-vibrato-corpus-diff.log
          from pathlib import Path
          import re

          def scenarios(path):
              out = {}
              for line in Path(path).read_text().splitlines():
                  if not line.startswith('GOLDEN_ENGINE_SCENARIO_HASH '):
                      continue
                  fields = dict(re.findall(r'(\w+)=([^ ]+)', line))
                  out[(fields['name'], fields['block'])] = fields['hash']
              return out

          golden = scenarios('/tmp/hard-vibrato-golden-corpus.log')
          candidate = scenarios('/tmp/hard-vibrato-candidate-corpus.log')
          if golden.keys() != candidate.keys():
              raise SystemExit('corpus scenario set changed')

          changed = []
          for key in sorted(golden):
              if golden[key] != candidate[key]:
                  changed.append((key, golden[key], candidate[key]))

          print(f'HARD_VIBRATO_CORPUS_CHANGED_SCENARIOS={len(changed)}')
          for (name, block), before, after in changed:
              print('HARD_VIBRATO_CORPUS_CHANGE',
                    f'name={name}', f'block={block}',
                    f'golden={before}', f'candidate={after}')
          PY
          cat /tmp/hard-vibrato-corpus-diff.log >> "$GITHUB_STEP_SUMMARY"

      - name: Restore supervisor source
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/hard-vibrato-supervisor.original.cpp ]; then
            cp /tmp/hard-vibrato-supervisor.original.cpp Tests/SupervisorContinuityTest.cpp
          fi

      - name: Final marker
        run: echo 'HARD_TUNE_STABLE_MICROMOTION_VALIDATION=PASS_NO_PROMOTION'
