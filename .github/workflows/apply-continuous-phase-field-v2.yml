name: Apply Continuous Phase Field V2

on:
  push:
    branches: [timbre-continuous-phase-field-v2]
    paths:
      - 'Tests/ContinuousPhaseFieldV2Patch.py'
      - '.github/workflows/apply-continuous-phase-field-v2.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply guarded patch
        run: python3 Tests/ContinuousPhaseFieldV2Patch.py
      - name: Verify patch
        run: |
          git diff --check
          grep -q 'CONTINUOUS_PHASE_FIELD_V2' Source/SingleWetSpectralRenderer.cpp
          ! grep -q 'const bool usePeakPhase' Source/SingleWetSpectralRenderer.cpp
          grep -q 'renderer_phase_field_is_continuous_not_binary' Tests/GuiAudioControlContractTest.cpp
      - name: Materialize source and contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/SingleWetSpectralRenderer.cpp Tests/GuiAudioControlContractTest.cpp
          if git diff --cached --quiet; then
            echo 'No materialization change required'
          else
            git commit -m 'Materialize continuous phase field V2 contract'
            git push
          fi
