name: Probe F0 transition discipline
on:
  push:
    branches: [v1-f0-demolish-and-rebuild-v1]
    paths:
      - Tests/F0TransitionDisciplineProbe.cpp
      - Tests/F0WholeNoteProgressiveProbe.cpp
      - Tests/F0WholeNoteTunerProbe.cpp
      - Source/F0PeriodicGateV1.h
      - .github/workflows/probe-f0-transition-discipline-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-f0-demolish-and-rebuild-v1
      - name: Build transition discipline probe
        run: |
          sed -i '0,/^int main()$/{s/^int main()$/int progressive_probe_reference_main()/}' \
              Tests/F0WholeNoteProgressiveProbe.cpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Tests/F0TransitionDisciplineProbe.cpp')
          s = p.read_text()
          s = s.replace(
              '#define F0_WHOLE_NOTE_TUNER_NO_MAIN\n#define main progressive_probe_reference_main\n#include "F0WholeNoteProgressiveProbe.cpp"\n#undef main\n#undef F0_WHOLE_NOTE_TUNER_NO_MAIN',
              '#include "F0WholeNoteProgressiveProbe.cpp"')
          s = s.replace('neumaton::f0v1::PeriodicMeasurementGate', 'F0PeriodicGateV1')
          p.write_text(s)
          PY
          g++ -std=c++17 -O3 -Wall -Wextra -Wpedantic \
              Tests/F0TransitionDisciplineProbe.cpp \
              -o /tmp/f0-transition-discipline
      - name: Run diagnostic
        run: |
          /tmp/f0-transition-discipline | tee /tmp/f0-transition-discipline.log
          grep '^TRANSITION_NORMAL_SUMMARY' /tmp/f0-transition-discipline.log
          grep '^TRANSIENT_DISCIPLINE_SUMMARY' /tmp/f0-transition-discipline.log
          grep '^HARD_TRANSITION_SUMMARY' /tmp/f0-transition-discipline.log
          grep '^F0_.*_READY=' /tmp/f0-transition-discipline.log
