name: Validate lazy Hann memoization v1

on:
  push:
    branches:
      - voice-aware-f0-parallel-golden-v1
    paths:
      - Tests/ApplyResidualHannLazyMemoization.py
      - .github/workflows/validate-lazy-hann-memoization-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: voice-aware-f0-parallel-golden-v1
          fetch-depth: 0

      - name: Guard validated tail baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Source/ModernPitchEngine.cpp)" = "e94ff49957b5ff82fdad5502d9dbe49358b212bd"
          test "$(git hash-object Source/ModernPitchEngine.h)" = "3112845dc8210da85ebe38e01cf3f0387fc59428"
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          grep -q 'TAU_EVIDENCE_MEMOIZATION_V1' Source/ModernPitchEngine.cpp
          grep -q 'RESIDUAL_LINE_EXACT_MEMOIZATION_V1' Source/ModernPitchEngine.cpp
          grep -q 'TERMINAL_TAIL_STABLE_TRANSPORT_REBASE_V1' Source/ModernPitchEngine.cpp
          ! grep -q 'RESIDUAL_HANN_LAZY_MEMOIZATION_V1' Source/ModernPitchEngine.cpp
          ! grep -q 'LAG_CORRELATION_MEMOIZATION_V1' Source/ModernPitchEngine.cpp
          ! grep -q 'RESIDUAL_LINE_INVARIANT_HOIST_V1' Source/ModernPitchEngine.cpp

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Materialize current validated baseline
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/neumaton-hann-baseline 6d7e3caa7e0da35a5398294cf78faa5b4f047cc6
          cp Tests/CpuHotspotBenchmark.cpp /tmp/neumaton-hann-baseline/Tests/CpuHotspotBenchmark.cpp

      - name: Apply lazy Hann candidate only
        shell: bash
        run: |
          set -euo pipefail
          python3 Tests/ApplyResidualHannLazyMemoization.py
          changed="$(git diff --name-only)"
          test "$changed" = $'Source/ModernPitchEngine.cpp\nSource/ModernPitchEngine.h'
          grep -q 'RESIDUAL_HANN_LAZY_MEMOIZATION_V1' Source/ModernPitchEngine.cpp
          grep -q 'RESIDUAL_HANN_LAZY_MEMOIZATION_V1' Source/ModernPitchEngine.h
          ! grep -q 'RESIDUAL_LINE_INVARIANT_HOIST_V1' Source/ModernPitchEngine.cpp
          ! grep -q 'LAG_CORRELATION_MEMOIZATION_V1' Source/ModernPitchEngine.cpp
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"

      - name: Verify detector oracle exact
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/supervisor-original.cpp
          cp Tests/GoldenDetectorDeterminismTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-detector -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-detector --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          for run in 1 2 3; do
            ./build-detector/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee "/tmp/detector-$run.log"
            grep -q '^GOLDEN_DETECTOR_BITWISE_DETERMINISM=PASS observations=12000$' "/tmp/detector-$run.log"
            grep -q '^GOLDEN_DETECTOR_TRACE_HASH=58273352d40c5499$' "/tmp/detector-$run.log"
          done
          cp /tmp/supervisor-original.cpp Tests/SupervisorContinuityTest.cpp
          echo 'HANN_MEMO_DETECTOR_EXACT=PASS'

      - name: Verify end to end corpus exact
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/supervisor-before-corpus.cpp
          cp Tests/GoldenEngineBehaviorCorpusTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-corpus -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-corpus --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          for run in 1 2; do
            ./build-corpus/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee "/tmp/corpus-$run.log"
            grep -q '^GOLDEN_ENGINE_BEHAVIOR_CORPUS=PASS scenarios=14$' "/tmp/corpus-$run.log"
            grep -q '^GOLDEN_ENGINE_CORPUS_HASH=022ae649ee590533$' "/tmp/corpus-$run.log"
          done
          grep '^GOLDEN_ENGINE_SCENARIO_HASH' /tmp/corpus-1.log > /tmp/scenarios-1.log
          grep '^GOLDEN_ENGINE_SCENARIO_HASH' /tmp/corpus-2.log > /tmp/scenarios-2.log
          diff -u /tmp/scenarios-1.log /tmp/scenarios-2.log
          cp /tmp/supervisor-before-corpus.cpp Tests/SupervisorContinuityTest.cpp
          echo 'HANN_MEMO_END_TO_END_EXACT=PASS'

      - name: Verify authority renderer and tail contracts
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-contracts -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-contracts --config Release --parallel 2 \
            --target SupervisorContinuityTest CleanModernPitchEngineTest SingleWetSpectralRendererTest >/dev/null
          ./build-contracts/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/supervisor.log
          ./build-contracts/clean-engine-tests/CleanModernPitchEngineTest 2>&1 | tee /tmp/engine.log
          ./build-contracts/clean-engine-tests/SingleWetSpectralRendererTest 2>&1 | tee /tmp/renderer.log
          ! grep -q '=FAIL' /tmp/supervisor.log
          ! grep -q '=FAIL' /tmp/engine.log
          ! grep -q '=FAIL' /tmp/renderer.log
          grep -q 'transition_detector_wobble_cannot_move_destination=PASS' /tmp/supervisor.log
          grep -q 'falling_terminal_tail_stays_on_previous_degree_and_remains_corrected=PASS' /tmp/supervisor.log
          grep -q 'rising_terminal_tail_stays_on_previous_degree_and_remains_corrected=PASS' /tmp/supervisor.log
          grep -q 'periodic_reentry_has_no_click=PASS' /tmp/renderer.log

          cp Tests/SupervisorContinuityTest.cpp /tmp/supervisor-before-tail.cpp
          cp Tests/TerminalTailStableAuthorityTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-tail -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-tail --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-tail/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/tail.log
          cp /tmp/supervisor-before-tail.cpp Tests/SupervisorContinuityTest.cpp
          grep -q '^TERMINAL_TAIL_STABLE_AUTHORITY=PASS$' /tmp/tail.log
          echo 'HANN_MEMO_CONTRACTS=PASS'

      - name: Profile current baseline
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/neumaton-hann-baseline
          cp Tests/SupervisorContinuityTest.cpp /tmp/baseline-supervisor.cpp
          cp Tests/CpuHotspotBenchmark.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-cpu -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-cpu --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          : > /tmp/hann-baseline-cpu.log
          for run in 1 2 3; do
            ./build-cpu/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee -a /tmp/hann-baseline-cpu.log
          done
          cp /tmp/baseline-supervisor.cpp Tests/SupervisorContinuityTest.cpp

      - name: Profile lazy Hann candidate
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/candidate-supervisor.cpp
          cp Tests/CpuHotspotBenchmark.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-candidate-cpu -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-candidate-cpu --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          : > /tmp/hann-candidate-cpu.log
          for run in 1 2 3; do
            ./build-candidate-cpu/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee -a /tmp/hann-candidate-cpu.log
          done
          cp /tmp/candidate-supervisor.cpp Tests/SupervisorContinuityTest.cpp

      - name: Summarize CPU medians
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, statistics

          def rows(path):
              out=[]
              for line in Path(path).read_text().splitlines():
                  if line.startswith("CPU_PROFILE "):
                      out.append(dict(re.findall(r'(\w+)=([^ ]+)', line)))
              if len(out) != 9:
                  raise SystemExit(f"{path}: expected 9 rows, got {len(out)}")
              return out

          b=rows('/tmp/hann-baseline-cpu.log')
          c=rows('/tmp/hann-candidate-cpu.log')

          def med(rows, block, key):
              return statistics.median(float(r[key]) for r in rows if int(r['block']) == block)

          for block in (64,128,256):
              bt=med(b,block,'tracker_ms'); ct=med(c,block,'tracker_ms')
              be=med(b,block,'engine_ms'); ce=med(c,block,'engine_ms')
              bl=med(b,block,'live_ms'); cl=med(c,block,'live_ms')
              print('HANN_MEMO_CPU_MEDIAN',
                    f'block={block}',
                    f'baseline_tracker_ms={bt:.3f}',
                    f'candidate_tracker_ms={ct:.3f}',
                    f'tracker_reduction_pct={(1-ct/max(bt,1e-9))*100:.2f}',
                    f'baseline_engine_ms={be:.3f}',
                    f'candidate_engine_ms={ce:.3f}',
                    f'engine_reduction_pct={(1-ce/max(be,1e-9))*100:.2f}',
                    f'baseline_live_ms={bl:.3f}',
                    f'candidate_live_ms={cl:.3f}',
                    f'live_reduction_pct={(1-cl/max(bl,1e-9))*100:.2f}')
          PY
          echo 'HANN_MEMO_VALIDATION=PASS_NO_PROMOTION'
