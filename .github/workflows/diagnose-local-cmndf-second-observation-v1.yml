name: Diagnose local CMNDF second observation v1

on:
  push:
    branches:
      - v1-continuous-f0-contract-v1
    paths:
      - Tests/LocalCmndfSecondObservationDiagnostic.cpp
      - .github/workflows/diagnose-local-cmndf-second-observation-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1-continuous-f0-contract-v1

      - name: Dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y             libasound2-dev libjack-jackd2-dev ladspa-sdk             libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev             libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Build and run
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/LocalCmndfSecondObservationDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-local-cmndf             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-local-cmndf --config Release --parallel 2             --target SupervisorContinuityTest >/dev/null
          ./build-local-cmndf/clean-engine-tests/SupervisorContinuityTest             | tee /tmp/local-cmndf.log
          grep -q '^LOCAL_CMNDF_SECOND ' /tmp/local-cmndf.log

      - name: Summarize
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, statistics
          rows=[]
          for line in Path('/tmp/local-cmndf.log').read_text().splitlines():
              if not line.startswith('LOCAL_CMNDF_SECOND '):
                  continue
              d=dict(re.findall(r'(\w+)=([^ ]+)', line))
              for k in ['radius','proposal_error','refined_error','ns']:
                  d[k]=float(d[k])
              d['improves']=int(d['improves'])
              d['pass_1p5']=int(d['pass_1p5'])
              rows.append(d)

          for radius in sorted({r['radius'] for r in rows}):
              subset=[r for r in rows if r['radius']==radius]
              abs_err=[abs(r['refined_error']) for r in subset]
              print(
                  'LOCAL_CMNDF_SUMMARY'
                  f' radius={radius:.1f}'
                  f' cases={len(subset)}'
                  f' improve_fraction={sum(r["improves"] for r in subset)/len(subset):.6f}'
                  f' pass_1p5_fraction={sum(r["pass_1p5"] for r in subset)/len(subset):.6f}'
                  f' median_abs_cents={statistics.median(abs_err):.6f}'
                  f' worst_abs_cents={max(abs_err):.6f}'
                  f' median_ns={statistics.median(r["ns"] for r in subset):.3f}'
              )
          PY
