name: Validate biquad sanitize ablation v1

on:
  push:
    branches:
      - v1-lean-biquad-sanitize-ablation-v1
    paths:
      - Source/ModernPitchEngine.cpp
      - .github/workflows/validate-biquad-sanitize-ablation-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: v1-lean-biquad-sanitize-ablation-v1
          fetch-depth: 0

      - name: Guard scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cfdbd4eede7955ca4f01570f857a965c216acd8f HEAD
          grep -q 'BIQUAD_INPUT_SANITIZE_OWNED_UPSTREAM_V1' Source/ModernPitchEngine.cpp
          echo 'BIQUAD_SANITIZE_ABLATION_SCOPE=PASS'

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y             libasound2-dev libjack-jackd2-dev ladspa-sdk             libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev             libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Configure and build
        run: |
          cmake -S . -B build-biquad             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-biquad --config Release --parallel 2 --target Neumaton >/dev/null

      - name: Preserve supervisor
        run: cp Tests/SupervisorContinuityTest.cpp /tmp/biquad-supervisor.cpp

      - name: Detector exactness
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/GoldenDetectorDeterminismTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-biquad --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          for run in 1 2 3; do
            ./build-biquad/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee "/tmp/biquad-detector-$run.log"
            grep -q '^GOLDEN_DETECTOR_TRACE_HASH=58273352d40c5499$' "/tmp/biquad-detector-$run.log"
          done
          echo 'BIQUAD_SANITIZE_DETECTOR_BIT_EXACT=PASS'

      - name: Public sanitizer safety
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SanitizerSmoke.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-biquad --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-biquad/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/biquad-sanitizer.log
          grep -q '^Sanitizer smoke passed\.$' /tmp/biquad-sanitizer.log
          echo 'BIQUAD_SANITIZE_PUBLIC_BOUNDARY=PASS'

      - name: Engine corpus
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/GoldenEngineBehaviorCorpusTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-biquad --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-biquad/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/biquad-engine.log
          grep -q '^GOLDEN_ENGINE_CORPUS_HASH=982b4ad85accdd75$' /tmp/biquad-engine.log
          echo 'BIQUAD_SANITIZE_ENGINE_EXACT=PASS'

      - name: Existing contracts
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/biquad-supervisor.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-biquad --config Release --parallel 2             --target SupervisorContinuityTest CleanModernPitchEngineTest >/dev/null
          ./build-biquad/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/biquad-supervisor.log
          ./build-biquad/clean-engine-tests/CleanModernPitchEngineTest 2>&1 | tee /tmp/biquad-clean.log
          ! grep -q '=FAIL' /tmp/biquad-supervisor.log
          ! grep -q '=FAIL' /tmp/biquad-clean.log
          echo 'BIQUAD_SANITIZE_EXISTING_CONTRACTS=PASS'

      - name: Final marker
        run: echo 'V1_LEAN_BIQUAD_SANITIZE_ABLATION=PASS_EXACT_BEHAVIOR'
