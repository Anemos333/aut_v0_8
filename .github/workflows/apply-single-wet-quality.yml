name: Apply Single Wet Quality

on:
  push:
    branches:
      - single-wet-quality-reconstruction

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[single-wet-applied]') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply single wet reconstruction
        run: |
          base64 -d .github/tmp_single_wet/script.py.gz.b64 | gzip -d > /tmp/apply_single_wet_quality.py
          python /tmp/apply_single_wet_quality.py
          rm -rf .github/tmp_single_wet
          rm -f .github/workflows/apply-single-wet-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use historical Quality wet reconstruction as the single audio path [single-wet-applied]"
          git push origin HEAD:single-wet-quality-reconstruction
