name: Apply Single Wet Quality

on:
  pull_request:
    branches:
      - clean-rewrite-musical-note-supervisor
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ false }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: single-wet-quality-reconstruction
          fetch-depth: 0
      - name: Disabled while patch payload is refreshed
        run: echo disabled
