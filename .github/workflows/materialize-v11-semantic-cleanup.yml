name: Materialize Authoritative Single Glide V12

on:
  push:
    branches:
      - one-voice-breath-glide-v11
    paths:
      - .github/workflows/materialize-v11-semantic-cleanup.yml
      - Tests/OneVoiceBreathGlideV11SemanticCleanup.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply authoritative single-glide semantics
        run: python3 Tests/OneVoiceBreathGlideV11SemanticCleanup.py

      - name: Verify authority and single-path source contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'exactScaleLockAuthority' Source/ModernPitchEngine.cpp Source/ModernPitchEngine.h
          ! grep -q 'zeroPrudenceAuthority' Source/ModernPitchEngine.cpp Source/ModernPitchEngine.h
          ! grep -q 'immediateAuthority_' Source/ModernPitchEngine.cpp Source/ModernPitchEngine.h
          ! grep -q 'setImmediateAuthority' Source/ModernPitchEngine.cpp Source/ModernPitchEngine.h
          ! grep -q 'breathConfirmSamples' Source/ModernPitchEngine.cpp
          ! grep -q 'ambiguousReleaseSamples' Source/ModernPitchEngine.cpp
          grep -q 'signal_with_target_is_immediately_voiced_stable' Tests/SupervisorContinuityTest.cpp
          grep -q 'glide_converges_exactly_to_requested_target' Tests/SupervisorContinuityTest.cpp
          grep -q 'hold_crossing_changes_degree_without_confidence_confirmation' Tests/SupervisorContinuityTest.cpp
          grep -q 'audible_consonant_keeps_voiced_target_and_correction' Tests/SupervisorContinuityTest.cpp
          ! grep -q 'wetMix' Source/SingleWetSpectralRenderer.cpp
          ! grep -q 'harmonicMask' Source/SingleWetSpectralRenderer.cpp
          ! grep -q 'noiseWeight' Source/SingleWetSpectralRenderer.cpp
          grep -q 'lookupFormantGain' Source/SingleWetSpectralRenderer.cpp
          echo AUTHORITATIVE_SINGLE_GLIDE_SOURCE_CONTRACT=PASS

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure tests and plugin
        run: cmake -S . -B build-authority -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Build authority and renderer tests
        run: cmake --build build-authority --config Release --target SupervisorContinuityTest SingleWetSpectralRendererTest --parallel 2

      - name: Run authority tests
        run: ./build-authority/clean-engine-tests/SupervisorContinuityTest

      # This executable is retained as a diagnostic for the next timbre pass.
      # On the untouched V11 renderer it already reports harmonic-family
      # interpolation errors (while fundamental-ratio/single-source tests pass),
      # so it must not veto this supervisor-only authority change.
      - name: Run renderer diagnostic (deferred timbre metric)
        continue-on-error: true
        run: ./build-authority/clean-engine-tests/SingleWetSpectralRendererTest

      - name: Build complete VST3
        run: cmake --build build-authority --config Release --target Neumaton_VST3 --parallel 2

      - name: Commit materialized engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/ModernPitchEngine.h Source/ModernPitchEngine.cpp Tests/SupervisorContinuityTest.cpp
          if git diff --cached --quiet; then
            echo 'Already materialized.'
            exit 0
          fi
          git commit -m 'Materialize authoritative single-glide V11 semantics'
          git push origin HEAD:one-voice-breath-glide-v11
