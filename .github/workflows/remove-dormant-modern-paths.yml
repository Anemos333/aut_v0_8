name: Remove Dormant Modern Paths

on:
  pull_request:
    branches:
      - clean-rewrite-musical-note-supervisor
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: single-wet-quality-reconstruction
          fetch-depth: 0
      - name: Remove dormant transport and LPC code
        run: |
          python .github/tmp_remove_dormant_paths.py
          rm .github/tmp_remove_dormant_paths.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/ModernPitchEngine.cpp Source/ModernPitchEngine.h CMakeLists.txt .github/tmp_remove_dormant_paths.py
          git commit -m "Remove dormant transport and LPC output paths"
          git push origin HEAD:single-wet-quality-reconstruction
