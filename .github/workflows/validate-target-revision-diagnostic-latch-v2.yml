name: Validate target revision diagnostic latch v2

on:
  push:
    branches:
      - voice-aware-f0-parallel-golden-v1
    paths:
      - Tests/ApplyTargetRevisionDiagnosticLatchV2.py
      - Tests/TargetRevisionDiagnosticLatchV2Test.cpp
      - .github/workflows/validate-target-revision-diagnostic-latch-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: voice-aware-f0-parallel-golden-v1
          fetch-depth: 0

      - name: Guard diagnostic v1 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Source/ModernPitchEngine.cpp)" = "b8581dd3455e88cb7942d46102d29acb1a846def"
          test "$(git hash-object Source/ModernPitchEngine.h)" = "41e6ab65ac5779cfc1c0995613868b9649967459"
          test "$(git hash-object Source/ControlRoomPage.cpp)" = "b5c14e05d8f6468b0fb22a7d0d5dc72f21c5af4c"
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          grep -q 'TARGET_REVISION_DIAGNOSTIC_LATCH_V1' Source/ModernPitchEngine.cpp
          grep -q 'RESIDUAL_HANN_LAZY_MEMOIZATION_V1' Source/ModernPitchEngine.cpp
          ! grep -q 'TARGET_REVISION_DIAGNOSTIC_LATCH_V2' Source/ModernPitchEngine.cpp

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Apply detailed diagnostic v2
        shell: bash
        run: |
          set -euo pipefail
          python3 Tests/ApplyTargetRevisionDiagnosticLatchV2.py
          changed="$(git diff --name-only)"
          test "$changed" = $'Source/ControlRoomPage.cpp\nSource/ModernPitchEngine.cpp\nSource/ModernPitchEngine.h'
          grep -q 'TARGET_REVISION_DIAGNOSTIC_LATCH_V2' Source/ModernPitchEngine.cpp
          grep -q 'TARGET_REVISION_DIAGNOSTIC_LATCH_V2' Source/ModernPitchEngine.h
          grep -q 'TARGET_REVISION_DIAGNOSTIC_LATCH_V2' Source/ControlRoomPage.cpp
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"

      - name: Build VST3 including detailed diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-plugin -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build-plugin --config Release --parallel 2 --target Neumaton_VST3 >/dev/null
          echo 'TARGET_REVISION_DIAGNOSTIC_V2_PLUGIN_BUILD=PASS'

      - name: Verify detailed diagnostic semantics
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/supervisor-original.cpp
          cp Tests/TargetRevisionDiagnosticLatchV2Test.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-diagnostic-v2 -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-diagnostic-v2 --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-diagnostic-v2/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/diagnostic-v2.log
          cp /tmp/supervisor-original.cpp Tests/SupervisorContinuityTest.cpp
          grep -q '^TARGET_REVISION_DIAGNOSTIC_LATCH_V2=PASS$' /tmp/diagnostic-v2.log

      - name: Verify detector oracle remains exact
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/supervisor-detector.cpp
          cp Tests/GoldenDetectorDeterminismTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-detector -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-detector --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          for run in 1 2 3; do
            ./build-detector/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee "/tmp/detector-$run.log"
            grep -q '^GOLDEN_DETECTOR_TRACE_HASH=58273352d40c5499$' "/tmp/detector-$run.log"
          done
          cp /tmp/supervisor-detector.cpp Tests/SupervisorContinuityTest.cpp
          echo 'TARGET_REVISION_DIAGNOSTIC_V2_DETECTOR_EXACT=PASS'

      - name: Verify end to end corpus remains exact
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/supervisor-corpus.cpp
          cp Tests/GoldenEngineBehaviorCorpusTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-corpus -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-corpus --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          for run in 1 2; do
            ./build-corpus/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee "/tmp/corpus-$run.log"
            grep -q '^GOLDEN_ENGINE_CORPUS_HASH=022ae649ee590533$' "/tmp/corpus-$run.log"
          done
          cp /tmp/supervisor-corpus.cpp Tests/SupervisorContinuityTest.cpp
          echo 'TARGET_REVISION_DIAGNOSTIC_V2_END_TO_END_EXACT=PASS'

      - name: Verify authority renderer and tail contracts
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-contracts -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-contracts --config Release --parallel 2 \
            --target SupervisorContinuityTest CleanModernPitchEngineTest SingleWetSpectralRendererTest >/dev/null
          ./build-contracts/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/supervisor.log
          ./build-contracts/clean-engine-tests/CleanModernPitchEngineTest 2>&1 | tee /tmp/engine.log
          ./build-contracts/clean-engine-tests/SingleWetSpectralRendererTest 2>&1 | tee /tmp/renderer.log
          ! grep -q '=FAIL' /tmp/supervisor.log
          ! grep -q '=FAIL' /tmp/engine.log
          ! grep -q '=FAIL' /tmp/renderer.log

          cp Tests/SupervisorContinuityTest.cpp /tmp/supervisor-tail.cpp
          cp Tests/TerminalTailStableAuthorityTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-tail -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-tail --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-tail/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/tail.log
          cp /tmp/supervisor-tail.cpp Tests/SupervisorContinuityTest.cpp
          grep -q '^TERMINAL_TAIL_STABLE_AUTHORITY=PASS$' /tmp/tail.log
          echo 'TARGET_REVISION_DIAGNOSTIC_V2_CONTRACTS=PASS'

      - name: Finish
        run: echo 'TARGET_REVISION_DIAGNOSTIC_V2_VALIDATION=PASS_NO_PROMOTION'
