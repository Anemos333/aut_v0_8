name: Probe F0 transition residual holdout
on:
  push:
    branches: [v1-f0-demolish-and-rebuild-v1]
    paths:
      - Tests/F0TransitionResidualHoldoutProbe.cpp
      - Tests/F0WholeNoteProgressiveProbe.cpp
      - .github/workflows/probe-f0-transition-residual-holdout-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-f0-demolish-and-rebuild-v1
      - name: Build residual holdout probe
        run: |
          sed -i '0,/^int main()$/{s/^int main()$/int progressive_probe_reference_main()/}' \
              Tests/F0WholeNoteProgressiveProbe.cpp
          g++ -std=c++17 -O3 -Wall -Wextra -Wpedantic \
              Tests/F0TransitionResidualHoldoutProbe.cpp \
              -o /tmp/f0-transition-residual-holdout
      - name: Run diagnostic
        run: |
          /tmp/f0-transition-residual-holdout | tee /tmp/f0-transition-residual-holdout.log
          grep '^RESIDUAL_HOLDOUT' /tmp/f0-transition-residual-holdout.log
