name: Clean ModernPitchEngine

on:
  push:
    branches:
      - modern-pitch-engine-clean-rewrite
  pull_request:
    branches:
      - main
    paths:
      - 'Source/ModernPitchEngine.*'
      - 'Source/LivePitchProcessor.h'
      - 'CMakeLists.txt'
      - 'Tests/CleanModernPitchEngineTest.cpp'
      - '.github/workflows/clean-modern-pitch-engine.yml'

permissions:
  contents: read

jobs:
  invariant-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-clean \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build-clean `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Build invariant test
        run: cmake --build build-clean --config Release --target CleanModernPitchEngineTest --parallel 2

      - name: Run invariant test on Linux
        if: runner.os == 'Linux'
        run: ./build-clean/clean-engine-tests/CleanModernPitchEngineTest

      - name: Run invariant test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\build-clean\clean-engine-tests\CleanModernPitchEngineTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-vst3:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-vst3 `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build-vst3 --config Release `
            --target Neumaton_VST3 --parallel 2

      - name: Verify clean architecture and package
        shell: pwsh
        run: |
          $lineCount = (Get-Content Source\ModernPitchEngine.cpp).Count
          if ($lineCount -gt 1800) {
            Write-Error "ModernPitchEngine.cpp grew beyond clean-engine limit: $lineCount"
            exit 1
          }
          $forbidden = @(
            'SynthesisLayer',
            'TransitionManager',
            'wetMix_',
            'dryTrust_',
            'NeumatonOutputRenderer',
            'NeumatonRidgeLedger',
            'NEUMATON_OUTPUT_V3'
          )
          foreach ($term in $forbidden) {
            if (Select-String -Path Source\ModernPitchEngine.cpp,Source\ModernPitchEngine.h -Pattern $term -Quiet) {
              Write-Error "Forbidden legacy symbol remains: $term"
              exit 1
            }
          }

          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $vst3 = Get-ChildItem -Path build-vst3 -Recurse -Directory -Filter "Neumaton.vst3" | Select-Object -First 1
          if (-not $vst3) {
            Write-Error "Neumaton.vst3 not found"
            exit 1
          }
          Copy-Item -Path $vst3.FullName -Destination artifact\Neumaton.vst3 -Recurse -Force
          Compress-Archive -Path artifact\Neumaton.vst3 `
            -DestinationPath artifact\Neumaton-Clean-ModernPitchEngine-Windows.zip -Force
          Get-FileHash artifact\Neumaton-Clean-ModernPitchEngine-Windows.zip -Algorithm SHA256 |
            Format-List | Out-File artifact\sha256.txt

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: Neumaton-Clean-ModernPitchEngine-Windows
          path: |
            artifact/Neumaton-Clean-ModernPitchEngine-Windows.zip
            artifact/sha256.txt
          retention-days: 14
