name: Clean ModernPitchEngine

on:
  pull_request:
    branches:
      - main
      - modern-pitch-engine-clean-rewrite
      - clean-rewrite-detector-integration-rc
      - clean-rewrite-transport-continuity
      - clean-rewrite-main-supervisor-integration
      - clean-rewrite-stable-lpc-period-sync
    paths:
      - 'Source/ModernPitchEngine.*'
      - 'Source/LivePitchProcessor.h'
      - 'Source/VoiceEvidenceAnalyzer.h'
      - 'CMakeLists.txt'
      - 'Tests/CleanModernPitchEngineTest.cpp'
      - 'Tests/VoiceEvidenceAnalyzerTest.cpp'
      - 'Tests/TransportContinuityTest.cpp'
      - 'Tests/SupervisorContinuityTest.cpp'
      - 'Tests/StableVoicePathTest.cpp'
      - 'Tests/StableVoicePathModernPitchEngineCompile.cpp'
      - 'Tests/CLEAN_MODERN_PITCH_ENGINE_CONTRACT.md'
      - '.github/workflows/clean-modern-pitch-engine.yml'

permissions:
  contents: read

jobs:
  invariant-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-clean \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build-clean `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Build invariant tests
        run: cmake --build build-clean --config Release --target CleanModernPitchEngineTest VoiceEvidenceAnalyzerTest TransportContinuityTest SupervisorContinuityTest StableVoicePathTest --parallel 2

      - name: Run invariant tests on Linux
        if: runner.os == 'Linux'
        run: |
          ./build-clean/clean-engine-tests/CleanModernPitchEngineTest
          ./build-clean/clean-engine-tests/VoiceEvidenceAnalyzerTest
          ./build-clean/clean-engine-tests/TransportContinuityTest
          ./build-clean/clean-engine-tests/SupervisorContinuityTest
          ./build-clean/clean-engine-tests/StableVoicePathTest

      - name: Run invariant tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tests = @(
            ".\build-clean\clean-engine-tests\CleanModernPitchEngineTest.exe",
            ".\build-clean\clean-engine-tests\VoiceEvidenceAnalyzerTest.exe",
            ".\build-clean\clean-engine-tests\TransportContinuityTest.exe",
            ".\build-clean\clean-engine-tests\SupervisorContinuityTest.exe",
            ".\build-clean\clean-engine-tests\StableVoicePathTest.exe"
          )
          foreach ($test in $tests) {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($test)
            $stdout = "$name-stdout.txt"
            $stderr = "$name-stderr.txt"
            $process = Start-Process `
              -FilePath $test `
              -Wait `
              -PassThru `
              -NoNewWindow `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr
            Write-Host "$name exit_code=$($process.ExitCode)"
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          }

  windows-vst3:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-vst3 `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build-vst3 --config Release `
            --target Neumaton_VST3 --parallel 2

      - name: Verify clean architecture and package
        shell: pwsh
        run: |
          $lineCount = (Get-Content Source\ModernPitchEngine.cpp).Count
          if ($lineCount -gt 3000) {
            Write-Error "ModernPitchEngine.cpp grew beyond detector-plus-clean-output limit: $lineCount"
            exit 1
          }
          $forbidden = @(
            'SynthesisLayer',
            'TransitionManager',
            'SpectralVoiceShifter',
            'CorrectionController',
            'wetMix_',
            'dryTrust_',
            'targetLpc_',
            'currentLpc_',
            'NeumatonOutputRenderer',
            'NeumatonRidgeLedger',
            'NEUMATON_OUTPUT_V3'
          )
          foreach ($term in $forbidden) {
            if (Select-String -Path Source\ModernPitchEngine.cpp,Source\ModernPitchEngine.h,Source\LivePitchProcessor.h,Source\VoiceEvidenceAnalyzer.h -Pattern $term -Quiet) {
              Write-Error "Forbidden legacy/unstable output symbol remains: $term"
              exit 1
            }
          }
          $required = @(
            'noteBodyLatched',
            'voiceBodyEnergy',
            'transportPeriodHz',
            'holdPeriodGuidance',
            'currentReflectionTarget_',
            'calculateReflectionCoefficients',
            'periodNudgeSamples_'
          )
          foreach ($term in $required) {
            if (-not (Select-String -Path Source\ModernPitchEngine.cpp,Source\ModernPitchEngine.h,Source\LivePitchProcessor.h -Pattern $term -Quiet)) {
              Write-Error "Musical supervisor invariant missing: $term"
              exit 1
            }
          }
          if (-not (Select-String -Path Source\VoiceEvidenceAnalyzer.h -Pattern 'const juce::AudioBuffer<float>&' -Quiet)) {
            Write-Error "Voice evidence analyzer must remain read-only on audio"
            exit 1
          }
          $sensorAuthorityWrites = @(
            'conditioned\.amount\s*=',
            'conditioned\.detectorSensitivity\s*=',
            'conditioned\.formantPreservation\s*=',
            'conditioned\.transientProtection\s*=',
            'conditioned\.preserveVibrato\s*=',
            'conditioned\.vibratoPreserve\s*=',
            'conditioned\.breathReduction\s*=',
            'conditioned\.lockHysteresis\s*=',
            'conditioned\.lockStrictness\s*='
          )
          foreach ($pattern in $sensorAuthorityWrites) {
            if (Select-String -Path Source\LivePitchProcessor.h -Pattern $pattern -Quiet) {
              Write-Error "Voice evidence may supervise identity but may not rewrite user authority: $pattern"
              exit 1
            }
          }

          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $vst3 = Get-ChildItem -Path build-vst3 -Recurse -Directory -Filter "Neumaton.vst3" | Select-Object -First 1
          if (-not $vst3) {
            Write-Error "Neumaton.vst3 not found"
            exit 1
          }
          Copy-Item -Path $vst3.FullName -Destination artifact\Neumaton.vst3 -Recurse -Force
          Compress-Archive -Path artifact\Neumaton.vst3 `
            -DestinationPath artifact\Neumaton-Clean-ModernPitchEngine-Windows.zip -Force
          Get-FileHash artifact\Neumaton-Clean-ModernPitchEngine-Windows.zip -Algorithm SHA256 |
            Format-List | Out-File artifact\sha256.txt

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: Neumaton-Clean-ModernPitchEngine-Windows
          path: |
            artifact/Neumaton-Clean-ModernPitchEngine-Windows.zip
            artifact/sha256.txt
          retention-days: 14