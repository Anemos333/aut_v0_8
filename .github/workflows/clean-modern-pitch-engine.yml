name: Clean ModernPitchEngine detector graft

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  graft-proven-detector:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modern-pitch-engine-clean-rewrite
          fetch-depth: 0

      - name: Extract only detector and anti-alias filters from main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:Source/ModernPitchEngine.h > /tmp/legacy.h
          git show origin/main:Source/ModernPitchEngine.cpp > /tmp/legacy.cpp
          python3 - <<'PY'
          from pathlib import Path
          import re

          header_path = Path('Source/ModernPitchEngine.h')
          cpp_path = Path('Source/ModernPitchEngine.cpp')
          header = header_path.read_text()
          cpp = cpp_path.read_text()
          legacy_h = Path('/tmp/legacy.h').read_text()
          legacy_cpp = Path('/tmp/legacy.cpp').read_text()

          def between(text, start, end):
              begin = text.index(start)
              finish = text.index(end, begin)
              return text[begin:finish]

          detector_h = between(legacy_h,
                               '    class BiquadLowPass',
                               '    class ScaleQuantizer')
          begin = header.index('    class PitchTracker')
          finish = header.index('    class ScaleQuantizer', begin)
          header = header[:begin] + detector_h + header[finish:]
          header = header.replace('PitchTracker linkedTracker_;',
                                  'MultiRatePitchTracker linkedTracker_;')
          header = header.replace(
              'std::array<PitchTracker, maxSupportedChannels> channelTrackers_ {};',
              'std::array<MultiRatePitchTracker, maxSupportedChannels> channelTrackers_ {};')

          detector_cpp = between(
              legacy_cpp,
              '//==============================================================================\n// BiquadLowPass',
              '//==============================================================================\n// ScaleQuantizer')
          begin = cpp.index('//==============================================================================\n// PitchTracker')
          finish = cpp.index('//==============================================================================\n// ScaleQuantizer', begin)
          cpp = cpp[:begin] + detector_cpp + cpp[finish:]

          cpp = cpp.replace('#include <limits>\n',
                            '#include <limits>\n#include <cstring>\n')
          cpp = cpp.replace('constexpr float audioFloor = 1.0e-12f;\n',
              '''constexpr float audioFloor = 1.0e-12f;
          constexpr float minimumDetectorRms = 0.0012f;

          [[nodiscard]] float sanitiseAudioSample(float value) noexcept
          {
              if (!std::isfinite(value) || std::fpclassify(value) == FP_SUBNORMAL)
                  return 0.0f;
              return std::clamp(value, -32.0f, 32.0f);
          }

          [[nodiscard]] float finiteOr(float value, float fallback) noexcept
          {
              return std::isfinite(value) ? value : fallback;
          }

          [[nodiscard]] double finiteOr(double value, double fallback) noexcept
          {
              return std::isfinite(value) ? value : fallback;
          }
          ''')
          cpp = cpp.replace('linkedTracker_.prepare(sampleRate_, latencyMode_);',
                            'linkedTracker_.prepare(sampleRate_);')
          cpp = re.sub(
              r'channelTrackers_\[static_cast<std::size_t>\(channel\)\]\.prepare\(\s*sampleRate_,\s*latencyMode_\s*\);',
              'channelTrackers_[static_cast<std::size_t>(channel)].prepare(\n            sampleRate_);',
              cpp,
              count=1)

          cpp, linked_count = re.subn(
              r'if\s*\(linkedTracker_\.push\(linkedSample,\s*parameters\.minimumPitchHz,\s*parameters\.maximumPitchHz,\s*parameters\.detectorSensitivity,\s*observation\)\)',
              'if (linkedTracker_.processSample(linkedSample, observation))',
              cpp,
              count=1)
          if linked_count != 1:
              raise SystemExit(f'linked tracker replacements={linked_count}')

          cpp, channel_count = re.subn(
              r'if\s*\(channelTrackers_\[static_cast<std::size_t>\(channel\)\]\.push\(\s*input,\s*parameters\.minimumPitchHz,\s*parameters\.maximumPitchHz,\s*parameters\.detectorSensitivity,\s*channelObservation\)\)',
              'if (channelTrackers_[static_cast<std::size_t>(channel)].processSample(\n                    input, channelObservation))',
              cpp,
              count=1)
          if channel_count != 1:
              raise SystemExit(f'channel tracker replacements={channel_count}')

          cpp, setup_count = re.subn(
              r'(    const bool dualMono = parameters\.stereoMode == StereoMode::dualMono\s*&& channels > 1;\s*)',
              r'''\1
              linkedTracker_.setRange(parameters.minimumPitchHz,
                                      parameters.maximumPitchHz);
              linkedTracker_.setSensitivity(parameters.detectorSensitivity);
              for (int channel = 0; channel < channels; ++channel)
              {
                  auto& tracker = channelTrackers_[static_cast<std::size_t>(channel)];
                  tracker.setRange(parameters.minimumPitchHz,
                                   parameters.maximumPitchHz);
                  tracker.setSensitivity(parameters.detectorSensitivity);
              }

          ''',
              cpp,
              count=1)
          if setup_count != 1:
              raise SystemExit(f'tracker setup replacements={setup_count}')

          combined = header + cpp
          forbidden = [
              'SynthesisLayer', 'TransitionManager', 'wetMix_', 'dryTrust_',
              'NeumatonOutputRenderer', 'NeumatonRidgeLedger',
              'NEUMATON_OUTPUT_V3', 'SpectralVoiceShifter',
              'CorrectionController'
          ]
          for term in forbidden:
              if term in combined:
                  raise SystemExit(f'forbidden legacy symbol returned: {term}')
          if 'MultiRatePitchTracker' not in combined:
              raise SystemExit('detector graft missing')

          header_path.write_text(header)
          cpp_path.write_text(cpp)
          PY

      - name: Commit detector-only graft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/ModernPitchEngine.h Source/ModernPitchEngine.cpp
          git commit -m "Reuse proven multi-rate detector in clean engine"
          git push origin HEAD:modern-pitch-engine-clean-rewrite
