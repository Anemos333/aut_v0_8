name: Clean ModernPitchEngine

on:
  pull_request:
    branches:
      - main
      - modern-pitch-engine-clean-rewrite
      - clean-rewrite-detector-integration-rc
      - clean-rewrite-transport-continuity
      - clean-rewrite-main-supervisor-integration
      - clean-rewrite-stable-lpc-period-sync
      - clean-rewrite-musical-note-supervisor
    paths:
      - 'Source/ModernPitchEngine.*'
      - 'Source/SingleWetSpectralRenderer.*'
      - 'Source/LivePitchProcessor.h'
      - 'Source/VoiceEvidenceAnalyzer.h'
      - 'CMakeLists.txt'
      - 'Tests/CleanModernPitchEngineTest.cpp'
      - 'Tests/VoiceEvidenceAnalyzerTest.cpp'
      - 'Tests/SupervisorContinuityTest.cpp'
      - 'Tests/SingleWetSpectralRendererTest.cpp'
      - 'Tests/GuiAudibilityTest.cpp'
      - 'Tests/GuiAudioControlContractTest.cpp'
      - 'Tests/UnifiedTransportPatch.py'
      - 'Tests/CLEAN_MODERN_PITCH_ENGINE_CONTRACT.md'
      - 'Tests/GUI_AUDIO_CONTROL_CONTRACT.md'
      - '.github/workflows/clean-modern-pitch-engine.yml'

permissions:
  contents: write

jobs:
  apply-unified-transport:
    if: github.event.pull_request.head.ref == 'single-wet-quality-reconstruction'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: single-wet-quality-reconstruction
          fetch-depth: 1

      - name: Apply guarded source transformation
        run: python3 Tests/UnifiedTransportPatch.py

      - name: Commit transformed source only
        shell: bash
        run: |
          git add Source/SingleWetSpectralRenderer.cpp Source/ModernPitchEngine.cpp Tests/SupervisorContinuityTest.cpp
          if git diff --cached --quiet; then
            echo "No source transformation needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep full-spectrum transport on one stable lattice"
          git push origin HEAD:single-wet-quality-reconstruction

  invariant-test:
    needs: apply-unified-transport
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout updated branch head
        uses: actions/checkout@v4
        with:
          ref: single-wet-quality-reconstruction

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-clean \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build-clean `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Build invariant tests
        run: cmake --build build-clean --config Release --target CleanModernPitchEngineTest VoiceEvidenceAnalyzerTest SupervisorContinuityTest SingleWetSpectralRendererTest GuiAudibilityTest GuiAudioControlContractTest --parallel 2

      - name: Run all invariant tests on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          failed=0
          ./build-clean/clean-engine-tests/CleanModernPitchEngineTest || failed=1
          ./build-clean/clean-engine-tests/VoiceEvidenceAnalyzerTest || failed=1
          ./build-clean/clean-engine-tests/SupervisorContinuityTest || failed=1
          ./build-clean/clean-engine-tests/SingleWetSpectralRendererTest || failed=1
          ./build-clean/clean-engine-tests/GuiAudibilityTest || failed=1
          ./build-clean/clean-engine-tests/GuiAudioControlContractTest || failed=1
          exit $failed

      - name: Run all invariant tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          $tests = @(
            ".\build-clean\clean-engine-tests\CleanModernPitchEngineTest.exe",
            ".\build-clean\clean-engine-tests\VoiceEvidenceAnalyzerTest.exe",
            ".\build-clean\clean-engine-tests\SupervisorContinuityTest.exe",
            ".\build-clean\clean-engine-tests\SingleWetSpectralRendererTest.exe",
            ".\build-clean\clean-engine-tests\GuiAudibilityTest.exe",
            ".\build-clean\clean-engine-tests\GuiAudioControlContractTest.exe"
          )
          foreach ($test in $tests) {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($test)
            $stdout = "$name-stdout.txt"
            $stderr = "$name-stderr.txt"
            $process = Start-Process `
              -FilePath $test `
              -Wait `
              -PassThru `
              -NoNewWindow `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr
            Write-Host "$name exit_code=$($process.ExitCode)"
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            if ($process.ExitCode -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

  windows-vst3:
    needs: apply-unified-transport
    runs-on: windows-2022
    steps:
      - name: Checkout updated branch head
        uses: actions/checkout@v4
        with:
          ref: single-wet-quality-reconstruction

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-vst3 `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build-vst3 --config Release `
            --target Neumaton_VST3 --parallel 2

      - name: Verify one-coordinate spectral architecture and package
        shell: pwsh
        run: |
          $rendererFiles = @(
            'Source\SingleWetSpectralRenderer.cpp',
            'Source\SingleWetSpectralRenderer.h'
          )
          $forbiddenRenderer = @(
            'wetMix_',
            'dryTrust_',
            'delayedDry',
            'blendLayers',
            'TransitionManager',
            'secondaryLayer',
            'NeumatonOutputRenderer',
            'NeumatonRidgeLedger',
            'NEUMATON_OUTPUT_V3',
            'layer.spectrum[sourceIndex] += fftBuffer_[sourceIndex]',
            'const float harmonicMagnitude',
            'const double sourcePosition = std::clamp(',
            'phaseGuidance = clamp01(harmonicMask_[sourceIndex])'
          )
          foreach ($term in $forbiddenRenderer) {
            if (Select-String -Path $rendererFiles -Pattern $term -SimpleMatch -Quiet) {
              Write-Error "Forbidden split/parallel audio symbol: $term"
              exit 1
            }
          }

          $requiredRenderer = @(
            'FULL_SPECTRUM_SINGLE_TRANSPORT_V1',
            'UNIFIED_VOICED_PHASE_GUIDANCE_V2',
            'STABLE_SINGLE_LATTICE_TRANSPORT_V3',
            'const float phaseGuidance = clamp01(smoothedSpectralReliability_)',
            'const float aperiodicEvidence',
            'const double targetPosition = static_cast<double>(sourceBin) * safeRatio',
            'trueSourceBins_[static_cast<std::size_t>(sourceBin)]',
            'context.pitchAnchorFresh'
          )
          foreach ($term in $requiredRenderer) {
            if (-not (Select-String -Path $rendererFiles -Pattern $term -SimpleMatch -Quiet)) {
              Write-Error "Unified transport invariant missing: $term"
              exit 1
            }
          }

          $layerCount = (Select-String -Path Source\SingleWetSpectralRenderer.h -Pattern 'SynthesisLayer layer_' -AllMatches).Matches.Count
          if ($layerCount -ne 1) {
            Write-Error "Renderer must own exactly one synthesis layer; found $layerCount"
            exit 1
          }
          if (Select-String -Path Source\SingleWetSpectralRenderer.h -Pattern 'array<SynthesisLayer' -SimpleMatch -Quiet) {
            Write-Error "Parallel synthesis-layer array is forbidden"
            exit 1
          }

          if (-not (Select-String -Path Source\ModernPitchEngine.cpp -Pattern 'wetRenderers_[static_cast<std::size_t>(channel)].processSample(' -SimpleMatch -Quiet)) {
            Write-Error "Production audio is not routed directly through the single renderer"
            exit 1
          }
          if (Select-String -Path Source\ModernPitchEngine.cpp -Pattern 'TransportClock|ChannelPath::|updateLpcTarget' -Quiet) {
            Write-Error "Removed transport/LPC audio machinery returned"
            exit 1
          }

          if (-not (Select-String -Path Source\VoiceEvidenceAnalyzer.h -Pattern 'const juce::AudioBuffer<float>&' -SimpleMatch -Quiet)) {
            Write-Error "Voice evidence analyzer must remain read-only on audio"
            exit 1
          }
          $sensorAuthorityWrites = @(
            'conditioned\.amount\s*=',
            'conditioned\.detectorSensitivity\s*=',
            'conditioned\.formantPreservation\s*=',
            'conditioned\.transientProtection\s*=',
            'conditioned\.preserveVibrato\s*=',
            'conditioned\.vibratoPreserve\s*=',
            'conditioned\.breathReduction\s*=',
            'conditioned\.lockHysteresis\s*=',
            'conditioned\.lockStrictness\s*='
          )
          foreach ($pattern in $sensorAuthorityWrites) {
            if (Select-String -Path Source\LivePitchProcessor.h -Pattern $pattern -Quiet) {
              Write-Error "Sensors may supervise care/search but may not rewrite user authority: $pattern"
              exit 1
            }
          }

          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $vst3 = Get-ChildItem -Path build-vst3 -Recurse -Directory -Filter "Neumaton.vst3" | Select-Object -First 1
          if (-not $vst3) {
            Write-Error "Neumaton.vst3 not found"
            exit 1
          }
          Copy-Item -Path $vst3.FullName -Destination artifact\Neumaton.vst3 -Recurse -Force
          Compress-Archive -Path artifact\Neumaton.vst3 `
            -DestinationPath artifact\Neumaton-Single-Wet-Quality-Windows.zip -Force
          Get-FileHash artifact\Neumaton-Single-Wet-Quality-Windows.zip -Algorithm SHA256 |
            Format-List | Out-File artifact\sha256.txt

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: Neumaton-Single-Wet-Quality-Windows
          path: |
            artifact/Neumaton-Single-Wet-Quality-Windows.zip
            artifact/sha256.txt
          retention-days: 14
