name: Validate quantizer ownership ablation v1

on:
  push:
    branches:
      - v1-lean-quantizer-ablation-v1
    paths:
      - Source/ModernPitchEngine.cpp
      - Source/ModernPitchEngine.h
      - Tests/HoldOwnershipBoundaryTest.cpp
      - .github/workflows/validate-quantizer-ownership-ablation-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: v1-lean-quantizer-ablation-v1
          fetch-depth: 0

      - name: Guard experiment scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1f624bf4edad6a2e65ca29732dd6f8ab0db3a67f HEAD
          grep -q 'QUANTIZER_STATE_ABLATION_V1' Source/ModernPitchEngine.cpp
          ! grep -q 'bool targetValid_' Source/ModernPitchEngine.h
          ! grep -q 'double targetLog2_' Source/ModernPitchEngine.h
          grep -q 'OBSERVATION_OWNERSHIP_POLICY_V1' Source/ObservationOwnershipPolicy.h
          echo 'QUANTIZER_ABLATION_SCOPE=PASS'

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y             libasound2-dev libjack-jackd2-dev ladspa-sdk             libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev             libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Configure and build plugin
        run: |
          cmake -S . -B build-ablation             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-ablation --config Release --parallel 2 --target Neumaton >/dev/null

      - name: Preserve supervisor slot
        run: cp Tests/SupervisorContinuityTest.cpp /tmp/ablation-supervisor-original.cpp

      - name: Detector must remain bit exact
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/GoldenDetectorDeterminismTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-ablation --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          for run in 1 2 3; do
            ./build-ablation/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee "/tmp/ablation-detector-$run.log"
            grep -q '^GOLDEN_DETECTOR_TRACE_HASH=58273352d40c5499$' "/tmp/ablation-detector-$run.log"
          done
          echo 'QUANTIZER_ABLATION_DETECTOR_BIT_EXACT=PASS'

      - name: Compare correction trajectory
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/CorrectionTrajectoryGoldenTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-ablation --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-ablation/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/ablation-trajectory.log
          grep '^CORRECTION_TRAJECTORY_HASH=' /tmp/ablation-trajectory.log
          grep -q '^CORRECTION_TRAJECTORY_HASH=3c958f8178c118a3$' /tmp/ablation-trajectory.log
          echo 'QUANTIZER_ABLATION_TRAJECTORY_EXACT=PASS'

      - name: Compare end-to-end golden corpus
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/GoldenEngineBehaviorCorpusTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-ablation --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-ablation/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/ablation-engine.log
          grep -q '^GOLDEN_ENGINE_BEHAVIOR_CORPUS=PASS scenarios=14$' /tmp/ablation-engine.log
          grep -q '^GOLDEN_ENGINE_CORPUS_HASH=982b4ad85accdd75$' /tmp/ablation-engine.log
          echo 'QUANTIZER_ABLATION_ENGINE_EXACT=PASS'

      - name: Verify Hold belongs to engine ownership
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/HoldOwnershipBoundaryTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-ablation --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-ablation/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/ablation-hold.log
          grep -q '^HOLD_OWNERSHIP_BOUNDARY=PASS ' /tmp/ablation-hold.log

      - name: Historical supervisor must differ only at obsolete quantizer-owned Hold contract
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/ablation-supervisor-original.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-ablation --config Release --parallel 2             --target SupervisorContinuityTest CleanModernPitchEngineTest >/dev/null

          set +e
          ./build-ablation/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/ablation-supervisor.log
          supervisor_rc=${PIPESTATUS[0]}
          set -e

          grep '=FAIL' /tmp/ablation-supervisor.log > /tmp/ablation-fails.txt || true
          fail_count="$(wc -l < /tmp/ablation-fails.txt)"
          if [ "$fail_count" -ne 1 ]; then
            echo "Unexpected supervisor failure count: $fail_count"
            cat /tmp/ablation-fails.txt
            exit 1
          fi
          grep -q 'hold_keeps_owned_degree_inside_user_cent_radius=FAIL' /tmp/ablation-fails.txt
          test "$supervisor_rc" -ne 0
          echo 'QUANTIZER_ABLATION_ONLY_OBSOLETE_UNIT_CONTRACT_CHANGED=PASS'

          ./build-ablation/clean-engine-tests/CleanModernPitchEngineTest 2>&1 | tee /tmp/ablation-clean.log
          ! grep -q '=FAIL' /tmp/ablation-clean.log
          echo 'QUANTIZER_ABLATION_PRODUCT_CONTRACTS=PASS'

      - name: Final marker
        run: |
          echo 'V1_LEAN_QUANTIZER_ABLATION=PASS_IF_ALL_ABOVE_GREEN'
          echo 'PROMOTION=REQUIRES_REVIEW_OF_OBSOLETE_QUANTIZER_UNIT_CONTRACT'
