name: Materialize Acquire Continuity V1

on:
  push:
    branches: [ simple-fix-from-quality-baseline ]

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple-fix-from-quality-baseline
          fetch-depth: 0

      - name: Guard clean baseline and frozen renderer
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SCALE_CELL_OWNS_SOFTNESS_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'DETECTOR_IS_OBSERVER_V1' Source/ModernPitchEngine.cpp
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "7eae364fc8974c10980c21fea739ed66b69b0e56"

      - name: Materialize acquire continuity patch
        shell: bash
        run: |
          set -euo pipefail
          python3 Tests/MaterializeAcquireContinuityV1.py

      - name: Verify acquire and audio continuity contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'FAST_INITIAL_ACQUIRE_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'NO_AUDIO_DROPOUT_ON_UNCERTAINTY_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'SCALE_CHANGE_PRESERVES_AUDIO_CONTINUITY_V1' Source/ModernPitchEngine.cpp
          ! grep -Fq 'UNOWNED_AUDIO_FAILS_CLOSED_V1' Source/ModernPitchEngine.cpp
          ! grep -Fq 'correction.targetValid ? rendered : 0.0f' Source/ModernPitchEngine.cpp
          ! grep -Fq 'linkedCorrection_.targetValid ? rendered : 0.0f' Source/ModernPitchEngine.cpp
          grep -Fq 'credible_multi_evidence_initial_register_commits_immediately' Tests/SupervisorContinuityTest.cpp
          grep -Fq 'single_family_initial_register_still_needs_repeat' Tests/SupervisorContinuityTest.cpp
          grep -Fq 'detector_uncertainty_never_mutes_active_audio' Tests/GuiAudioControlContractTest.cpp
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "7eae364fc8974c10980c21fea739ed66b69b0e56"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure focused tests
        run: cmake -S . -B build-acquire-continuity -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Build focused tests
        run: cmake --build build-acquire-continuity --config Release --target CleanModernPitchEngineTest SupervisorContinuityTest SingleWetSpectralRendererTest GuiAudioControlContractTest GuiAudibilityTest --parallel 2

      - name: Run focused tests
        shell: bash
        run: |
          set -euo pipefail
          ./build-acquire-continuity/clean-engine-tests/CleanModernPitchEngineTest
          ./build-acquire-continuity/clean-engine-tests/SupervisorContinuityTest
          ./build-acquire-continuity/clean-engine-tests/SingleWetSpectralRendererTest
          ./build-acquire-continuity/clean-engine-tests/GuiAudioControlContractTest
          ./build-acquire-continuity/clean-engine-tests/GuiAudibilityTest

      - name: Build VST3
        run: cmake --build build-acquire-continuity --config Release --target Neumaton_VST3 --parallel 2

      - name: Commit validated acquire continuity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/ModernPitchEngine.cpp Tests/SupervisorContinuityTest.cpp Tests/GuiAudioControlContractTest.cpp
          git rm -f Tests/MaterializeAcquireContinuityV1.py .github/workflows/materialize-acquire-continuity-v1.yml
          git commit -m "Keep audio continuous through detector acquire [skip ci]"
          git push origin HEAD:simple-fix-from-quality-baseline
