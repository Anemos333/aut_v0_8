name: Probe residual F0 failure autopsy

on:
  push:
    branches:
      - v1-f0-demolish-and-rebuild-v1
    paths:
      - 'Tests/F0WholeNoteFailureAutopsyProbe.cpp'
      - 'Source/F0WholeNoteDetectorV1.h'
      - '.github/workflows/probe-f0-failure-autopsy-v1.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-f0-demolish-and-rebuild-v1
      - name: Build failure autopsy
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Wpedantic \
            Tests/F0WholeNoteFailureAutopsyProbe.cpp \
            -o /tmp/f0-failure-autopsy
      - name: Run failure autopsy
        run: |
          /tmp/f0-failure-autopsy | tee /tmp/f0-failure-autopsy.log
          grep '^F0_FAILURE' /tmp/f0-failure-autopsy.log
