name: Materialize Scale-Owned Softness V1

on:
  push:
    branches: [ simple-fix-from-quality-baseline ]

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple-fix-from-quality-baseline
          fetch-depth: 0

      - name: Guard baseline and renderer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "7eae364fc8974c10980c21fea739ed66b69b0e56"
          grep -Fq 'SCALE_OWNS_VOICE_V2' Source/ModernPitchEngine.cpp
          grep -Fq 'DETECTOR_IS_OBSERVER_V1' Source/ModernPitchEngine.cpp

      - name: Materialize scale-owned softness cleanup
        shell: bash
        run: |
          set -euo pipefail
          git show 3f2d5cebee10f5a0a953796313f64c3600e5612d:Tests/SupervisorContinuityTest.cpp > Tests/SupervisorContinuityTest.cpp
          python3 Tests/MaterializeScaleOwnedSoftnessV1.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Tests/SupervisorContinuityTest.cpp')
          s = p.read_text()
          old = '''    // Softer Scale Lock must remain bit-for-contract on the continuity F0. The
              // new field is deliberately ignored unless every absolute-lock condition
              // is active.
              ModernPitchEngine::Parameters softCoordinateParameters = absoluteLockParameters;
              softCoordinateParameters.humanize = 0.25f;
              ModernPitchEngine::ScaleQuantizer softCoordinateQuantizer;
              softCoordinateQuantizer.reset();
              softCoordinateQuantizer.setScale(&liveCoordinateUnison, 1, 440.0);
              ModernPitchEngine::CorrectionState softCoordinateState;
              engine->updateCorrectionState(softCoordinateState,
                                            softCoordinateQuantizer,
                                            liveCoordinateObservation,
                                            softCoordinateParameters);
              const double softReferenceError = std::abs(
                  softCoordinateState.desiredCents - expectedLiveCorrection);
              success &= check(softReferenceError > 1.0,
                               "soft_scale_lock_ignores_live_correction_coordinate");
          '''
          new = '''    // SCALE_CELL_OWNS_SOFTNESS_V1: a softer lock still measures transport
              // from the accepted live F0. Humanize may leave a small target-centred
              // residual, but it cannot switch to a source-authoritative coordinate.
              ModernPitchEngine::Parameters softCoordinateParameters = absoluteLockParameters;
              softCoordinateParameters.humanize = 0.25f;
              ModernPitchEngine::ScaleQuantizer softCoordinateQuantizer;
              softCoordinateQuantizer.reset();
              softCoordinateQuantizer.setScale(&liveCoordinateUnison, 1, 440.0);
              ModernPitchEngine::CorrectionState softCoordinateState;
              engine->updateCorrectionState(softCoordinateState,
                                            softCoordinateQuantizer,
                                            liveCoordinateObservation,
                                            softCoordinateParameters);
              const double softOutputHz = static_cast<double>(
                  liveCoordinateObservation.correctionFrequencyHz)
                  * std::exp2(softCoordinateState.desiredCents / 1200.0);
              const double softResidualCents = std::abs(
                  1200.0 * std::log2(softOutputHz / liveCoordinateTargetHz));
              success &= check(std::abs(softCoordinateState.desiredCents) > 0.5
                               && softResidualCents < 18.1,
                               "soft_scale_lock_uses_live_coordinate_inside_target_cell");
          '''
          if s.count(old) != 1:
              raise SystemExit(f'obsolete soft-lock test matches={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Tests/GuiAudibilityTest.cpp')
          s = p.read_text()
          old_amount = '''    // Amount remains correction depth, never dry/wet.
              auto amountZero = base;
              amountZero.amount = 0.0f;
              const auto noCorrection = render(
                  ModernPitchEngine::LatencyMode::live, amountZero,
                  unison, 440.0, 4.0, steady458);
              success &= check(std::abs(noCorrection.meter.correctionCents) < 0.1f
                               && std::abs(unisonTarget.meter.correctionCents) > 8.0f,
                               "amount_changes_correction_depth");
          '''
          new_amount = '''    // SCALE_CELL_OWNS_SOFTNESS_V1: Amount changes the width of the
              // target-owned tolerance. Even at zero it may not grant unity when
              // the accepted source coordinate is off the owned degree.
              auto amountZero = base;
              amountZero.amount = 0.0f;
              const auto softAmount = render(
                  ModernPitchEngine::LatencyMode::live, amountZero,
                  unison, 440.0, 4.0, steady458);
              success &= check(std::abs(softAmount.meter.correctionCents) > 0.5f,
                               "amount_zero_never_grants_unity_off_target_gui");
              success &= check(std::abs(softAmount.meter.correctionCents)
                                   < std::abs(unisonTarget.meter.correctionCents)
                               && std::abs(softAmount.meter.correctionCents
                                           - unisonTarget.meter.correctionCents) > 2.0f,
                               "amount_changes_scale_owned_tolerance_gui");
          '''
          old_response = '''    // Response changes only trajectory time. This intentionally mirrors the
              // already-proven core-engine invariant instead of inventing a new response
              // curve just to make the control look more dramatic.
              const auto steady452 = [](double) { return 452.0; };
              auto fastResponseParameters = base;
              fastResponseParameters.retuneTimeMs = 0.0f;
              auto slowResponseParameters = base;
              slowResponseParameters.retuneTimeMs = 500.0f;
              const auto fastResponse = render(
                  ModernPitchEngine::LatencyMode::live, fastResponseParameters,
                  unison, 440.0, 0.32, steady452);
              const auto slowResponse = render(
                  ModernPitchEngine::LatencyMode::live, slowResponseParameters,
                  unison, 440.0, 0.32, steady452);
              success &= check(std::abs(fastResponse.meter.correctionCents)
                               > std::abs(slowResponse.meter.correctionCents) + 1.0f,
                               "response_changes_continuous_retune");
          '''
          new_response = '''    // First acquisition is immediately scale-owned. Response is therefore
              // evaluated only after ownership exists, on a real source transition.
              const auto steady452 = [](double) { return 452.0; };
              const auto ownedTransition = [](double seconds)
              {
                  return seconds < 1.0 ? 452.0 : 458.0;
              };
              auto fastResponseParameters = base;
              fastResponseParameters.retuneTimeMs = 0.0f;
              auto slowResponseParameters = base;
              slowResponseParameters.retuneTimeMs = 500.0f;
              const auto fastResponse = render(
                  ModernPitchEngine::LatencyMode::live, fastResponseParameters,
                  unison, 440.0, 1.08, ownedTransition);
              const auto slowResponse = render(
                  ModernPitchEngine::LatencyMode::live, slowResponseParameters,
                  unison, 440.0, 1.08, ownedTransition);
              success &= check(std::abs(fastResponse.meter.correctionCents
                                        - slowResponse.meter.correctionCents) > 0.5f,
                               "response_changes_post_lock_transition_gui");
              success &= check(std::abs(fastResponse.meter.correctionCents) > 0.5f
                               && std::abs(slowResponse.meter.correctionCents) > 0.5f,
                               "response_never_grants_unity_during_owned_transition_gui");
          '''
          if s.count(old_amount) != 1:
              raise SystemExit(f'old amount gui test matches={s.count(old_amount)}')
          if s.count(old_response) != 1:
              raise SystemExit(f'old response gui test matches={s.count(old_response)}')
          s = s.replace(old_amount, new_amount, 1).replace(old_response, new_response, 1)
          p.write_text(s)
          PY

      - name: Verify architecture contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'SCALE_CELL_OWNS_SOFTNESS_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'SOURCE_COORDINATE_REBASE_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'SCALE_CHANGE_REBASE_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'UNOWNED_AUDIO_FAILS_CLOSED_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'NO_UNITY_ESCAPE_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'soft_scale_lock_uses_live_coordinate_inside_target_cell' Tests/SupervisorContinuityTest.cpp
          grep -Fq 'amount_zero_never_grants_unity_off_target_gui' Tests/GuiAudibilityTest.cpp
          grep -Fq 'response_never_grants_unity_during_owned_transition_gui' Tests/GuiAudibilityTest.cpp
          ! grep -Fq 'soft_scale_lock_ignores_live_correction_coordinate' Tests/SupervisorContinuityTest.cpp
          ! grep -Fq 'amount_changes_correction_depth' Tests/GuiAudibilityTest.cpp
          ! grep -Fq 'response_changes_continuous_retune' Tests/GuiAudibilityTest.cpp
          ! grep -Fq 'exactScaleLockAuthority' Source/ModernPitchEngine.cpp
          ! grep -Fq 'exactScaleLockAuthority' Source/ModernPitchEngine.h
          ! grep -Fq 'if (std::abs(errorCents) <= humanWindow)' Source/ModernPitchEngine.cpp
          ! grep -Fq 'errorCents * static_cast<double>(clamp01(parameters.amount))' Source/ModernPitchEngine.cpp
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "7eae364fc8974c10980c21fea739ed66b69b0e56"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure focused tests
        run: cmake -S . -B build-scale-softness -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Build focused tests
        run: cmake --build build-scale-softness --config Release --target CleanModernPitchEngineTest SupervisorContinuityTest SingleWetSpectralRendererTest GuiAudioControlContractTest GuiAudibilityTest --parallel 2

      - name: Run focused tests
        shell: bash
        run: |
          set -euo pipefail
          ./build-scale-softness/clean-engine-tests/CleanModernPitchEngineTest
          ./build-scale-softness/clean-engine-tests/SupervisorContinuityTest
          ./build-scale-softness/clean-engine-tests/SingleWetSpectralRendererTest
          ./build-scale-softness/clean-engine-tests/GuiAudioControlContractTest
          ./build-scale-softness/clean-engine-tests/GuiAudibilityTest

      - name: Build VST3
        run: cmake --build build-scale-softness --config Release --target Neumaton_VST3 --parallel 2

      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/ModernPitchEngine.cpp Source/ModernPitchEngine.h Tests/CleanModernPitchEngineTest.cpp Tests/SupervisorContinuityTest.cpp Tests/GuiAudioControlContractTest.cpp Tests/GuiAudibilityTest.cpp
          git rm -f Tests/MaterializeScaleOwnedSoftnessV1.py .github/workflows/materialize-scale-owned-softness-v1.yml
          git commit -m "Keep every soft correction scale-owned [skip ci]"
          git push origin HEAD:simple-fix-from-quality-baseline
