name: Detector period provenance diagnostic

on:
  push:
    branches:
      - voice-aware-f0-detector-v1
    paths:
      - Tests/InstrumentPeriodProvenanceV1.py
      - Tests/DetectorPeriodProvenanceDiagnostic.cpp
      - .github/workflows/detector-period-provenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-period:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout detector branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard frozen architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          test "$(git hash-object Source/SingleWetSpectralRenderer.h)" = "2b68b3b3d5dc0579cdab94f4969203ef876ef058"
          grep -q 'DETECTOR_VETO_NOT_PERMISSION_V1' Source/ModernPitchEngine.cpp

      - name: Materialize V6.1 and provenance instrumentation in workspace only
        run: |
          python3 Tests/RefinePrimitivePeriodPathGeometryV1.py
          python3 Tests/InstrumentPeriodProvenanceV1.py

      - name: Verify diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AUTHORITATIVE_RESCUE_CORROBORATION_V6_1' Source/ModernPitchEngine.cpp
          grep -q 'PERIOD_PROVENANCE_DIAGNOSTIC_V1' Source/ModernPitchEngine.cpp
          grep -q 'PERIOD_PROVENANCE_DIAGNOSTIC_V1' Source/ModernPitchEngine.h
          ! grep -q 'QUALIFIED_FIRST_MINIMUM_OWNS_PATH_V6_2' Source/ModernPitchEngine.cpp
          changed="$(git diff --name-only | sort)"
          expected=$'Source/ModernPitchEngine.cpp\nSource/ModernPitchEngine.h'
          test "$changed" = "$expected"
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          test "$(git hash-object Source/SingleWetSpectralRenderer.h)" = "2b68b3b3d5dc0579cdab94f4969203ef876ef058"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure diagnostic build
        run: cmake -S . -B build-period-provenance -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Run period provenance diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/SupervisorContinuityTest.original.cpp
          cp Tests/DetectorPeriodProvenanceDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-period-provenance --config Release --parallel 2 --target SupervisorContinuityTest
          ./build-period-provenance/clean-engine-tests/SupervisorContinuityTest | tee /tmp/period-provenance.log
          cp /tmp/SupervisorContinuityTest.original.cpp Tests/SupervisorContinuityTest.cpp

          grep -q 'PERIOD_PROVENANCE' /tmp/period-provenance.log
          grep -q 'PERIOD_CASE target=110' /tmp/period-provenance.log
          grep -q 'PERIOD_CASE target=440' /tmp/period-provenance.log
