name: Probe Dynamic Vibrato Renderer

on:
  push:
    branches: [simple-fix-from-quality-baseline]
    paths:
      - '.github/workflows/probe-dynamic-vibrato-renderer.yml'

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple-fix-from-quality-baseline
      - name: Write dynamic probe
        run: |
          cat > Tests/DynamicVibratoRendererProbe.cpp <<'CPP'
          #include "SingleWetSpectralRenderer.h"
          #include <algorithm>
          #include <cmath>
          #include <iostream>
          #include <vector>
          constexpr double pi = 3.14159265358979323846;
          constexpr double sr = 48000.0;
          double powerAt(const std::vector<float>& x, double hz, int start, int count) {
              double re=0.0, im=0.0;
              for(int i=0;i<count;++i){
                  double ph=2.0*pi*hz*double(start+i)/sr;
                  double v=x[size_t(start+i)]; re += v*std::cos(ph); im -= v*std::sin(ph);
              }
              return re*re+im*im;
          }
          double estimate(const std::vector<float>& x,int start,int count){
              double best=220.0,bp=-1.0;
              for(double f=216.0;f<=224.0001;f+=0.05){ double p=powerAt(x,f,start,count); if(p>bp){bp=p;best=f;} }
              double l=best-0.08,r=best+0.08;
              for(int it=0;it<22;++it){double d=(r-l)/3.0,a=l+d,b=r-d; if(powerAt(x,a,start,count)<powerAt(x,b,start,count)) l=a; else r=b;}
              return 0.5*(l+r);
          }
          int main(){
              for(int frame : {256,512}){
                  SingleWetSpectralRenderer r; r.prepare(sr,frame);
                  const int n=144000; std::vector<float> y(size_t(n)); double phase=0.0;
                  for(int i=0;i<n;++i){
                      double t=double(i)/sr; double cents=70.0*std::sin(2.0*pi*5.0*t);
                      double f=220.0*std::exp2(cents/1200.0); phase += 2.0*pi*f/sr;
                      float in=0.22f*float(std::sin(phase)); y[size_t(i)]=r.processSample(in,-cents,0.9f);
                  }
                  double maxAbsCent=0.0, minRms=1e9, maxRms=0.0, sumAbs=0.0; int blocks=0;
                  const int win=4096, step=2048;
                  for(int s=24000;s+win<n;s+=step){
                      double f=estimate(y,s,win); double c=1200.0*std::log2(f/220.0); maxAbsCent=std::max(maxAbsCent,std::abs(c)); sumAbs+=std::abs(c);
                      double e=0.0; for(int i=0;i<win;++i){double v=y[size_t(s+i)];e+=v*v;} double rms=std::sqrt(e/double(win)); minRms=std::min(minRms,rms);maxRms=std::max(maxRms,rms);++blocks;
                  }
                  std::cout << "frame="<<frame<<" max_abs_cents="<<maxAbsCent<<" mean_abs_cents="<<(sumAbs/std::max(1,blocks))
                            <<" rms_min="<<minRms<<" rms_max="<<maxRms<<" rms_ratio="<<(maxRms/std::max(1e-12,minRms))<<"\n";
              }
              return 0;
          }
          CPP
          cat >> CMakeLists.txt <<'CMAKE'
          if(NEUMATON_BUILD_CLEAN_ENGINE_TESTS)
            juce_add_console_app(DynamicVibratoRendererProbe PRODUCT_NAME DynamicVibratoRendererProbe)
            juce_generate_juce_header(DynamicVibratoRendererProbe)
            target_sources(DynamicVibratoRendererProbe PRIVATE Tests/DynamicVibratoRendererProbe.cpp Source/SingleWetSpectralRenderer.cpp)
            target_include_directories(DynamicVibratoRendererProbe PRIVATE Source)
            target_compile_definitions(DynamicVibratoRendererProbe PRIVATE JUCE_WEB_BROWSER=0 JUCE_USE_CURL=0)
            target_link_libraries(DynamicVibratoRendererProbe PRIVATE juce::juce_core PUBLIC juce::juce_recommended_config_flags juce::juce_recommended_warning_flags)
            set_target_properties(DynamicVibratoRendererProbe PROPERTIES RUNTIME_OUTPUT_DIRECTORY "${CMAKE_BINARY_DIR}/clean-engine-tests")
          endif()
          CMAKE
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev
      - name: Configure
        run: cmake -S . -B build-probe -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON
      - name: Build
        run: cmake --build build-probe --config Release --target DynamicVibratoRendererProbe --parallel 2
      - name: Run
        run: ./build-probe/clean-engine-tests/DynamicVibratoRendererProbe
