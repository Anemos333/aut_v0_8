name: Profile renderer input sanitize ablation v1

on:
  push:
    branches:
      - v1-lean-renderer-input-sanitize-ablation-v1
    paths:
      - Source/SingleWetSpectralRenderer.cpp
      - Tests/RendererCpuBenchmark.cpp
      - .github/workflows/profile-renderer-input-sanitize-ablation-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: v1-lean-renderer-input-sanitize-ablation-v1
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y             libasound2-dev libjack-jackd2-dev ladspa-sdk             libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev             libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Build candidate
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/RendererCpuBenchmark.cpp Tests/SingleWetSpectralRendererTest.cpp
          cmake -S . -B build-candidate             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-candidate --config Release --parallel 2             --target SingleWetSpectralRendererTest >/dev/null

      - name: Build pass4 parent
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/neumaton-renderer-input-parent             cfdbd4eede7955ca4f01570f857a965c216acd8f
          cd /tmp/neumaton-renderer-input-parent
          cp "$GITHUB_WORKSPACE/Tests/RendererCpuBenchmark.cpp" Tests/SingleWetSpectralRendererTest.cpp
          cmake -S . -B build-parent             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-parent --config Release --parallel 2             --target SingleWetSpectralRendererTest >/dev/null

      - name: Interleaved benchmark
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/candidate.log
          : > /tmp/parent.log
          for round in 1 2 3 4 5; do
            if (( round % 2 )); then
              ./build-candidate/clean-engine-tests/SingleWetSpectralRendererTest >> /tmp/candidate.log
              /tmp/neumaton-renderer-input-parent/build-parent/clean-engine-tests/SingleWetSpectralRendererTest >> /tmp/parent.log
            else
              /tmp/neumaton-renderer-input-parent/build-parent/clean-engine-tests/SingleWetSpectralRendererTest >> /tmp/parent.log
              ./build-candidate/clean-engine-tests/SingleWetSpectralRendererTest >> /tmp/candidate.log
            fi
          done

      - name: Compare medians
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, statistics
          def parse(path):
              rows={256:[],512:[]}
              for line in Path(path).read_text().splitlines():
                  if not line.startswith("RENDERER_CPU "):
                      continue
                  d=dict(re.findall(r'(\w+)=([^ ]+)', line))
                  rows[int(d["frame"])].append(float(d["elapsed_ms"]))
              return rows
          c=parse("/tmp/candidate.log"); p=parse("/tmp/parent.log")
          for frame in (256,512):
              cm=statistics.median(c[frame]); pm=statistics.median(p[frame])
              reduction=100.0*(pm-cm)/max(pm,1e-9)
              print("RENDERER_INPUT_SANITIZE_CPU_MEDIAN",
                    f"frame={frame}",f"parent_ms={pm:.3f}",
                    f"candidate_ms={cm:.3f}",f"reduction_pct={reduction:.3f}")
              if cm > pm*1.05:
                  raise SystemExit(f"material CPU regression frame={frame}")
          print("RENDERER_INPUT_SANITIZE_CPU_NO_REGRESSION=PASS")
          PY
