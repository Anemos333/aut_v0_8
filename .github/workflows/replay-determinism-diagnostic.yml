name: Replay determinism diagnostic

on:
  push:
    branches: [voice-aware-f0-detector-v1]
    paths:
      - 'Tests/ReplayDeterminismDiagnostic.cpp'
      - '.github/workflows/replay-determinism-diagnostic.yml'

jobs:
  replay-determinism:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: voice-aware-f0-detector-v1

      - name: Guard golden detector and renderer
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'VOICE_BODY_LIVE_PERMISSION_V6_7_1' Source/ModernPitchEngine.cpp
          ! grep -q 'RESIDUAL_LINE_COHERENCE_CPU_V1' Source/ModernPitchEngine.cpp
          test "$(git hash-object Source/ModernPitchEngine.cpp)" = "6ce24fc21ced2a9633a937217b2992b9ac994d32"
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          test "$(git hash-object Source/SingleWetSpectralRenderer.h)" = "2b68b3b3d5dc0579cdab94f4969203ef876ef058"

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Configure
        run: cmake -S . -B build-replay -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null

      - name: Build replay diagnostic through supervisor target
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/SupervisorContinuityTest.original.cpp
          cp Tests/ReplayDeterminismDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake --build build-replay --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-replay/clean-engine-tests/SupervisorContinuityTest | tee /tmp/replay-determinism.log
          cp /tmp/SupervisorContinuityTest.original.cpp Tests/SupervisorContinuityTest.cpp

      - name: Evaluate replay state dependence
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FRESH_INSTANCE_DETERMINISM=PASS' /tmp/replay-determinism.log
          grep -q 'REPLAY_STATE_DEPENDENCE_PRESENT=YES' /tmp/replay-determinism.log
