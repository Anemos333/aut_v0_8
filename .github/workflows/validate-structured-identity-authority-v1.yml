name: Validate structured identity authority v1

on:
  push:
    branches:
      - voice-aware-f0-parallel-golden-v1
    paths:
      - Tests/ApplyStructuredIdentityAuthority.py
      - Tests/StructuredIdentityAuthorityTest.cpp
      - .github/workflows/validate-structured-identity-authority-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: voice-aware-f0-parallel-golden-v1
          fetch-depth: 0

      - name: Guard diagnostic v2 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Source/ModernPitchEngine.cpp)" = "bc99c8895c570d3ee434667fb0aa6ebf356f7a20"
          test "$(git hash-object Source/ModernPitchEngine.h)" = "e4647f124f5b0253eb1216b62816b2c4dc3a0c30"
          test "$(git hash-object Source/ControlRoomPage.cpp)" = "30b59b7d5a60387b08de41f806e7dfc7b5a32e5f"
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          grep -q 'TARGET_REVISION_DIAGNOSTIC_LATCH_V2' Source/ModernPitchEngine.cpp
          grep -q 'RESIDUAL_HANN_LAZY_MEMOIZATION_V1' Source/ModernPitchEngine.cpp
          ! grep -q 'STRUCTURED_IDENTITY_AUTHORITY_V1' Source/ModernPitchEngine.cpp

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Materialize pre-fix diagnostic baseline
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/neumaton-identity-baseline d80e2dc8f20aa1465b396d8f7e09cf90b41aa214
          cp Tests/StructuredIdentityAuthorityTest.cpp /tmp/neumaton-identity-baseline/Tests/StructuredIdentityAuthorityTest.cpp
          cp Tests/CpuHotspotBenchmark.cpp /tmp/neumaton-identity-baseline/Tests/CpuHotspotBenchmark.cpp

      - name: Prove target chatter regression exists before fix
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/neumaton-identity-baseline
          cp Tests/SupervisorContinuityTest.cpp /tmp/identity-baseline-supervisor.cpp
          cp Tests/StructuredIdentityAuthorityTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-regression -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-regression --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          set +e
          ./build-regression/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/identity-baseline.log
          status=${PIPESTATUS[0]}
          set -e
          cp /tmp/identity-baseline-supervisor.cpp Tests/SupervisorContinuityTest.cpp
          test "$status" -ne 0
          grep -q '^audible_borderline_tail_cannot_gain_new_identity_authority=FAIL$' /tmp/identity-baseline.log
          echo 'STRUCTURED_IDENTITY_REGRESSION_REPRODUCED=PASS'

      - name: Apply structured identity authority candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 Tests/ApplyStructuredIdentityAuthority.py
          test "$(git diff --name-only)" = "Source/ModernPitchEngine.cpp"
          grep -q 'STRUCTURED_IDENTITY_AUTHORITY_V1' Source/ModernPitchEngine.cpp
          grep -q 'TARGET_REVISION_DIAGNOSTIC_LATCH_V2' Source/ModernPitchEngine.cpp
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"

      - name: Verify targeted identity behavior
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/identity-candidate-supervisor.cpp
          cp Tests/StructuredIdentityAuthorityTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-identity -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-identity --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-identity/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/identity-candidate.log
          cp /tmp/identity-candidate-supervisor.cpp Tests/SupervisorContinuityTest.cpp
          grep -q '^audible_borderline_tail_cannot_gain_new_identity_authority=PASS$' /tmp/identity-candidate.log
          grep -q '^borderline_tail_keeps_live_transport=PASS$' /tmp/identity-candidate.log
          grep -q '^strong_structured_legato_commits_promptly_after_tail_veto=PASS$' /tmp/identity-candidate.log
          grep -q '^STRUCTURED_IDENTITY_AUTHORITY=PASS$' /tmp/identity-candidate.log

      - name: Verify detector oracle exact
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/detector-supervisor.cpp
          cp Tests/GoldenDetectorDeterminismTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-detector -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-detector --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          for run in 1 2 3; do
            ./build-detector/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee "/tmp/detector-$run.log"
            grep -q '^GOLDEN_DETECTOR_TRACE_HASH=58273352d40c5499$' "/tmp/detector-$run.log"
          done
          cp /tmp/detector-supervisor.cpp Tests/SupervisorContinuityTest.cpp
          echo 'STRUCTURED_IDENTITY_DETECTOR_EXACT=PASS'

      - name: Verify end to end corpus exact
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SupervisorContinuityTest.cpp /tmp/corpus-supervisor.cpp
          cp Tests/GoldenEngineBehaviorCorpusTest.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-corpus -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-corpus --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          for run in 1 2; do
            ./build-corpus/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee "/tmp/corpus-$run.log"
            grep -q '^GOLDEN_ENGINE_CORPUS_HASH=022ae649ee590533$' "/tmp/corpus-$run.log"
          done
          cp /tmp/corpus-supervisor.cpp Tests/SupervisorContinuityTest.cpp
          echo 'STRUCTURED_IDENTITY_END_TO_END_EXACT=PASS'

      - name: Verify authority renderer and tail contracts
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-contracts -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-contracts --config Release --parallel 2 \
            --target SupervisorContinuityTest CleanModernPitchEngineTest SingleWetSpectralRendererTest >/dev/null
          ./build-contracts/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee /tmp/supervisor.log
          ./build-contracts/clean-engine-tests/CleanModernPitchEngineTest 2>&1 | tee /tmp/engine.log
          ./build-contracts/clean-engine-tests/SingleWetSpectralRendererTest 2>&1 | tee /tmp/renderer.log
          ! grep -q '=FAIL' /tmp/supervisor.log
          ! grep -q '=FAIL' /tmp/engine.log
          ! grep -q '=FAIL' /tmp/renderer.log
          grep -q 'strong_new_note_after_terminal_tail_can_commit_normally=PASS' /tmp/supervisor.log
          grep -q 'transition_detector_wobble_cannot_move_destination=PASS' /tmp/supervisor.log
          grep -q 'falling_terminal_tail_stays_on_previous_degree_and_remains_corrected=PASS' /tmp/supervisor.log
          grep -q 'rising_terminal_tail_stays_on_previous_degree_and_remains_corrected=PASS' /tmp/supervisor.log
          echo 'STRUCTURED_IDENTITY_CONTRACTS=PASS'

      - name: CPU sanity
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/neumaton-identity-baseline
          cp Tests/SupervisorContinuityTest.cpp /tmp/cpu-baseline-supervisor.cpp
          cp Tests/CpuHotspotBenchmark.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-cpu -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-cpu --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          : > /tmp/identity-cpu-baseline.log
          for run in 1 2 3; do
            ./build-cpu/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee -a /tmp/identity-cpu-baseline.log
          done
          cp /tmp/cpu-baseline-supervisor.cpp Tests/SupervisorContinuityTest.cpp

          cd "$GITHUB_WORKSPACE"
          cp Tests/SupervisorContinuityTest.cpp /tmp/cpu-candidate-supervisor.cpp
          cp Tests/CpuHotspotBenchmark.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-cpu-candidate -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-cpu-candidate --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          : > /tmp/identity-cpu-candidate.log
          for run in 1 2 3; do
            ./build-cpu-candidate/clean-engine-tests/SupervisorContinuityTest 2>&1 | tee -a /tmp/identity-cpu-candidate.log
          done
          cp /tmp/cpu-candidate-supervisor.cpp Tests/SupervisorContinuityTest.cpp

          python3 - <<'PY'
          from pathlib import Path
          import re, statistics

          def rows(path):
              out=[]
              for line in Path(path).read_text().splitlines():
                  if line.startswith("CPU_PROFILE "):
                      out.append(dict(re.findall(r'(\w+)=([^ ]+)', line)))
              if len(out) != 9:
                  raise SystemExit(f"{path}: expected 9 rows, got {len(out)}")
              return out

          b=rows('/tmp/identity-cpu-baseline.log')
          c=rows('/tmp/identity-cpu-candidate.log')
          def med(rows, block, key):
              return statistics.median(float(r[key]) for r in rows if int(r['block']) == block)

          worst=0.0
          for block in (64,128,256):
              be=med(b,block,'engine_ms'); ce=med(c,block,'engine_ms')
              bl=med(b,block,'live_ms'); cl=med(c,block,'live_ms')
              ed=(ce/max(be,1e-9)-1.0)*100.0
              ld=(cl/max(bl,1e-9)-1.0)*100.0
              worst=max(worst,ed,ld)
              print('STRUCTURED_IDENTITY_CPU_SANITY',
                    f'block={block}',
                    f'engine_delta_pct={ed:.2f}',
                    f'live_delta_pct={ld:.2f}')
          if worst > 2.0:
              raise SystemExit(f'CPU regression too large: {worst:.2f}%')
          print('STRUCTURED_IDENTITY_CPU_SANITY=PASS')
          PY

      - name: Finish
        run: echo 'STRUCTURED_IDENTITY_VALIDATION=PASS_NO_PROMOTION'
