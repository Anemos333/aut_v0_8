name: Finalize Scale Cage Formatting

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-scale-cage-semantics.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scale-cage-output-v1
          fetch-depth: 0

      - name: Format generated source block
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('Source/ModernPitchEngine.cpp')
          text = path.read_text()
          old = '''        targetValid_ = false;
          quantizer.resetTarget();
          authority_ = 0.0f;
          wetMix_ = 0.0f;
          authorityTarget_ = 0.0f;
          wetMixTarget_ = 0.0f;
          desiredCorrectionCents_ = 0.0;
          synthesisTargetCorrectionCents_ = 0.0;
          currentCorrectionCents_ = 0.0;
          correctionVelocityCentsPerSecond_ = 0.0;
              }'''.replace('          quantizer', 'quantizer').replace('          authority_', 'authority_').replace('          wetMix_', 'wetMix_').replace('          desired', 'desired').replace('          synthesis', 'synthesis').replace('          current', 'current').replace('          correction', 'correction').replace('              }', '    }')
          old = old.replace('\nquantizer', '\nquantizer')
          exact = '''        targetValid_ = false;
quantizer.resetTarget();
authority_ = 0.0f;
wetMix_ = 0.0f;
authorityTarget_ = 0.0f;
wetMixTarget_ = 0.0f;
desiredCorrectionCents_ = 0.0;
synthesisTargetCorrectionCents_ = 0.0;
currentCorrectionCents_ = 0.0;
correctionVelocityCentsPerSecond_ = 0.0;
    }'''
          replacement = '''        targetValid_ = false;
        quantizer.resetTarget();
        authority_ = 0.0f;
        wetMix_ = 0.0f;
        authorityTarget_ = 0.0f;
        wetMixTarget_ = 0.0f;
        desiredCorrectionCents_ = 0.0;
        synthesisTargetCorrectionCents_ = 0.0;
        currentCorrectionCents_ = 0.0;
        correctionVelocityCentsPerSecond_ = 0.0;
    }'''
          if exact not in text:
              raise RuntimeError('generated onset block not found')
          text = text.replace(exact, replacement, 1)
          text = text.replace(
              '// handles transients with soft phase anchoring and wet suppression.',
              '// handles transients with phase reset and full-spectrum transport.',
              1)
          path.write_text(text)
          PY
          grep -q '^        quantizer.resetTarget();$' Source/ModernPitchEngine.cpp
          grep -q 'full-spectrum transport' Source/ModernPitchEngine.cpp

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/ModernPitchEngine.cpp
          git commit -m 'Format final scale-cage controller changes'
          git push origin HEAD:scale-cage-output-v1
