name: Profile tracker sanitize ablation v1

on:
  push:
    branches:
      - v1-lean-tracker-sanitize-ablation-v1
    paths:
      - Source/ModernPitchEngine.cpp
      - Tests/CpuHotspotBenchmark.cpp
      - .github/workflows/profile-tracker-sanitize-ablation-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: v1-lean-tracker-sanitize-ablation-v1
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y             libasound2-dev libjack-jackd2-dev ladspa-sdk             libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev             libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Build candidate benchmark
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/CpuHotspotBenchmark.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-candidate             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-candidate --config Release --parallel 2             --target SupervisorContinuityTest >/dev/null

      - name: Build pass4 parent benchmark
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/neumaton-parent             cfdbd4eede7955ca4f01570f857a965c216acd8f
          cd /tmp/neumaton-parent
          cp "$GITHUB_WORKSPACE/Tests/CpuHotspotBenchmark.cpp"             Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-parent             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-parent --config Release --parallel 2             --target SupervisorContinuityTest >/dev/null

      - name: Interleaved benchmark
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/candidate.log
          : > /tmp/parent.log
          for round in 1 2 3; do
            if (( round % 2 )); then
              ./build-candidate/clean-engine-tests/SupervisorContinuityTest >> /tmp/candidate.log
              /tmp/neumaton-parent/build-parent/clean-engine-tests/SupervisorContinuityTest >> /tmp/parent.log
            else
              /tmp/neumaton-parent/build-parent/clean-engine-tests/SupervisorContinuityTest >> /tmp/parent.log
              ./build-candidate/clean-engine-tests/SupervisorContinuityTest >> /tmp/candidate.log
            fi
          done
          cat /tmp/candidate.log
          cat /tmp/parent.log

      - name: Compare medians
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, statistics

          def parse(path):
              rows={64:[],128:[],256:[]}
              for line in Path(path).read_text().splitlines():
                  if not line.startswith("CPU_PROFILE "):
                      continue
                  d=dict(re.findall(r'(\w+)=([^ ]+)', line))
                  rows[int(d["block"])].append({
                      "tracker":float(d["tracker_ms"]),
                      "engine":float(d["engine_ms"]),
                      "live":float(d["live_ms"])
                  })
              return rows

          c=parse("/tmp/candidate.log")
          p=parse("/tmp/parent.log")
          for block in (64,128,256):
              if len(c[block]) != 3 or len(p[block]) != 3:
                  raise SystemExit(f"missing rows block={block}")
              for key in ("tracker","engine","live"):
                  cm=statistics.median(x[key] for x in c[block])
                  pm=statistics.median(x[key] for x in p[block])
                  reduction=100.0*(pm-cm)/max(pm,1e-9)
                  print("TRACKER_SANITIZE_CPU_MEDIAN",
                        f"block={block}", f"path={key}",
                        f"parent_ms={pm:.3f}", f"candidate_ms={cm:.3f}",
                        f"reduction_pct={reduction:.3f}")
                  if cm > pm * 1.05:
                      raise SystemExit(f"material CPU regression block={block} path={key}")
          print("TRACKER_SANITIZE_CPU_NO_REGRESSION=PASS")
          PY
