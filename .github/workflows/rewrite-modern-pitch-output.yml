name: Rewrite ModernPitch Output

on:
  push:
    branches:
      - modern-pitch-engine-output-rewrite
    paths:
      - 'Tools/rewrite_payload/**'
      - 'Tools/apply_modern_pitch_output_rewrite.py'
      - '.github/workflows/rewrite-modern-pitch-output.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modern-pitch-engine-output-rewrite
          fetch-depth: 0
      - name: Apply structural replacement
        run: python Tools/apply_modern_pitch_output_rewrite.py
      - name: Verify generated structure
        run: |
          test "$(wc -l < Source/ModernPitchEngine.cpp)" -lt 5000
          test -f Source/ModernPitchOutputStage.cpp
          ! grep -q 'SynthesisLayer' Source/ModernPitchEngine.h
          ! grep -q 'dryTrust_' Source/ModernPitchEngine.h
          ! grep -q 'synthesiseLayer' Source/ModernPitchEngine.cpp
      - name: Commit generated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace legacy output machinery with single-spectrum stage'
          git push origin HEAD:modern-pitch-engine-output-rewrite
