name: Apply Simple Authority Cleanup

on:
  push:
    branches: [simple-fix-from-quality-baseline]
    paths:
      - '.github/workflows/apply-simple-authority-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple-fix-from-quality-baseline
          fetch-depth: 0

      - name: Remove remaining hidden target prudence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Source/ModernPitchEngine.cpp')
          s = p.read_text()
          def r(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new,1)

          r('''bool ModernPitchEngine::zeroPrudenceAuthority(const Parameters& parameters) noexcept
{
    return exactScaleLockAuthority(parameters)
        && std::clamp(static_cast<double>(finiteOr(parameters.retuneTimeMs, 50.0f)),
                      0.0, 500.0) <= 0.00001
        && std::clamp(static_cast<double>(finiteOr(parameters.lockHysteresis, 24.0f)),
                      0.0, 80.0) <= 0.00001;
}
''','''bool ModernPitchEngine::zeroPrudenceAuthority(const Parameters& parameters) noexcept
{
    // Hold is the only user permission to retain the previous target degree.
    // Response controls glide speed only and cannot weaken target authority.
    return exactScaleLockAuthority(parameters)
        && std::clamp(static_cast<double>(finiteOr(parameters.lockHysteresis, 24.0f)),
                      0.0, 80.0) <= 0.00001;
}
''','zero prudence')

          r('''    if (zeroPrudenceAuthority(parameters))
        return 0.0; // AUTHORITY_CONTROLS_EXPLICIT_V1: Response=0 is literal.
    double response = std::max(0.35, requested);
''','''    if (requested <= 0.00001)
        return 0.0; // Response=0 is literal and independent from target authority.
    double response = std::max(0.35, requested);
''','response')

          r('''    float modeFactor = 0.78f;
    switch (latencyMode_)
    {
        case LatencyMode::quality:   modeFactor = 1.15f; break;
        case LatencyMode::live:      modeFactor = 0.78f; break;
        case LatencyMode::ultraLive: modeFactor = 0.42f; break;
    }
    const float tempoFactor = parameters.tempo.mode == CreativeTempo::Mode::glideLock
        ? 1.50f : parameters.tempo.mode == CreativeTempo::Mode::tempoGlide
        ? 1.12f : 1.0f;
    const float densityFactor = std::clamp(
        std::sqrt(std::max(0.1f, quantizer.minimumStepCents()) / 100.0f)
            * (1.0f - 0.32f * quantizer.asymmetry()),
        0.22f, 1.40f);
    const float confidenceFactor = 0.65f + 0.70f * clamp01(observation.confidence);
    const float lockStrictness = clamp01(parameters.lockStrictness);
    const float strictnessFactor = 1.0f - 0.28f * lockStrictness;
    const float requestedHysteresis = std::clamp(
        finiteOr(parameters.lockHysteresis, 24.0f)
            * modeFactor * tempoFactor * densityFactor
            * confidenceFactor * strictnessFactor,
        0.0f, 80.0f);
''','''    // No mode, tempo, confidence or detector-derived multiplier may add Hold.
    const float lockStrictness = clamp01(parameters.lockStrictness);
    const float requestedHysteresis = std::clamp(
        finiteOr(parameters.lockHysteresis, 24.0f), 0.0f, 80.0f);
''','adaptive hysteresis')

          r('''    const double jumpCents = std::abs(nearest - targetLog2_) * 1200.0;
    if (!hardLock || jumpCents < 0.5)
    {
        targetLog2_ = nearest;
        pendingValid_ = false;
        pendingCount_ = 0;
        return targetLog2_;
    }

    if (pendingValid_ && std::abs(pendingLog2_ - nearest) * 1200.0 < 2.0)
        ++pendingCount_;
    else
    {
        pendingValid_ = true;
        pendingLog2_ = nearest;
        pendingCount_ = 1;
    }

    const float safeStrictness = ModernPitchEngine::clamp01(strictness);
    const float safeConfidence = ModernPitchEngine::clamp01(confidence);
    const int required = 1 + static_cast<int>(std::lround(
        2.0f * safeStrictness + 1.5f * (1.0f - safeConfidence)));
    pendingObservations = pendingCount_;
    if (pendingCount_ >= required)
    {
        targetLog2_ = pendingLog2_;
        pendingValid_ = false;
        pendingCount_ = 0;
        pendingObservations = 0;
    }
    return targetLog2_;
''','''    // After the explicit Hold boundary is crossed, the nearest scale degree
    // wins immediately. Evidence quality may rank F0 candidates, never veto the
    // already-selected musical target.
    (void) strictness;
    (void) confidence;
    (void) hardLock;
    targetLog2_ = nearest;
    pendingValid_ = false;
    pendingCount_ = 0;
    return targetLog2_;
''','quantizer confirmation')

          p.write_text(s)
          PY

      - name: Verify frozen simple renderer and authority contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'TARGET_AUTHORITY_TAIL_HOLD_V1' Source/ModernPitchEngine.cpp
          ! grep -Fq 'modeFactor = 1.15f' Source/ModernPitchEngine.cpp
          ! grep -Fq 'confidenceFactor = 0.65f' Source/ModernPitchEngine.cpp
          ! grep -Fq '2.0f * safeStrictness + 1.5f * (1.0f - safeConfidence)' Source/ModernPitchEngine.cpp
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "3080ba804cb038421b075d76f5eceec335c22396"
          grep -Fq 'const double targetPosition = static_cast<double>(sourceBin) * safeRatio;' Source/SingleWetSpectralRenderer.cpp
          grep -Fq 'const float safeFormant = clamp01(formantPreservation);' Source/SingleWetSpectralRenderer.cpp

      - name: Commit real source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/ModernPitchEngine.cpp
          git rm .github/workflows/apply-simple-authority-cleanup.yml
          git commit -m 'Remove hidden target prudence from rigid correction'
          git push origin HEAD:simple-fix-from-quality-baseline
