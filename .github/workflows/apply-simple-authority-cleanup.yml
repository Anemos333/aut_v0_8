name: Apply Simple Authority Cleanup

on:
  push:
    branches: [simple-fix-from-quality-baseline]
    paths:
      - '.github/workflows/apply-simple-authority-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple-fix-from-quality-baseline
          fetch-depth: 0

      - name: Remove hidden prudence and zero-return tail
        shell: python
        run: |
          from pathlib import Path
          p = Path('Source/ModernPitchEngine.cpp')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          replace_once(
'''bool ModernPitchEngine::zeroPrudenceAuthority(const Parameters& parameters) noexcept
{
    return exactScaleLockAuthority(parameters)
        && std::clamp(static_cast<double>(finiteOr(parameters.retuneTimeMs, 50.0f)),
                      0.0, 500.0) <= 0.00001
        && std::clamp(static_cast<double>(finiteOr(parameters.lockHysteresis, 24.0f)),
                      0.0, 80.0) <= 0.00001;
}
''',
'''bool ModernPitchEngine::zeroPrudenceAuthority(const Parameters& parameters) noexcept
{
    // Target authority and glide speed are independent user decisions.
    // With rigid correction and Hold=0 there is no hidden target prudence,
    // regardless of the user-selected Response time.
    return exactScaleLockAuthority(parameters)
        && std::clamp(static_cast<double>(finiteOr(parameters.lockHysteresis, 24.0f)),
                      0.0, 80.0) <= 0.00001;
}
''', 'zeroPrudenceAuthority')

          replace_once(
'''    if (zeroPrudenceAuthority(parameters))
        return 0.0; // AUTHORITY_CONTROLS_EXPLICIT_V1: Response=0 is literal.
    double response = std::max(0.35, requested);
''',
'''    if (requested <= 0.00001)
        return 0.0; // Response=0 is literal; target authority does not override user timing.
    double response = std::max(0.35, requested);
''', 'response separation')

          old = '''    float modeFactor = 0.78f;
    switch (latencyMode_)
    {
        case LatencyMode::quality:   modeFactor = 1.15f; break;
        case LatencyMode::live:      modeFactor = 0.78f; break;
        case LatencyMode::ultraLive: modeFactor = 0.42f; break;
    }
    const float tempoFactor = parameters.tempo.mode == CreativeTempo::Mode::glideLock
        ? 1.50f : parameters.tempo.mode == CreativeTempo::Mode::tempoGlide
        ? 1.12f : 1.0f;
    const float densityFactor = std::clamp(
        std::sqrt(std::max(0.1f, quantizer.minimumStepCents()) / 100.0f)
            * (1.0f - 0.32f * quantizer.asymmetry()),
        0.22f, 1.40f);
    const float confidenceFactor = 0.65f + 0.70f * clamp01(observation.confidence);
    const float lockStrictness = clamp01(parameters.lockStrictness);
    const float strictnessFactor = 1.0f - 0.28f * lockStrictness;
    const float requestedHysteresis = std::clamp(
        finiteOr(parameters.lockHysteresis, 24.0f)
            * modeFactor * tempoFactor * densityFactor
            * confidenceFactor * strictnessFactor,
        0.0f, 80.0f);
'''
          new = '''    // Hold is the only permission to retain the previous scale degree.
    // Mode, tempo, confidence and detector evidence may not add hidden prudence.
    const float lockStrictness = clamp01(parameters.lockStrictness);
    const float requestedHysteresis = std::clamp(
        finiteOr(parameters.lockHysteresis, 24.0f), 0.0f, 80.0f);
'''
          replace_once(old, new, 'adaptiveHysteresis hidden factors')

          old = '''    const double jumpCents = std::abs(nearest - targetLog2_) * 1200.0;
    if (!hardLock || jumpCents < 0.5)
    {
        targetLog2_ = nearest;
        pendingValid_ = false;
        pendingCount_ = 0;
        return targetLog2_;
    }

    if (pendingValid_ && std::abs(pendingLog2_ - nearest) * 1200.0 < 2.0)
        ++pendingCount_;
    else
    {
        pendingValid_ = true;
        pendingLog2_ = nearest;
        pendingCount_ = 1;
    }

    const float safeStrictness = ModernPitchEngine::clamp01(strictness);
    const float safeConfidence = ModernPitchEngine::clamp01(confidence);
    const int required = 1 + static_cast<int>(std::lround(
        2.0f * safeStrictness + 1.5f * (1.0f - safeConfidence)));
    pendingObservations = pendingCount_;
    if (pendingCount_ >= required)
    {
        targetLog2_ = pendingLog2_;
        pendingValid_ = false;
        pendingCount_ = 0;
        pendingObservations = 0;
    }
    return targetLog2_;
'''
          new = '''    // Once the explicit Hold margin has been crossed, the nearest degree wins
    // immediately. Confidence/consensus/strictness are evidence descriptors,
    // not permission to keep an out-of-target note.
    (void) strictness;
    (void) confidence;
    (void) hardLock;
    targetLog2_ = nearest;
    pendingValid_ = false;
    pendingCount_ = 0;
    return targetLog2_;
'''
          replace_once(old, new, 'quantizer confirmation prudence')

          old = '''    if (state.targetValid && (confirmedBreath || confirmedAbsence))
    {
        setState(TrackingState::release);
        state.desiredCents = 0.0;
        state.stableBodyObservations = 0;
        const double protection = static_cast<double>(
            clamp01(parameters.transientProtection));
        state.responseMs = std::clamp(32.0 - 20.0 * protection,
                                      8.0, 32.0);
        if (confirmedAbsence
            || state.breathEvidenceSamples > static_cast<int>(0.12 * sampleRate_))
        {
            state.pitchCentreValid = false;
        }
        return;
    }
'''
          new = '''    if (state.targetValid && (confirmedBreath || confirmedAbsence))
    {
        // A breath/noise tail belongs to the note that was already acquired.
        // Never relax the spectral translation back toward the original pitch.
        setState(TrackingState::release);
        state.stableBodyObservations = 0;
        if (confirmedAbsence
            || state.breathEvidenceSamples > static_cast<int>(0.12 * sampleRate_))
        {
            state.pitchCentreValid = false;
        }
        return;
    }
'''
          replace_once(old, new, 'breath tail zero return')

          old = '''        if (state.targetValid && std::abs(state.currentCents) > 0.001)
        {
            setState(TrackingState::release);
            state.desiredCents = 0.0;
            state.responseMs = std::clamp(32.0 - 20.0
                * static_cast<double>(clamp01(parameters.transientProtection)),
                8.0, 32.0);
        }
        else
        {
            setState(TrackingState::unvoiced);
        }
        return;
'''
          new = '''        if (state.targetValid)
        {
            // Silence or pitchless material after a valid note keeps the last
            // acquired translation. The next valid note will replace it.
            setState(TrackingState::release);
        }
        else
        {
            setState(TrackingState::unvoiced);
        }
        return;
'''
          replace_once(old, new, 'invalid pitch zero return')

          replace_once(
'''        setState(TrackingState::unvoiced);
        state.desiredCents = 0.0;
        return;
''',
'''        setState(TrackingState::unvoiced);
        // No acquired target is weakened here; detector evidence cannot pull
        // an existing correction back toward the source pitch.
        return;
''', 'pre-body breath reset')

          p.write_text(s)

      - name: Verify subtractive contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('Source/ModernPitchEngine.cpp').read_text()
          assert 'modeFactor = 1.15f' not in s
          assert 'confidenceFactor = 0.65f' not in s
          assert '2.0f * safeStrictness + 1.5f * (1.0f - safeConfidence)' not in s
          assert 'state.desiredCents = 0.0;' not in s
          r = Path('Source/SingleWetSpectralRenderer.cpp').read_text()
          assert 'const double targetPosition = static_cast<double>(sourceBin) * safeRatio;' in r
          assert 'const float safeFormant = clamp01(formantPreservation);' in r
          print('SIMPLE_AUTHORITY_CONTRACT=PASS')
          PY

      - name: Commit real source change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Source/ModernPitchEngine.cpp
          git commit -m "Remove hidden pitch prudence and keep tail on target"
          git push origin HEAD:simple-fix-from-quality-baseline
