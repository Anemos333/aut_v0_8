name: Profile v1 lean architecture pass2 renderer CPU

on:
  push:
    branches:
      - v1-lean-architecture-pass2
    paths:
      - Source/SingleWetSpectralRenderer.cpp
      - Source/SingleWetSpectralRenderer.h
      - Tests/RendererCpuBenchmark.cpp
      - .github/workflows/profile-v1-lean-architecture-pass2-renderer-cpu.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: v1-lean-architecture-pass2
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y             libasound2-dev libjack-jackd2-dev ladspa-sdk             libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev             libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Build candidate benchmark
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/RendererCpuBenchmark.cpp Tests/SingleWetSpectralRendererTest.cpp
          cmake -S . -B build-candidate             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-candidate --config Release --parallel 2             --target SingleWetSpectralRendererTest >/dev/null

      - name: Build pass1 parent benchmark
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/neumaton-pass1-cpu             d7995cf9b56c5f2dbd2e3759f64f19c1c93c0425
          cd /tmp/neumaton-pass1-cpu
          cp "$GITHUB_WORKSPACE/Tests/RendererCpuBenchmark.cpp"             Tests/SingleWetSpectralRendererTest.cpp
          cmake -S . -B build-parent             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-parent --config Release --parallel 2             --target SingleWetSpectralRendererTest >/dev/null

      - name: Interleaved benchmark
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/candidate.log
          : > /tmp/parent.log
          for round in 1 2 3 4 5 6 7; do
            if (( round % 2 )); then
              ./build-candidate/clean-engine-tests/SingleWetSpectralRendererTest >> /tmp/candidate.log
              /tmp/neumaton-pass1-cpu/build-parent/clean-engine-tests/SingleWetSpectralRendererTest >> /tmp/parent.log
            else
              /tmp/neumaton-pass1-cpu/build-parent/clean-engine-tests/SingleWetSpectralRendererTest >> /tmp/parent.log
              ./build-candidate/clean-engine-tests/SingleWetSpectralRendererTest >> /tmp/candidate.log
            fi
          done
          cat /tmp/candidate.log
          cat /tmp/parent.log

      - name: Compare medians
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, statistics

          def rows(path):
              out={256:[],512:[]}
              for line in Path(path).read_text().splitlines():
                  if not line.startswith("RENDERER_CPU "):
                      continue
                  d=dict(re.findall(r'(\w+)=([^ ]+)', line))
                  out[int(d["frame"])].append(float(d["elapsed_ms"]))
              return out

          candidate=rows("/tmp/candidate.log")
          parent=rows("/tmp/parent.log")
          for frame in (256,512):
              if len(candidate[frame]) != 7 or len(parent[frame]) != 7:
                  raise SystemExit("missing benchmark rows")
              c=statistics.median(candidate[frame])
              p=statistics.median(parent[frame])
              reduction=100.0*(p-c)/max(p,1e-9)
              print("LEAN_PASS2_RENDERER_CPU",
                    f"frame={frame}",
                    f"pass1_ms={p:.3f}",
                    f"pass2_ms={c:.3f}",
                    f"reduction_pct={reduction:.3f}")
              if c > p * 1.05:
                  raise SystemExit(
                      f"material CPU regression frame={frame}: {c:.3f} > {p:.3f}")
          print("LEAN_PASS2_RENDERER_CPU_NO_REGRESSION=PASS")
          PY

      - name: Final marker
        run: echo 'V1_LEAN_PASS2_RENDERER_CPU_PROFILE=COMPLETE'
