name: Refine Experimental V5 Coherence Neighborhood

on:
  push:
    branches:
      - quality-tail-glide-experimental-128-v3
    paths:
      - .github/workflows/probe-experimental-v5-coherence-refine.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refine:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Sweep local coherence neighborhood
        shell: bash
        run: |
          set -euo pipefail
          printf 'coherence,lock,source_ratio,mae_ct,rms_ct,max_ct,h1,h2,h3,h4,h5,h6,h7,h8\n' > summary.csv
          for coherence in 0.80 0.825 0.85 0.875 0.90; do
            for lock in 0.75 0.80 0.85 0.90 0.95; do
              git checkout -- Source/SingleWetSpectralRenderer.cpp
              NEUMATON_COHERENCE_SCALE="$coherence" NEUMATON_LOCK_SCALE="$lock" \
                python3 Tests/ExperimentalV5CoherenceSweep.py >/dev/null
              g++ -std=c++17 -O2 \
                Tests/SingleWetSpectralRendererTest.cpp \
                Source/SingleWetSpectralRenderer.cpp \
                -ISource -o experimental_refine_test
              set +e
              ./experimental_refine_test > result.log 2>&1
              set -e
              python3 - "$coherence" "$lock" >> summary.csv <<'PY'
          import math, re, sys
          text = open('result.log', encoding='utf-8').read()
          c, l = sys.argv[1:3]
          ratio_m = re.search(r'experimental_128_shifted_harmonic_family_ratio=([-+0-9.eE]+)', text)
          vals = []
          for h in range(1, 9):
              m = re.search(rf'experimental_128_harmonic_{h}_error_cents=([-+0-9.eE]+)', text)
              if not m:
                  raise SystemExit(f'missing H{h}')
              vals.append(float(m.group(1)))
          ratio = float(ratio_m.group(1)) if ratio_m else float('nan')
          absvals = [abs(v) for v in vals]
          mae = sum(absvals) / len(absvals)
          rms = math.sqrt(sum(v*v for v in vals) / len(vals))
          print(','.join([c,l,f'{ratio:.6f}',f'{mae:.6f}',f'{rms:.6f}',f'{max(absvals):.6f}'] + [f'{v:.6f}' for v in vals]))
          PY
            done
          done
          git checkout -- Source/SingleWetSpectralRenderer.cpp
          echo '--- SORTED BY RMS ---'
          { head -n1 summary.csv; tail -n +2 summary.csv | sort -t, -k5,5n; } | head -n 13
          echo '--- SORTED BY MAX ERROR ---'
          { head -n1 summary.csv; tail -n +2 summary.csv | sort -t, -k6,6n; } | head -n 13
