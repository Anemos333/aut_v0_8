name: Probe Peak Threshold Only

on:
  push:
    branches:
      - one-voice-unified-spectrum-v10
    paths:
      - Tests/PeakThresholdOnlyProbe.py
      - Tests/UnifiedSpectrumV10Probe.cpp
      - .github/workflows/probe-peak-threshold-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove air/noise peak threshold only
        run: python3 Tests/PeakThresholdOnlyProbe.py
      - name: Build focused probe
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic \
            Tests/UnifiedSpectrumV10Probe.cpp Source/SingleWetSpectralRenderer.cpp \
            -o /tmp/threshold-only
      - name: Run focused probe
        shell: bash
        run: |
          set +e
          /tmp/threshold-only 2>&1 | tee result.log
          echo "probe_exit=${PIPESTATUS[0]}"
          exit 0
