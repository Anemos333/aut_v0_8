name: Probe progressive whole-note acquisition
on:
  push:
    branches: [v1-f0-demolish-and-rebuild-v1]
    paths:
      - Tests/F0WholeNoteProgressiveProbe.cpp
      - Tests/F0WholeNoteTunerProbe.cpp
      - Tests/F0VoiceLikeStressProbe.cpp
      - Tests/F0HarmonicFamilyProbe.cpp
      - .github/workflows/probe-f0-whole-note-progressive.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: v1-f0-demolish-and-rebuild-v1 }
      - name: Build progressive whole-note probe
        run: |
          g++ -std=c++17 -O3 -Wall -Wextra -Wpedantic \
              Tests/F0WholeNoteProgressiveProbe.cpp \
              -o /tmp/f0-whole-note-progressive
      - name: Run diagnostic
        run: |
          /tmp/f0-whole-note-progressive | tee /tmp/f0-whole-note-progressive.log
          grep '^PROGRESSIVE_SUMMARY' /tmp/f0-whole-note-progressive.log
