name: Materialize Scale Always Authority V1

on:
  push:
    branches: [scale-always-authority-v1]
    paths:
      - 'Tests/MaterializeScaleAlwaysAuthorityV1.py'
      - '.github/workflows/materialize-scale-always-authority-v1.yml'

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scale-always-authority-v1
          fetch-depth: 0

      - name: Guard detector renderer and tempo
        run: |
          set -euo pipefail
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "7eae364fc8974c10980c21fea739ed66b69b0e56"
          test "$(git hash-object Source/Tempo.cpp)" = "53558aa5dd3d573e50f5fdd39384d06fb0217191"

      - name: Materialize scale authority fix
        run: python3 Tests/MaterializeScaleAlwaysAuthorityV1.py

      - name: Verify narrow semantic contract
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'HOLD_IS_EXPLICIT_EVERYWHERE_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'NO_HIDDEN_PRUDENCE_OUTSIDE_LOCK_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'BREATH_IS_TARGETED_NOT_DRY_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'LATENT_IDENTITY_NEVER_FREEZES_WET_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'SINGLE_VISIBLE_VIBRATO_AUTHORITY_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'SCALE_LOCK_NEVER_OWNS_DEPTH_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'visible_vibrato_zero_removes_hidden_nonlock_preserve' Tests/SupervisorContinuityTest.cpp
          grep -Fq 'breathy_valid_f0_stays_on_owned_scale_target' Tests/SupervisorContinuityTest.cpp
          grep -Fq 'pending_identity_never_freezes_owned_wet_transport' Tests/SupervisorContinuityTest.cpp
          ! grep -Fq '0.70f,   // preserveVibrato' Source/PluginProcessor.cpp
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "7eae364fc8974c10980c21fea739ed66b69b0e56"
          test "$(git hash-object Source/Tempo.cpp)" = "53558aa5dd3d573e50f5fdd39384d06fb0217191"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          before = subprocess.check_output(['git','show','HEAD:Source/ModernPitchEngine.cpp'], text=True)
          after = Path('Source/ModernPitchEngine.cpp').read_text()
          marker = '// ModernPitchEngine control and processing'
          assert marker in before and marker in after
          assert before.split(marker, 1)[0] == after.split(marker, 1)[0], \
              'detector/tracker changed: forbidden for this intervention'
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          allowed = {
              'Source/ModernPitchEngine.cpp',
              'Source/LivePitchProcessor.h',
              'Source/PluginProcessor.cpp',
              'Tests/SupervisorContinuityTest.cpp'
          }
          assert changed <= allowed, f'unexpected materialized files: {sorted(changed - allowed)}'
          PY

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure focused tests
        run: cmake -S . -B build-scale-authority -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Build focused tests
        run: cmake --build build-scale-authority --config Release --target CleanModernPitchEngineTest SupervisorContinuityTest SingleWetSpectralRendererTest GuiAudioControlContractTest GuiAudibilityTest --parallel 2

      - name: Run focused tests
        run: |
          set -euo pipefail
          ./build-scale-authority/clean-engine-tests/CleanModernPitchEngineTest
          ./build-scale-authority/clean-engine-tests/SupervisorContinuityTest
          ./build-scale-authority/clean-engine-tests/SingleWetSpectralRendererTest
          ./build-scale-authority/clean-engine-tests/GuiAudioControlContractTest
          ./build-scale-authority/clean-engine-tests/GuiAudibilityTest

      - name: Build VST3
        run: cmake --build build-scale-authority --config Release --target Neumaton_VST3 --parallel 2

      - name: Commit validated scale authority fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f Tests/MaterializeScaleAlwaysAuthorityV1.py
          rm -f .github/workflows/materialize-scale-always-authority-v1.yml
          git add -A Source/ModernPitchEngine.cpp Source/LivePitchProcessor.h Source/PluginProcessor.cpp Tests/SupervisorContinuityTest.cpp Tests/MaterializeScaleAlwaysAuthorityV1.py .github/workflows/materialize-scale-always-authority-v1.yml
          git commit -m 'Make scale authority universal and explicit [skip ci]'
          git push origin HEAD:scale-always-authority-v1
