name: Diagnose subframe phase second observation v1

on:
  push:
    branches:
      - v1-continuous-f0-contract-v1
    paths:
      - Tests/SubframePhaseSecondObservationDiagnostic.cpp
      - .github/workflows/diagnose-subframe-phase-second-observation-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1-continuous-f0-contract-v1
      - name: Dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y             libasound2-dev libjack-jackd2-dev ladspa-sdk             libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev             libglu1-mesa-dev mesa-common-dev >/dev/null
      - name: Build and run
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/SubframePhaseSecondObservationDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-subframe-phase             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-subframe-phase --config Release --parallel 2             --target SupervisorContinuityTest >/dev/null
          ./build-subframe-phase/clean-engine-tests/SupervisorContinuityTest             | tee /tmp/subframe-phase.log
          grep -q '^SUBFRAME_PHASE_SECOND ' /tmp/subframe-phase.log
      - name: Summarize
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, statistics
          rows=[]
          for line in Path('/tmp/subframe-phase.log').read_text().splitlines():
              if not line.startswith('SUBFRAME_PHASE_SECOND '):
                  continue
              d=dict(re.findall(r'(\w+)=([^ ]+)', line))
              for k in ['radius','proposal_error','source_error','source_us',
                        'residual_error','residual_us']:
                  d[k]=float(d[k])
              for k in ['source_pass','source_improves','residual_pass','residual_improves']:
                  d[k]=int(d[k])
              rows.append(d)

          for mode in ['source','residual']:
              for radius in sorted({r['radius'] for r in rows}):
                  sub=[r for r in rows if r['radius']==radius]
                  errors=[abs(r[f'{mode}_error']) for r in sub]
                  print(
                      'SUBFRAME_PHASE_SUMMARY'
                      f' mode={mode}'
                      f' radius={radius:.1f}'
                      f' cases={len(sub)}'
                      f' improve_fraction={sum(r[f"{mode}_improves"] for r in sub)/len(sub):.6f}'
                      f' pass_1p5_fraction={sum(r[f"{mode}_pass"] for r in sub)/len(sub):.6f}'
                      f' median_abs_cents={statistics.median(errors):.6f}'
                      f' worst_abs_cents={max(errors):.6f}'
                      f' median_us={statistics.median(r[f"{mode}_us"] for r in sub):.6f}'
                  )
          PY
