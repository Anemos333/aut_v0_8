name: Promote validated target revision diagnostic latch v1

on:
  push:
    branches:
      - voice-aware-f0-parallel-golden-v1
    paths:
      - .github/workflows/promote-validated-target-revision-diagnostic-latch-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
        with:
          ref: voice-aware-f0-parallel-golden-v1
          fetch-depth: 0

      - name: Guard exact fa40 validated baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Source/ModernPitchEngine.cpp)" = "0f81530ea2d0ac7fd02d7ee8f7f6afa13e668535"
          test "$(git hash-object Source/ModernPitchEngine.h)" = "f6a10ad1134c3672d9d7706f6cc5ab7598d424b1"
          test "$(git hash-object Source/ControlRoomPage.cpp)" = "9695c760b3d21c9865c27a47c19d08ee32d55514"
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"
          grep -q 'RESIDUAL_HANN_LAZY_MEMOIZATION_V1' Source/ModernPitchEngine.cpp
          grep -q 'TERMINAL_TAIL_STABLE_TRANSPORT_REBASE_V1' Source/ModernPitchEngine.cpp
          ! grep -q 'TARGET_REVISION_DIAGNOSTIC_LATCH_V1' Source/ModernPitchEngine.cpp
          ! grep -q 'LAG_CORRELATION_MEMOIZATION_V1' Source/ModernPitchEngine.cpp
          ! grep -q 'RESIDUAL_LINE_INVARIANT_HOIST_V1' Source/ModernPitchEngine.cpp

      - name: Apply validated passive diagnostic latch
        shell: bash
        run: |
          set -euo pipefail
          python3 Tests/ApplyTargetRevisionDiagnosticLatch.py
          changed="$(git diff --name-only)"
          test "$changed" = $'Source/ControlRoomPage.cpp\nSource/ModernPitchEngine.cpp\nSource/ModernPitchEngine.h'
          grep -q 'TARGET_REVISION_DIAGNOSTIC_LATCH_V1' Source/ModernPitchEngine.cpp
          grep -q 'TARGET_REVISION_DIAGNOSTIC_LATCH_V1' Source/ModernPitchEngine.h
          grep -q 'TARGET_REVISION_DIAGNOSTIC_LATCH_V1' Source/ControlRoomPage.cpp
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "051721f1d740e95e23f740353ad5df9dc6fefb3c"

      - name: Commit validated diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/ModernPitchEngine.cpp Source/ModernPitchEngine.h Source/ControlRoomPage.cpp
          git commit -m 'Expose latched target revision diagnostics [skip ci]'
          git push origin HEAD:voice-aware-f0-parallel-golden-v1
