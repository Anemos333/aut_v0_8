name: Apply Single Wet Authority Fix

on:
  pull_request:
    branches:
      - clean-rewrite-musical-note-supervisor
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: single-wet-quality-reconstruction
          fetch-depth: 0
      - name: Apply correction-authority cleanup
        run: |
          python .github/tmp_single_wet_fix.py
          rm .github/tmp_single_wet_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/SingleWetSpectralRenderer.cpp .github/tmp_single_wet_fix.py
          git commit -m "Keep single-wet correction interval authoritative"
          git push origin HEAD:single-wet-quality-reconstruction
