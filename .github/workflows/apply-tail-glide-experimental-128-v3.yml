name: Apply Tail Glide Experimental 128 V3

on:
  push:
    branches: [quality-tail-glide-experimental-128-v3]
    paths:
      - 'Tests/TailGlideExperimental128V3Patch.py'
      - '.github/workflows/apply-tail-glide-experimental-128-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply guarded patch
        run: python3 Tests/TailGlideExperimental128V3Patch.py
      - name: Verify invariants before commit
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'EXPERIMENTAL_128_V3' Source/ModernPitchEngine.cpp
          grep -q 'case LatencyMode::ultraLive: return 128' Source/ModernPitchEngine.cpp
          grep -q 'TAIL_MELODIC_MICRO_GLIDE_V1' Source/ModernPitchEngine.cpp
          grep -q 'SHORT_LATTICE_COHERENT_PHASE_V3' Source/SingleWetSpectralRenderer.cpp
          test "$(grep -c 'SynthesisLayer layer_' Source/SingleWetSpectralRenderer.h)" -eq 1
          ! grep -Eq 'wetMix_|delayedDry|secondaryLayer|TransitionManager|array<SynthesisLayer|dryTrust_' Source/SingleWetSpectralRenderer.cpp Source/SingleWetSpectralRenderer.h
      - name: Materialize source and tests
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/ModernPitchEngine.cpp Source/SingleWetSpectralRenderer.cpp \
            Tests/SingleWetSpectralRendererTest.cpp Tests/CleanModernPitchEngineTest.cpp \
            Tests/GuiAudibilityTest.cpp Tests/SupervisorContinuityTest.cpp
          if git diff --cached --quiet; then
            echo 'No materialization change required'
          else
            git commit -m 'Materialize tail micro-glide and Experimental 128 V3'
            git push
          fi
