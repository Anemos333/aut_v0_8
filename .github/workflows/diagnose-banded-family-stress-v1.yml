name: Diagnose banded family stress v1
on:
  push:
    branches: [v1-continuous-f0-minimal-recomposition-v1]
    paths:
      - Tests/BandedFamilyStressDiagnostic.cpp
      - .github/workflows/diagnose-banded-family-stress-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: v1-continuous-f0-minimal-recomposition-v1 }
      - run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev >/dev/null
      - run: |
          cp Tests/BandedFamilyStressDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-banded-stress -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-banded-stress --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-banded-stress/clean-engine-tests/SupervisorContinuityTest | tee /tmp/banded-stress.log
          grep -q '^BANDED_FAMILY_STRESS ' /tmp/banded-stress.log
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,statistics
          rows=[]
          for line in Path('/tmp/banded-stress.log').read_text().splitlines():
              if not line.startswith('BANDED_FAMILY_STRESS '):continue
              d=dict(re.findall(r'(\w+)=([^ ]+)',line))
              for k in ['hz','snr','selected','abs_cents','contrast']:
                  d[k]=float(d[k])
              for k in ['family_correct','fine_correct','candidate_count']:
                  d[k]=int(d[k])
              rows.append(d)
          for kind in ['normal','strong_second','missing_fundamental','onset_burst']:
              for snr in [12.0,6.0,3.0,0.0]:
                  sub=[r for r in rows if r['kind']==kind and r['snr']==snr]
                  low=[r for r in sub if r['hz']<=220.0]
                  print('BANDED_FAMILY_STRESS_SUMMARY'
                        f' kind={kind} snr={snr:.1f} cases={len(sub)}'
                        f' family_fraction={sum(r["family_correct"] for r in sub)/len(sub):.6f}'
                        f' low_family_fraction={sum(r["family_correct"] for r in low)/len(low):.6f}'
                        f' fine_fraction={sum(r["fine_correct"] for r in sub)/len(sub):.6f}'
                        f' median_abs_cents={statistics.median(r["abs_cents"] for r in sub):.6f}'
                        f' worst_abs_cents={max(r["abs_cents"] for r in sub):.6f}')
          noise=[r for r in rows if r['kind']=='white']
          print('BANDED_FAMILY_STRESS_NOISE'
                f' n={len(noise)}'
                f' max_contrast={max(r["contrast"] for r in noise):.6f}'
                f' median_contrast={statistics.median(r["contrast"] for r in noise):.6f}'
                f' min_candidates={min(r["candidate_count"] for r in noise)}')
          PY
