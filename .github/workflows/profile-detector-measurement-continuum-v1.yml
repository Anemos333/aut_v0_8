name: Profile detector measurement continuum v1

on:
  push:
    branches:
      - v1-lean-scale-generation-ablation-v1
    paths:
      - Tests/DetectorMeasurementContinuumDiagnostic.cpp
      - .github/workflows/profile-detector-measurement-continuum-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: v1-lean-scale-generation-ablation-v1

      - name: Install build dependencies
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y             libasound2-dev libjack-jackd2-dev ladspa-sdk             libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev             libglu1-mesa-dev mesa-common-dev >/dev/null

      - name: Build diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cp Tests/DetectorMeasurementContinuumDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-measurement-continuum             -DCMAKE_BUILD_TYPE=Release             -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-measurement-continuum --config Release --parallel 2             --target SupervisorContinuityTest >/dev/null

      - name: Measure provisional continuum
        shell: bash
        run: |
          set -euo pipefail
          ./build-measurement-continuum/clean-engine-tests/SupervisorContinuityTest             2>&1 | tee /tmp/measurement-continuum.log
          grep -q '^MEASUREMENT_CONTINUUM ' /tmp/measurement-continuum.log
          echo 'MEASUREMENT_CONTINUUM_PROFILE=PASS'
