name: materialize-real-voice-bootstrap-v1

on:
  push:
    branches: [ simple-fix-from-quality-baseline ]

permissions:
  contents: write

jobs:
  validate-and-materialize:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simple-fix-from-quality-baseline
          fetch-depth: 0

      - name: Guard current architecture and frozen renderer
        run: |
          set -euo pipefail
          grep -Fq 'NO_AUDIO_DROPOUT_ON_UNCERTAINTY_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'SCALE_CELL_OWNS_SOFTNESS_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'DETECTOR_IS_OBSERVER_V1' Source/ModernPitchEngine.cpp
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "7eae364fc8974c10980c21fea739ed66b69b0e56"

      - name: Materialize real voice bootstrap patch
        run: |
          set -euo pipefail
          python3 Tests/MaterializeRealVoiceBootstrapV1.py

      - name: Verify bootstrap contract
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'REAL_VOICE_BOOTSTRAP_V1' Source/ModernPitchEngine.cpp
          grep -Fq 'hypothesis.confidence >= 0.40f' Source/ModernPitchEngine.cpp
          grep -Fq 'realVoiceBootstrapEvidence' Source/ModernPitchEngine.cpp
          grep -Fq 'real_voice_single_fresh_path_can_bootstrap_first_target' Tests/SupervisorContinuityTest.cpp
          grep -Fq 'weak_single_path_does_not_fabricate_first_f0' Tests/SupervisorContinuityTest.cpp
          test "$(git hash-object Source/SingleWetSpectralRenderer.cpp)" = "7eae364fc8974c10980c21fea739ed66b69b0e56"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure focused tests
        run: cmake -S . -B build-bootstrap -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON

      - name: Build focused tests
        run: cmake --build build-bootstrap --config Release --target CleanModernPitchEngineTest SupervisorContinuityTest SingleWetSpectralRendererTest GuiAudioControlContractTest GuiAudibilityTest --parallel 2

      - name: Run focused tests
        run: |
          set -euo pipefail
          ./build-bootstrap/clean-engine-tests/CleanModernPitchEngineTest
          ./build-bootstrap/clean-engine-tests/SupervisorContinuityTest
          ./build-bootstrap/clean-engine-tests/SingleWetSpectralRendererTest
          ./build-bootstrap/clean-engine-tests/GuiAudioControlContractTest
          ./build-bootstrap/clean-engine-tests/GuiAudibilityTest

      - name: Build VST3
        run: cmake --build build-bootstrap --config Release --target Neumaton_VST3 --parallel 2

      - name: Commit validated real voice bootstrap
        run: |
          set -euo pipefail
          rm -f Tests/MaterializeRealVoiceBootstrapV1.py
          rm -f .github/workflows/materialize-real-voice-bootstrap-v1.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bootstrap first scale target from real vocal evidence [skip ci]'
          git push origin HEAD:simple-fix-from-quality-baseline
