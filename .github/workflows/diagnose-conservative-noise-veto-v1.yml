name: Diagnose conservative noise veto v1
on:
  push:
    branches: [v1-continuous-f0-minimal-recomposition-v1]
    paths:
      - Tests/ConservativeNoiseVetoDiagnostic.cpp
      - .github/workflows/diagnose-conservative-noise-veto-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: v1-continuous-f0-minimal-recomposition-v1 }
      - run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libfontconfig-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev >/dev/null
      - run: |
          cp Tests/ConservativeNoiseVetoDiagnostic.cpp Tests/SupervisorContinuityTest.cpp
          cmake -S . -B build-noise-veto -DCMAKE_BUILD_TYPE=Release -DNEUMATON_BUILD_CLEAN_ENGINE_TESTS=ON >/dev/null
          cmake --build build-noise-veto --config Release --parallel 2 --target SupervisorContinuityTest >/dev/null
          ./build-noise-veto/clean-engine-tests/SupervisorContinuityTest | tee /tmp/noise-veto.log
          grep -q '^CONSERVATIVE_NOISE_VETO ' /tmp/noise-veto.log
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          rows=[]
          for line in Path('/tmp/noise-veto.log').read_text().splitlines():
              if not line.startswith('CONSERVATIVE_NOISE_VETO '):continue
              d=dict(re.findall(r'(\w+)=([^ ]+)',line));d['veto']=int(d['veto']);rows.append(d)
          for kind in ['normal','strong_second','missing_fundamental','pure_sine','onset_burst','white','colored','breath']:
              sub=[r for r in rows if r['kind']==kind]
              print('CONSERVATIVE_NOISE_VETO_SUMMARY'
                    f' kind={kind} n={len(sub)}'
                    f' veto_fraction={sum(r["veto"] for r in sub)/len(sub):.6f}'
                    f' veto_count={sum(r["veto"] for r in sub)}')
          PY
